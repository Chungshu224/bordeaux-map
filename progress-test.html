<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習進度系統測試</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft JhengHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    
    .test-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .test-section h2 {
      color: #333;
      margin-bottom: 16px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 8px;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    
    .btn-success {
      background: #4caf50;
      color: white;
    }
    
    .btn-success:hover {
      background: #45a049;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .btn-danger:hover {
      background: #da190b;
    }
    
    .btn-info {
      background: #2196f3;
      color: white;
    }
    
    .btn-info:hover {
      background: #0b7dda;
    }
    
    .stats-display {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    
    .stat-item {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #667eea;
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
    
    .log-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 12px;
    }
    
    .log-entry {
      margin: 4px 0;
      padding: 4px 0;
      border-bottom: 1px solid #333;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #858585;
      font-size: 11px;
    }
    
    .log-success {
      color: #4ec9b0;
    }
    
    .log-error {
      color: #f48771;
    }
    
    .log-info {
      color: #4fc1ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 學習進度系統測試工具</h1>
      <p>波爾多葡萄酒學院 - 進度追蹤功能驗證</p>
    </div>

    <!-- 會話管理測試 -->
    <div class="test-section">
      <h2>🎯 會話管理測試</h2>
      <div class="button-group">
        <button class="btn-primary" onclick="testStartSession()">開始新會話</button>
        <button class="btn-info" onclick="testPauseSession()">暫停會話</button>
        <button class="btn-info" onclick="testResumeSession()">恢復會話</button>
        <button class="btn-success" onclick="testEndSession()">結束會話</button>
      </div>
      <div id="session-status" class="stats-display">
        <strong>會話狀態:</strong> 無進行中的會話
      </div>
    </div>

    <!-- 投影片追蹤測試 -->
    <div class="test-section">
      <h2>📑 投影片追蹤測試</h2>
      <div class="button-group">
        <button class="btn-primary" onclick="testRecordSlide(0, 20)">瀏覽投影片 1</button>
        <button class="btn-primary" onclick="testRecordSlide(5, 20)">瀏覽投影片 6</button>
        <button class="btn-primary" onclick="testRecordSlide(10, 20)">瀏覽投影片 11</button>
        <button class="btn-primary" onclick="testRecordSlide(19, 20)">瀏覽投影片 20</button>
        <button class="btn-info" onclick="testGetProgress()">查看進度</button>
      </div>
      <div id="slide-progress" class="stats-display">
        點擊按鈕開始追蹤投影片...
      </div>
    </div>

    <!-- 測驗記錄測試 -->
    <div class="test-section">
      <h2>🎯 測驗記錄測試</h2>
      <div class="button-group">
        <button class="btn-success" onclick="testQuizAnswer(1, true)">答對題目 1</button>
        <button class="btn-danger" onclick="testQuizAnswer(2, false)">答錯題目 2</button>
        <button class="btn-success" onclick="testQuizAnswer(3, true)">答對題目 3</button>
        <button class="btn-success" onclick="testQuizAnswer(4, true)">答對題目 4</button>
        <button class="btn-info" onclick="testGetQuizStats()">查看統計</button>
      </div>
      <div id="quiz-stats" class="stats-display">
        點擊按鈕開始記錄測驗...
      </div>
    </div>

    <!-- 總體統計 -->
    <div class="test-section">
      <h2>📊 總體統計</h2>
      <div class="button-group">
        <button class="btn-primary" onclick="testOverallStats()">刷新統計</button>
        <button class="btn-info" onclick="testWeeklyTrend()">查看週趨勢</button>
        <button class="btn-success" onclick="testRecommendations()">獲取建議</button>
        <button class="btn-danger" onclick="testReset()">重置所有數據</button>
      </div>
      <div id="overall-stats" class="stats-grid"></div>
    </div>

    <!-- 日誌輸出 -->
    <div class="test-section">
      <h2>📝 操作日誌</h2>
      <button class="btn-danger" onclick="clearLog()">清空日誌</button>
      <div id="log-output" class="log-output">
        系統就緒，等待操作...
      </div>
    </div>
  </div>

  <script type="module">
    // 注意：這是一個簡化的測試頁面
    // 實際使用時需要正確導入 Vue 組件和 store

    // 模擬進度追蹤系統
    window.progressState = {
      currentSession: null,
      lessonProgress: {},
      studyTime: {},
      quizHistory: {},
      sessions: [],
      dailyStats: {}
    }

    window.currentTestLesson = 'test-lesson-1'
    window.currentTestLessonTitle = '測試課程：波爾多基礎'

    // 日誌函數
    function log(message, type = 'info') {
      const output = document.getElementById('log-output')
      const time = new Date().toLocaleTimeString('zh-TW')
      const colorClass = type === 'success' ? 'log-success' : 
                        type === 'error' ? 'log-error' : 'log-info'
      
      const entry = document.createElement('div')
      entry.className = 'log-entry'
      entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${message}</span>`
      
      output.appendChild(entry)
      output.scrollTop = output.scrollHeight
    }

    window.clearLog = function() {
      document.getElementById('log-output').innerHTML = '日誌已清空'
    }

    // 會話管理測試
    window.testStartSession = function() {
      if (progressState.currentSession) {
        log('⚠️ 已有進行中的會話，請先結束', 'error')
        return
      }

      progressState.currentSession = {
        id: `session-${Date.now()}`,
        lessonId: currentTestLesson,
        lessonTitle: currentTestLessonTitle,
        startTime: Date.now(),
        slidesViewed: new Set(),
        quizzesAttempted: 0,
        quizzesCorrect: 0,
        pausedTime: 0,
        isActive: true
      }

      document.getElementById('session-status').innerHTML = `
        <strong>會話狀態:</strong> 進行中<br>
        <strong>課程:</strong> ${currentTestLessonTitle}<br>
        <strong>開始時間:</strong> ${new Date().toLocaleTimeString('zh-TW')}
      `

      log(`✅ 開始學習會話: ${currentTestLessonTitle}`, 'success')
    }

    window.testPauseSession = function() {
      if (!progressState.currentSession) {
        log('⚠️ 沒有進行中的會話', 'error')
        return
      }

      progressState.currentSession.pauseStartTime = Date.now()
      log('⏸️ 學習會話已暫停', 'info')
    }

    window.testResumeSession = function() {
      if (!progressState.currentSession) {
        log('⚠️ 沒有進行中的會話', 'error')
        return
      }

      if (progressState.currentSession.pauseStartTime) {
        progressState.currentSession.pausedTime += Date.now() - progressState.currentSession.pauseStartTime
        progressState.currentSession.pauseStartTime = null
        log('▶️ 學習會話已繼續', 'success')
      }
    }

    window.testEndSession = function() {
      if (!progressState.currentSession) {
        log('⚠️ 沒有進行中的會話', 'error')
        return
      }

      const session = progressState.currentSession
      session.endTime = Date.now()
      session.duration = Math.floor((session.endTime - session.startTime - session.pausedTime) / 1000)
      
      progressState.sessions.push(session)
      
      // 更新學習時間
      if (!progressState.studyTime[session.lessonId]) {
        progressState.studyTime[session.lessonId] = 0
      }
      progressState.studyTime[session.lessonId] += session.duration

      log(`✅ 學習會話結束 - 時長: ${session.duration}秒, 瀏覽: ${session.slidesViewed.size}張投影片`, 'success')
      
      document.getElementById('session-status').innerHTML = `
        <strong>會話狀態:</strong> 已結束<br>
        <strong>學習時長:</strong> ${session.duration}秒<br>
        <strong>投影片:</strong> ${session.slidesViewed.size}張
      `

      progressState.currentSession = null
    }

    // 投影片追蹤測試
    window.testRecordSlide = function(slideIndex, totalSlides) {
      if (!progressState.lessonProgress[currentTestLesson]) {
        progressState.lessonProgress[currentTestLesson] = {
          slideIndex: 0,
          totalSlides: totalSlides,
          completedSlides: new Set(),
          lastVisited: Date.now()
        }
      }

      const progress = progressState.lessonProgress[currentTestLesson]
      progress.slideIndex = slideIndex
      progress.completedSlides.add(slideIndex)
      progress.lastVisited = Date.now()

      if (progressState.currentSession) {
        progressState.currentSession.slidesViewed.add(slideIndex)
      }

      const percent = Math.round((progress.completedSlides.size / progress.totalSlides) * 100)
      
      document.getElementById('slide-progress').innerHTML = `
        <strong>當前投影片:</strong> ${slideIndex + 1} / ${totalSlides}<br>
        <strong>已瀏覽:</strong> ${progress.completedSlides.size}張<br>
        <strong>完成度:</strong> ${percent}%
      `

      log(`📑 記錄投影片瀏覽: 第 ${slideIndex + 1} 張 (${percent}%)`, 'info')
    }

    window.testGetProgress = function() {
      const progress = progressState.lessonProgress[currentTestLesson]
      if (!progress) {
        log('⚠️ 還沒有進度記錄', 'error')
        return
      }

      const percent = Math.round((progress.completedSlides.size / progress.totalSlides) * 100)
      log(`📊 課程進度: ${percent}% (${progress.completedSlides.size}/${progress.totalSlides})`, 'success')
    }

    // 測驗記錄測試
    window.testQuizAnswer = function(slideIndex, correct) {
      if (!progressState.quizHistory[currentTestLesson]) {
        progressState.quizHistory[currentTestLesson] = []
      }

      progressState.quizHistory[currentTestLesson].push({
        slideIndex,
        correct,
        timestamp: Date.now()
      })

      if (progressState.currentSession) {
        progressState.currentSession.quizzesAttempted++
        if (correct) progressState.currentSession.quizzesCorrect++
      }

      const icon = correct ? '✅' : '❌'
      log(`${icon} 測驗答案記錄: 題目 ${slideIndex} - ${correct ? '正確' : '錯誤'}`, correct ? 'success' : 'error')
      
      testGetQuizStats()
    }

    window.testGetQuizStats = function() {
      const history = progressState.quizHistory[currentTestLesson] || []
      if (history.length === 0) {
        document.getElementById('quiz-stats').innerHTML = '還沒有測驗記錄'
        return
      }

      const correct = history.filter(q => q.correct).length
      const accuracy = Math.round((correct / history.length) * 100)

      document.getElementById('quiz-stats').innerHTML = `
        <strong>測驗總數:</strong> ${history.length}<br>
        <strong>答對:</strong> ${correct}<br>
        <strong>正確率:</strong> ${accuracy}%
      `

      log(`🎯 測驗統計: ${correct}/${history.length} (${accuracy}%)`, 'success')
    }

    // 總體統計測試
    window.testOverallStats = function() {
      const totalLessons = Object.keys(progressState.lessonProgress).length
      const totalStudyTime = Object.values(progressState.studyTime).reduce((sum, time) => sum + time, 0)
      const allQuizzes = Object.values(progressState.quizHistory).flat()
      const correctQuizzes = allQuizzes.filter(q => q.correct).length
      const accuracy = allQuizzes.length > 0 ? Math.round((correctQuizzes / allQuizzes.length) * 100) : 0

      const formatTime = (seconds) => {
        if (seconds < 60) return `${seconds}秒`
        const minutes = Math.floor(seconds / 60)
        return `${minutes}分鐘`
      }

      document.getElementById('overall-stats').innerHTML = `
        <div class="stat-item">
          <div class="stat-label">已學課程</div>
          <div class="stat-value">${totalLessons}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">總學習時間</div>
          <div class="stat-value">${formatTime(totalStudyTime)}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">測驗總數</div>
          <div class="stat-value">${allQuizzes.length}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">測驗正確率</div>
          <div class="stat-value">${accuracy}%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">學習會話</div>
          <div class="stat-value">${progressState.sessions.length}</div>
        </div>
      `

      log('📊 總體統計已更新', 'success')
    }

    window.testWeeklyTrend = function() {
      log('📈 週趨勢功能在完整版本中可用', 'info')
    }

    window.testRecommendations = function() {
      log('💡 學習建議功能在完整版本中可用', 'info')
    }

    window.testReset = function() {
      if (confirm('確定要重置所有測試數據嗎？')) {
        progressState.currentSession = null
        progressState.lessonProgress = {}
        progressState.studyTime = {}
        progressState.quizHistory = {}
        progressState.sessions = []
        
        document.getElementById('session-status').innerHTML = '<strong>會話狀態:</strong> 無進行中的會話'
        document.getElementById('slide-progress').innerHTML = '點擊按鈕開始追蹤投影片...'
        document.getElementById('quiz-stats').innerHTML = '點擊按鈕開始記錄測驗...'
        document.getElementById('overall-stats').innerHTML = ''
        
        log('🔄 所有數據已重置', 'success')
      }
    }

    // 初始化
    log('✅ 學習進度系統測試工具已就緒', 'success')
    log('💡 提示: 按順序測試 - 開始會話 → 瀏覽投影片 → 記錄測驗 → 結束會話 → 查看統計', 'info')
  </script>
</body>
</html>
