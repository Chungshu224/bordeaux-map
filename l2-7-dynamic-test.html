<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2-7 Saint-Émilion 課程測試 - 動態載入版本</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        .title {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        .status {
            margin: 2rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }
        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .test-results {
            margin-top: 2rem;
        }
        .test-item {
            margin: 1rem 0;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-item h3 {
            margin: 0 0 0.5rem 0;
            color: #333;
        }
        .test-item p {
            margin: 0.5rem 0;
            color: #666;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        .button:hover {
            background: #5a67d8;
        }
        .content-preview {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .slide-item {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-left: 4px solid #667eea;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🍷 L2-7 Saint-Émilion 課程測試</h1>
            <p class="subtitle">動態載入系統驗證</p>
        </div>

        <div id="status" class="status loading">
            <span class="loader"></span> 正在載入動態內容系統...
        </div>

        <div class="test-results">
            <div class="test-item">
                <h3>📊 系統狀態</h3>
                <p id="system-status">初始化中...</p>
            </div>

            <div class="test-item">
                <h3>🔍 內容載入測試</h3>
                <p id="content-status">等待測試...</p>
                <button class="button" onclick="testContentLoading()">測試 L2-7 載入</button>
                <button class="button" onclick="testContentLoading('l2-6')">測試 L2-6 載入</button>
                <button class="button" onclick="testContentLoading('unknown')">測試未知課程</button>
            </div>

            <div class="test-item">
                <h3>📝 課程內容預覽</h3>
                <div id="content-preview" class="content-preview">
                    <p>尚未載入內容</p>
                </div>
            </div>

            <div class="test-item">
                <h3>⚡ 性能測試</h3>
                <p id="performance-status">等待測試...</p>
                <button class="button" onclick="performanceTest()">執行性能測試</button>
            </div>
        </div>
    </div>

    <script type="module">
        // 模擬我們的 LessonContentManager
        class LessonContentManager {
            constructor() {
                this.contentCache = new Map()
            }

            async loadLesson(lessonId) {
                // 檢查緩存
                if (this.contentCache.has(lessonId)) {
                    console.log(`從緩存載入: ${lessonId}`)
                    return this.contentCache.get(lessonId)
                }

                // 模擬動態載入
                console.log(`動態載入: ${lessonId}`)
                
                try {
                    // 模擬載入延遲
                    await new Promise(resolve => setTimeout(resolve, 500))
                    
                    const content = await this.fetchLessonContent(lessonId)
                    
                    // 緩存內容
                    this.contentCache.set(lessonId, content)
                    
                    return content
                } catch (error) {
                    throw new Error(`載入課程 ${lessonId} 失敗: ${error.message}`)
                }
            }

            async fetchLessonContent(lessonId) {
                // 根據課程ID返回相應內容
                switch (lessonId) {
                    case 'l2-7':
                        return [
                            { type: 'title' },
                            {
                                title: '世界遺產地位與產區歷史',
                                highlights: [
                                    { id: 1, icon: '🏛️', title: '世界遺產', content: 'Saint-Émilion是UNESCO世界文化遺產產區' },
                                    { id: 2, icon: '⏳', title: '千年歷史', content: '自羅馬時代即有葡萄栽培傳統' }
                                ],
                                content: '<div class="saint-emilion-heritage"><p class="lead-text">Saint-Émilion是波爾多最古老的葡萄酒產區之一，1999年被列為UNESCO世界文化遺產...</p></div>',
                                hasMap: true,
                                mapFocus: 'RightBank-SaintEmilion',
                                quiz: {
                                    question: 'Saint-Émilion於哪一年被列為UNESCO世界文化遺產？',
                                    options: ['1985年', '1999年', '2005年', '2012年'],
                                    correct: 1,
                                    explanation: 'Saint-Émilion於1999年被UNESCO列為世界文化遺產。'
                                }
                            },
                            {
                                title: '頂級酒莊與分級制度',
                                highlights: [
                                    { id: 1, icon: '👑', title: '傳奇酒莊', content: 'Cheval Blanc、Ausone等世界頂級酒莊' },
                                    { id: 2, icon: '🏅', title: '分級制度', content: '獨特的Saint-Émilion分級體系' }
                                ],
                                content: '<div class="saint-emilion-chateaux"><p class="lead-text">Saint-Émilion擁有Cheval Blanc、Ausone等傳奇酒莊...</p></div>',
                                hasMap: true,
                                mapFocus: 'saint-emilion-chateaux',
                                quiz: {
                                    question: 'Saint-Émilion分級制度多久重新評定一次？',
                                    options: ['每3年', '每5年', '每10年', '每20年'],
                                    correct: 2,
                                    explanation: 'Saint-Émilion分級制度每10年重新評定一次。'
                                }
                            },
                            {
                                title: '風土區域、品種表現與投資價值',
                                highlights: [
                                    { id: 1, icon: '🌄', title: '多樣風土', content: '高原、坡地、平原三大區域風土差異' },
                                    { id: 2, icon: '💰', title: '投資潜力', content: '品牌價值與全球收藏熱潮' }
                                ],
                                content: '<div class="saint-emilion-style"><p class="lead-text">Saint-Émilion展現高原、坡地、平原三大風土區域...</p></div>',
                                hasMap: false,
                                quiz: {
                                    question: 'Saint-Émilion高原區域主要土壤類型是？',
                                    options: ['砂質土壤', '石灰岩土壤', '黏土土壤', '火山土壤'],
                                    correct: 1,
                                    explanation: 'Saint-Émilion高原區域以石灰岩土壤為主。'
                                }
                            }
                        ]
                    
                    case 'l2-6':
                        return [
                            { type: 'title' },
                            {
                                title: 'Pomerol 稀有性與地位',
                                highlights: [
                                    { id: 1, icon: '💎', title: '稀有產區', content: 'Pomerol是波爾多最小的優質產區' },
                                    { id: 2, icon: '👑', title: '頂級地位', content: 'Petrus等世界級酒莊的家園' }
                                ],
                                content: '<p>Pomerol是波爾多右岸最稀有的產區...</p>',
                                hasMap: true,
                                mapFocus: 'RightBank-Pomerol',
                                quiz: {
                                    question: 'Pomerol產區的面積大約是多少？',
                                    options: ['500公頃', '800公頃', '1200公頃', '1500公頃'],
                                    correct: 1,
                                    explanation: 'Pomerol產區面積約800公頃，是波爾多最小的優質產區之一。'
                                }
                            }
                        ]
                    
                    default:
                        throw new Error(`未知的課程ID: ${lessonId}`)
                }
            }
        }

        // 全局變數
        window.contentManager = new LessonContentManager()

        // 更新狀態函數
        function updateStatus(message, type = 'loading') {
            const statusEl = document.getElementById('status')
            statusEl.className = `status ${type}`
            
            if (type === 'loading') {
                statusEl.innerHTML = `<span class="loader"></span> ${message}`
            } else {
                statusEl.textContent = message
            }
        }

        function updateSystemStatus(message) {
            document.getElementById('system-status').textContent = message
        }

        function updateContentStatus(message) {
            document.getElementById('content-status').textContent = message
        }

        function updatePerformanceStatus(message) {
            document.getElementById('performance-status').textContent = message
        }

        function displayContent(content) {
            const previewEl = document.getElementById('content-preview')
            
            if (!content || content.length === 0) {
                previewEl.innerHTML = '<p>無內容可顯示</p>'
                return
            }

            let html = ''
            content.forEach((slide, index) => {
                if (slide.type === 'title') {
                    html += `<div class="slide-item"><strong>📝 標題頁面</strong></div>`
                } else {
                    html += `
                        <div class="slide-item">
                            <strong>🎯 幻燈片 ${index}: ${slide.title}</strong>
                            <p>重點數量: ${slide.highlights?.length || 0}</p>
                            <p>包含地圖: ${slide.hasMap ? '是' : '否'}</p>
                            <p>包含測驗: ${slide.quiz ? '是' : '否'}</p>
                        </div>
                    `
                }
            })
            
            previewEl.innerHTML = html
        }

        // 測試函數
        window.testContentLoading = async function(lessonId = 'l2-7') {
            updateContentStatus(`正在載入 ${lessonId}...`)
            
            const startTime = performance.now()
            
            try {
                const content = await window.contentManager.loadLesson(lessonId)
                const endTime = performance.now()
                const loadTime = Math.round(endTime - startTime)
                
                updateContentStatus(`✅ ${lessonId} 載入成功！(${loadTime}ms, ${content.length} 個幻燈片)`)
                displayContent(content)
                
            } catch (error) {
                const endTime = performance.now()
                const loadTime = Math.round(endTime - startTime)
                
                updateContentStatus(`❌ ${lessonId} 載入失敗: ${error.message} (${loadTime}ms)`)
                displayContent(null)
            }
        }

        window.performanceTest = async function() {
            updatePerformanceStatus('正在執行性能測試...')
            
            const tests = [
                { id: 'l2-7', name: 'Saint-Émilion' },
                { id: 'l2-6', name: 'Pomerol' },
                { id: 'l2-7', name: 'Saint-Émilion (緩存)' },
                { id: 'l2-6', name: 'Pomerol (緩存)' }
            ]
            
            let results = []
            
            for (const test of tests) {
                const startTime = performance.now()
                try {
                    await window.contentManager.loadLesson(test.id)
                    const endTime = performance.now()
                    results.push(`${test.name}: ${Math.round(endTime - startTime)}ms`)
                } catch (error) {
                    results.push(`${test.name}: 失敗`)
                }
            }
            
            updatePerformanceStatus(`性能測試完成: ${results.join(' | ')}`)
        }

        // 初始化
        setTimeout(() => {
            updateStatus('✅ 動態內容系統準備就緒', 'success')
            updateSystemStatus('LessonContentManager 已初始化')
            updateContentStatus('請點擊按鈕測試內容載入')
            updatePerformanceStatus('請點擊按鈕執行性能測試')
        }, 1000)
    </script>
</body>
</html>
