<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111015"/>
      <stop offset="50%" stop-color="#191B24"/>
      <stop offset="100%" stop-color="#1A181C"/>
    </linearGradient>

    <!-- Side Gradients -->
    <linearGradient id="pinotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1115"/>
      <stop offset="100%" stop-color="#16080A"/>
    </linearGradient>
    <linearGradient id="chardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2612"/>
      <stop offset="100%" stop-color="#151408"/>
    </linearGradient>

    <!-- Glow & Filters -->
    <filter id="shadow"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="glowRed"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGold"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#E2E8F0" font-size="24" font-weight="bold" letter-spacing="1">布根地兩大靈魂品種剖析</text>
  <text x="400" y="65" text-anchor="middle" fill="#8A9BB0" font-size="13">Pinot Noir &amp; Chardonnay: The Twin Souls of Bourgogne</text>

  <!-- Left Side: Pinot Noir -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="380" rx="10" fill="url(#pinotBg)" stroke="#8C2B3C" stroke-width="2"/>
    
    <!-- Header -->
    <circle cx="175" cy="-5" r="35" fill="#4A1420" stroke="#C43B54" stroke-width="2" filter="url(#glowRed)"/>
    <text x="175" y="5" text-anchor="middle" font-size="28">🍷</text>
    <text x="175" y="55" text-anchor="middle" fill="#F4899E" font-size="22" font-weight="bold">黑皮諾</text>
    <text x="175" y="75" text-anchor="middle" fill="#C43B54" font-size="14" font-style="italic">Pinot Noir ( 紅酒唯一品種 )</text>

    <!-- Characteristics -->
    <line x1="40" y1="100" x2="310" y2="100" stroke="#8C2B3C" stroke-width="1" stroke-dasharray="4,4"/>
    
    <text x="25" y="130" fill="#E2E8F0" font-size="14" font-weight="bold">🍇 生長特性：</text>
    <rect x="135" y="115" width="200" height="25" rx="4" fill="#3D141C"/>
    <text x="145" y="132" fill="#F4899E" font-size="13">皮薄、嬌貴、極易感染病害</text>
    
    <text x="25" y="165" fill="#E2E8F0" font-size="14" font-weight="bold">🌡️ 氣候需求：</text>
    <rect x="135" y="150" width="200" height="25" rx="4" fill="#3D141C"/>
    <text x="145" y="167" fill="#F4899E" font-size="13">需冷涼氣候，太熱失去優雅酸度</text>
    
    <text x="25" y="200" fill="#E2E8F0" font-size="14" font-weight="bold">🌍 風土表達：</text>
    <rect x="135" y="185" width="200" height="25" rx="4" fill="#3D141C"/>
    <text x="145" y="202" fill="#F4899E" font-size="13" font-weight="bold">極高（透明的品種）</text>

    <!-- Tasting Profile -->
    <line x1="40" y1="230" x2="310" y2="230" stroke="#8C2B3C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="175" y="255" text-anchor="middle" fill="#E2E8F0" font-size="15" font-weight="bold">典型香氣與口感 (Tasting Profile)</text>

    <g transform="translate(30, 275)">
      <circle cx="20" cy="15" r="20" fill="#240B10"/>
      <text x="20" y="21" text-anchor="middle" font-size="16">🍒</text>
      <text x="50" y="12" fill="#CBD5E1" font-size="12">紅色莓果</text>
      <text x="50" y="26" fill="#8A9BB0" font-size="10">(櫻桃/覆盆子)</text>
    </g>

    <g transform="translate(180, 275)">
      <circle cx="20" cy="15" r="20" fill="#240B10"/>
      <text x="20" y="21" text-anchor="middle" font-size="16">🍂</text>
      <text x="50" y="12" fill="#CBD5E1" font-size="12">森林地表</text>
      <text x="50" y="26" fill="#8A9BB0" font-size="10">(陳年發展出松露)</text>
    </g>

    <!-- Radar Chart Proxy / Stats -->
    <rect x="25" y="325" width="300" height="40" rx="4" fill="#3D141C"/>
    <text x="40" y="350" fill="#CBD5E1" font-size="13">單寧：低-中</text>
    <text x="160" y="350" fill="#CBD5E1" font-size="13">酸度：高</text>
    <text x="260" y="350" fill="#CBD5E1" font-size="13">酒體：中等</text>
  </g>

  <!-- Right Side: Chardonnay -->
  <g transform="translate(420, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="380" rx="10" fill="url(#chardBg)" stroke="#A68C2E" stroke-width="2"/>
    
    <!-- Header -->
    <circle cx="175" cy="-5" r="35" fill="#3D3512" stroke="#E5C74F" stroke-width="2" filter="url(#glowGold)"/>
    <text x="175" y="5" text-anchor="middle" font-size="28">🥂</text>
    <text x="175" y="55" text-anchor="middle" fill="#EAD57A" font-size="22" font-weight="bold">夏多內</text>
    <text x="175" y="75" text-anchor="middle" fill="#C4A63B" font-size="14" font-style="italic">Chardonnay ( 白酒核心品種 )</text>

    <!-- Characteristics -->
    <line x1="40" y1="100" x2="310" y2="100" stroke="#A68C2E" stroke-width="1" stroke-dasharray="4,4"/>
    
    <text x="25" y="130" fill="#E2E8F0" font-size="14" font-weight="bold">🌱 生長特性：</text>
    <rect x="135" y="115" width="200" height="25" rx="4" fill="#362E12"/>
    <text x="145" y="132" fill="#EAD57A" font-size="13">強壯、適應力極強、萌芽早防霜</text>
    
    <text x="25" y="165" fill="#E2E8F0" font-size="14" font-weight="bold">🌍 氣候需求：</text>
    <rect x="135" y="150" width="200" height="25" rx="4" fill="#362E12"/>
    <text x="145" y="167" fill="#EAD57A" font-size="13">隨氣候變形 (冷:柑橘 / 熱:熱帶果)</text>
    
    <text x="25" y="200" fill="#E2E8F0" font-size="14" font-weight="bold">🍷 釀造工藝：</text>
    <rect x="135" y="185" width="200" height="25" rx="4" fill="#362E12"/>
    <text x="145" y="202" fill="#EAD57A" font-size="13" font-weight="bold">極高可塑性 (橡木桶、酒渣接觸)</text>

    <!-- Tasting Profile -->
    <line x1="40" y1="230" x2="310" y2="230" stroke="#A68C2E" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="175" y="255" text-anchor="middle" fill="#E2E8F0" font-size="15" font-weight="bold">典型香氣與口感 (Tasting Profile)</text>

    <g transform="translate(30, 275)">
      <circle cx="20" cy="15" r="20" fill="#1C1808"/>
      <text x="20" y="21" text-anchor="middle" font-size="16">🍋</text>
      <text x="50" y="12" fill="#CBD5E1" font-size="12">青蘋果/柑橘</text>
      <text x="50" y="26" fill="#8A9BB0" font-size="10">(夏布利冷涼風格)</text>
    </g>

    <g transform="translate(180, 275)">
      <circle cx="20" cy="15" r="20" fill="#1C1808"/>
      <text x="20" y="21" text-anchor="middle" font-size="16">🧈</text>
      <text x="50" y="12" fill="#CBD5E1" font-size="12">奶油/烤榛果</text>
      <text x="50" y="26" fill="#8A9BB0" font-size="10">(伯恩丘橡木桶陳年)</text>
    </g>

    <!-- Radar Chart Proxy / Stats -->
    <rect x="25" y="325" width="300" height="40" rx="4" fill="#362E12"/>
    <text x="40" y="350" fill="#CBD5E1" font-size="13">果味：中-高</text>
    <text x="160" y="350" fill="#CBD5E1" font-size="13">酸度：中-高</text>
    <text x="260" y="350" fill="#CBD5E1" font-size="13">酒體：中-厚</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="30" fill="#0B1015" stroke="#475569" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" fill="#CBD5E1" font-size="20" font-weight="bold" font-style="italic">VS</text>
  </g>

  <!-- Note Footer -->
  <rect x="40" y="490" width="720" height="30" rx="4" fill="#0B1015" stroke="#1E293B" stroke-width="1"/>
  <text x="400" y="509" text-anchor="middle" fill="#6498D4" font-size="12">💡 兩者皆有極強的「風土敏感度」，但黑皮諾是「反映土壤的鏡子」，夏多內更像是「釀酒師與氣候的畫布」。</text>

</svg>