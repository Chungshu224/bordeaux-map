<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="50%" stop-color="#1A1C20"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <linearGradient id="meursaultGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pulignyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="chassagneGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="lightGlow"><feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FDE047" flood-opacity="0.12"/></filter>
    <filter id="kingGlow"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FCD34D" flood-opacity="0.8"/></filter>
  </defs>

  <rect width="800" height="640" fill="url(#bg)"/>

  <!-- 標題區（與說明框保留足夠間距）-->
  <text x="400" y="38" text-anchor="middle" fill="#FDF6E3" font-size="26" font-weight="bold" letter-spacing="2">伯恩丘「白酒金三角」風格光譜</text>
  <text x="400" y="60" text-anchor="middle" fill="#A8A29E" font-size="13" letter-spacing="1">The Golden Triangle of Côte de Beaune White Wines</text>

  <!-- 三角形線條（直接使用絕對座標，避免巢狀 transform 造成偏移）-->
  <!-- 頂點：Puligny 圓心(400,210)、Meursault 圓心(185,462)、Chassagne 圓心(615,462) -->
  <polygon points="400,210 185,462 615,462" fill="#FDE047" fill-opacity="0.04" filter="url(#lightGlow)"/>
  <line x1="400" y1="210" x2="185" y2="462" stroke="#FDE047" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="400" y1="210" x2="615" y2="462" stroke="#FDE047" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="185" y1="462" x2="615" y2="462" stroke="#CA8A04" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- 方向標籤：沿左右兩邊中點，旋轉貼合邊線，遠離各節點 -->
  <text transform="rotate(-49, 302, 336)" x="302" y="336" text-anchor="middle" fill="#CA8A04" font-size="11" opacity="0.7">往北 (更純淨)</text>
  <text transform="rotate(49, 498, 336)" x="498" y="336" text-anchor="middle" fill="#CA8A04" font-size="11" opacity="0.7">往南 (更雄渾)</text>

  <!-- 風味軸（左側） -->
  <g transform="translate(58, 205)">
    <text x="0" y="0" fill="#FDF6E3" font-size="13" font-weight="bold">風味風格軸</text>
    <path d="M 10 18 L 10 148 M 5 138 L 10 148 L 15 138 M 5 28 L 10 18 L 15 28" fill="none" stroke="#9CA3AF" stroke-width="2"/>
    <text x="25" y="28" fill="#9CA3AF" font-size="12">極致純淨、冷冽</text>
    <text x="25" y="148" fill="#9CA3AF" font-size="12">圓潤、飽滿、力量</text>
  </g>

  <!-- Node 1: Puligny-Montrachet（頂部）-->
  <!-- 說明框在標題下方、圓圈上方，完全不重疊 -->
  <!-- 說明框：絕對 y = 190-88 = 102，底部 y = 152；圓圈頂部 y = 190+20-45 = 165 → 間距 13px -->
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <rect x="-140" y="-88" width="280" height="50" rx="8" fill="#1C1917" stroke="#A16207" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-64" text-anchor="middle" fill="#FDF6E3" font-size="13" font-weight="bold">👑 鋼骨柔情（純淨、礦物、優雅）</text>
    <text x="0" y="-47" text-anchor="middle" fill="#D6D3D1" font-size="11">清冽酸度・白色花卉・明顯張力</text>
    <circle cx="0" cy="20" r="45" fill="#111317" stroke="url(#pulignyGold)" stroke-width="4"/>
    <circle cx="0" cy="20" r="41" fill="#1E2024"/>
    <text x="0" y="14" text-anchor="middle" fill="#FEF08A" font-size="15" font-weight="bold">Puligny</text>
    <text x="0" y="32" text-anchor="middle" fill="#FEF08A" font-size="15" font-weight="bold">Montrachet</text>
  </g>

  <!-- Node 2: Meursault（左下）-->
  <!-- 說明框在圓圈下方：絕對 y = 447+75 = 522，底部 = 572 -->
  <g transform="translate(185, 447)" filter="url(#shadow)">
    <circle cx="0" cy="15" r="45" fill="#111317" stroke="url(#meursaultGold)" stroke-width="4"/>
    <circle cx="0" cy="15" r="41" fill="#1E2024"/>
    <text x="0" y="21" text-anchor="middle" fill="#FBBF24" font-size="18" font-weight="bold">Meursault</text>
    <rect x="-140" y="75" width="280" height="50" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="97" text-anchor="middle" fill="#FDF6E3" font-size="13" font-weight="bold">🧈 豐滿華麗（圓潤、奶油、堅果）</text>
    <text x="0" y="114" text-anchor="middle" fill="#D6D3D1" font-size="11">溫暖烤榛果・飽滿酒體・熱乳油木</text>
  </g>

  <!-- Node 3: Chassagne-Montrachet（右下）-->
  <!-- 說明框在圓圈下方：絕對 y = 447+75 = 522，底部 = 572 -->
  <g transform="translate(615, 447)" filter="url(#shadow)">
    <circle cx="0" cy="15" r="45" fill="#111317" stroke="url(#chassagneGold)" stroke-width="4"/>
    <circle cx="0" cy="15" r="41" fill="#1E2024"/>
    <text x="0" y="9" text-anchor="middle" fill="#FDE047" font-size="15" font-weight="bold">Chassagne</text>
    <text x="0" y="27" text-anchor="middle" fill="#FDE047" font-size="15" font-weight="bold">Montrachet</text>
    <rect x="-140" y="75" width="280" height="50" rx="8" fill="#1C1917" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="97" text-anchor="middle" fill="#FDF6E3" font-size="13" font-weight="bold">💪 剛健有力（雄厚、蜂蜜、黃果）</text>
    <text x="0" y="114" text-anchor="middle" fill="#D6D3D1" font-size="11">洋槐蜂蜜・堅實骨架・力量深邃</text>
  </g>

  <!-- Le Montrachet（中央） -->
  <!-- 圓圈中心 (400, 430)，文字在 y=460–498，說明框頂 y=522 → 完全不重疊 -->
  <g transform="translate(400, 450)" filter="url(#shadow)">
    <path d="M-150,-5 Q0,-20 150,-5" fill="none" stroke="#FBBF24" stroke-width="5" stroke-opacity="0.3" filter="url(#kingGlow)"/>
    <circle cx="0" cy="-20" r="30" fill="#2C2310" stroke="#FDE047" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-size="22">🍷</text>
    <text x="0" y="20" text-anchor="middle" fill="#FCD34D" font-size="17" font-weight="bold" filter="url(#kingGlow)">Le Montrachet</text>
    <text x="0" y="38" text-anchor="middle" fill="#FDE047" font-size="12" font-weight="bold">「白酒之王」</text>
    <text x="0" y="54" text-anchor="middle" fill="#CA8A04" font-size="11">橫跨普里尼與夏山兩村的完美平衡</text>
  </g>

  <!-- 頁尾說明框 -->
  <rect x="40" y="586" width="720" height="38" rx="6" fill="#1C1917" stroke="#3F3F46" stroke-width="1"/>
  <text x="400" y="610" text-anchor="middle" fill="#D6D3D1" font-size="12">✨ <tspan fill="#FBBF24" font-weight="bold">核心心法：</tspan>若將霞多麗比喻為畫，<tspan fill="#FDE047">Puligny</tspan> 是精密的素描，<tspan fill="#FCD34D">Meursault</tspan> 是華麗的油畫，<tspan fill="#EA580C">Chassagne</tspan> 則是立體的雕塑。</text>

</svg>