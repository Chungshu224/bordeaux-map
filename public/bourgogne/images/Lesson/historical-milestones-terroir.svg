<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b" /> <!-- Slate dark -->
      <stop offset="100%" stop-color="#0f0f13" /> <!-- Deeper black -->
    </linearGradient>

    <!-- Timeline line gradient -->
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow & Shadows -->
    <filter id="glowGold"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.6"/></filter>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  
  <!-- Faint map contours in background -->
  <path d="M-100,50 Q100,100 200,-50 T500,150 T900,100" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.5"/>
  <path d="M-50,350 Q150,250 300,450 T600,350 T900,500" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold" letter-spacing="2">布根地風土歷史演進時間軸</text>
  <text x="400" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Historical Milestones of Burgundy Terroir (11th C. - 2015)</text>

  <!-- Central Timeline Axis -->
  <rect x="50" y="280" width="700" height="4" rx="2" fill="url(#timelineGrad)" filter="url(#shadow)"/>

  <!-- Milestone 1: Cistercians (Top) -->
  <g transform="translate(120, 280)">
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" filter="url(#glowGold)"/>
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    
    <rect x="-80" y="-180" width="160" height="85" rx="6" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
    <text x="0" y="-155" text-anchor="middle" fill="#fcd34d" font-size="18" font-weight="bold">1098-12th C.</text>
    <text x="0" y="-135" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">西多會與 Clos</text>
    <text x="0" y="-115" text-anchor="middle" fill="#94a3b8" font-size="11">修士奠定地塊分級</text>
    <text x="0" y="-102" text-anchor="middle" fill="#94a3b8" font-size="11">築牆確立風土邊界</text>
  </g>

  <!-- Milestone 2: French Revolution (Bottom) -->
  <g transform="translate(260, 280)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
    
    <rect x="-80" y="85" width="160" height="85" rx="6" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
    <text x="0" y="110" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold">1789</text>
    <text x="0" y="130" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">法國大革命</text>
    <text x="0" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">教會土地沒收充公</text>
    <text x="0" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">拿破崙法典致土地碎化</text>
  </g>

  <!-- Milestone 3: Phylloxera (Top) -->
  <g transform="translate(400, 280)">
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="10" fill="#1e1b4b" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#ef4444"/>
    
    <rect x="-80" y="-190" width="160" height="85" rx="6" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
    <text x="0" y="-165" text-anchor="middle" fill="#fca5a5" font-size="18" font-weight="bold">1878</text>
    <text x="0" y="-145" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">根瘤蚜蟲病</text>
    <text x="0" y="-125" text-anchor="middle" fill="#94a3b8" font-size="11">幾乎摧毀全境葡萄園</text>
    <text x="0" y="-112" text-anchor="middle" fill="#94a3b8" font-size="11">嫁接美洲砧木重生</text>
  </g>

  <!-- Milestone 4: AOC System (Bottom) -->
  <g transform="translate(540, 280)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    
    <rect x="-80" y="85" width="160" height="85" rx="6" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
    <text x="0" y="110" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="bold">1935-1936</text>
    <text x="0" y="130" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">AOC 制度確立</text>
    <text x="0" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">INAO 正式成立</text>
    <text x="0" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">法定地塊名稱與生產規範</text>
  </g>

  <!-- Milestone 5: UNESCO (Top) -->
  <g transform="translate(680, 280)">
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3" filter="url(#glowGold)"/>
    <circle cx="0" cy="0" r="4" fill="#a78bfa"/>
    
    <rect x="-80" y="-180" width="160" height="85" rx="6" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
    <text x="0" y="-155" text-anchor="middle" fill="#c4b5fd" font-size="18" font-weight="bold">2015</text>
    <text x="0" y="-135" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">世界遺產認證</text>
    <text x="0" y="-115" text-anchor="middle" fill="#94a3b8" font-size="11">布根地 1,247 個</text>
    <text x="0" y="-102" text-anchor="middle" fill="#94a3b8" font-size="11">"Climats" 登錄聯合國名錄</text>
  </g>

  <!-- Bottom Insight Banner -->
  <g transform="translate(40, 500)">
    <rect x="0" y="0" width="720" height="40" rx="6" fill="#09090b" stroke="#334155" stroke-width="1"/>
    <text x="360" y="25" text-anchor="middle" fill="#e2e8f0" font-size="13">💡 <tspan fill="#f59e0b" font-weight="bold">歷史的累積：</tspan>布根地今日「一塊地一種酒」的極致微觀信仰，並非商業行銷，而是經歷千年無數危機與法制改革的文化結晶。</text>
  </g>

</svg>