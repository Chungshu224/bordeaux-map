<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>   <!-- Dark blue gray -->
      <stop offset="50%" stop-color="#09090B"/>  <!-- Zinc darkest -->
      <stop offset="100%" stop-color="#271011"/> <!-- Black/red base -->
    </linearGradient>

    <!-- Cool Gradient -->
    <linearGradient id="coolGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/> <!-- Cyan -->
      <stop offset="100%" stop-color="#3B82F6"/> <!-- Purple-blue -->
    </linearGradient>

    <!-- Warm Gradient -->
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/> <!-- Amber -->
      <stop offset="100%" stop-color="#EF4444"/> <!-- Red -->
    </linearGradient>

    <!-- Golden/Brass Gradient for Scale -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="50%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Glows -->
    <filter id="glowCool"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0EA5E9" flood-opacity="0.3"/></filter>
    <filter id="glowWarm"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#EF4444" flood-opacity="0.3"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgGrad)"/>

  <!-- Grid / Decorative Background -->
  <path d="M0,260 L800,260" stroke="#FFFFFF" stroke-opacity="0.05" stroke-dasharray="4,4"/>
  <circle cx="400" cy="260" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>
  <circle cx="400" cy="260" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Titles -->
  <text x="400" y="45" text-anchor="middle" fill="#F8FAFC" font-size="28" font-weight="bold" letter-spacing="2">年份密碼：冷涼年份 vs 炎熱年份</text>
  <text x="400" y="70" text-anchor="middle" fill="#9CA3AF" font-size="14">Cool vs Hot Vintages: The Delicate Balance of Terroir</text>

  <!-- The Scale Pivot and Base -->
  <g transform="translate(400, 230)" filter="url(#shadow)">
    <!-- Base pyramid -->
    <path d="M-80,220 L80,220 L60,200 L-60,200 Z" fill="url(#goldGrad)"/>
    <path d="M-60,200 L60,200 L40,160 L-40,160 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Pillar -->
    <rect x="-12" y="0" width="24" height="160" rx="3" fill="url(#goldGrad)"/>
    <!-- Center Pin -->
    <circle cx="0" cy="0" r="15" fill="#18181B" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- The Beam -->
  <g transform="translate(400, 230)">
    <rect x="-260" y="-8" width="520" height="16" rx="8" fill="url(#goldGrad)" filter="url(#shadow)"/>
  </g>

  <!-- Left Side: Cool Vintage -->
  <g transform="translate(140, 230)">
    <!-- Chains -->
    <path d="M0,0 L-60,110 M0,0 L60,110 M0,0 L0,110" stroke="#A1A1AA" stroke-width="1.5" opacity="0.6"/>
    <!-- Pan -->
    <path d="M-70,110 Q0,140 70,110 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
    
    <!-- Element: Ice/Water drop / Cool Vibe -->
    <circle cx="0" cy="90" r="25" fill="#0F172A" stroke="url(#coolGrad)" stroke-width="3" filter="url(#glowCool)"/>
    <text x="0" y="96" text-anchor="middle" fill="#38BDF8" font-size="18">❄️</text>

    <!-- Info Box for Cool -->
    <rect x="-100" y="-150" width="200" height="120" rx="8" fill="#1E293B" stroke="url(#coolGrad)" stroke-width="2" opacity="0.95" filter="url(#shadow)"/>
    <text x="0" y="-120" text-anchor="middle" fill="#38BDF8" font-size="18" font-weight="bold">冷涼年份 (Cool)</text>
    
    <text x="-80" y="-90" fill="#E2E8F0" font-size="13">▪ 更高的酸度 (Acidity)</text>
    <text x="-80" y="-70" fill="#E2E8F0" font-size="13">▪ 紅色漿果主導</text>
    <text x="-80" y="-50" fill="#E2E8F0" font-size="13">▪ 清新、輕盈優雅</text>

    <!-- Years badge -->
    <rect x="-100" y="-10" width="200" height="26" rx="4" fill="#0F172A" stroke="#38BDF8"/>
    <text x="0" y="7" text-anchor="middle" fill="#BAE6FD" font-size="12" font-weight="bold">代表年份: '08, '10, '13, '21</text>
  </g>

  <!-- Right Side: Warm/Hot Vintage -->
  <g transform="translate(660, 230)">
    <!-- Chains -->
    <path d="M0,0 L-60,110 M0,0 L60,110 M0,0 L0,110" stroke="#A1A1AA" stroke-width="1.5" opacity="0.6"/>
    <!-- Pan -->
    <path d="M-70,110 Q0,140 70,110 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
    
    <!-- Element: Sun / Warm Vibe -->
    <circle cx="0" cy="90" r="25" fill="#271011" stroke="url(#warmGrad)" stroke-width="3" filter="url(#glowWarm)"/>
    <text x="0" y="97" text-anchor="middle" fill="#FB923C" font-size="20">☀️</text>

    <!-- Info Box for Warm -->
    <rect x="-100" y="-150" width="200" height="120" rx="8" fill="#450A0A" stroke="url(#warmGrad)" stroke-width="2" opacity="0.95" filter="url(#shadow)"/>
    <text x="0" y="-120" text-anchor="middle" fill="#FCA5A5" font-size="18" font-weight="bold">炎熱年份 (Warm)</text>
    
    <text x="-80" y="-90" fill="#FEE2E2" font-size="13">▪ 更高的酒精度 (Alcohol)</text>
    <text x="-80" y="-70" fill="#FEE2E2" font-size="13">▪ 黑色水果、果醬感</text>
    <text x="-80" y="-50" fill="#FEE2E2" font-size="13">▪ 飽滿酒體、成熟單寧</text>

    <!-- Years badge -->
    <rect x="-100" y="-10" width="200" height="26" rx="4" fill="#2A0606" stroke="#FCA5A5"/>
    <text x="0" y="7" text-anchor="middle" fill="#FECACA" font-size="12" font-weight="bold">代表年份: '09, '15, '18, '20</text>
  </g>

  <!-- Central Terroir Tag -->
  <g transform="translate(400, 310)">
    <rect x="-90" y="0" width="180" height="34" rx="17" fill="#18181B" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="bold">⚖️ 風土的天平</text>
  </g>

  <!-- Bottom Quote -->
  <rect x="40" y="470" width="720" height="40" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  <text x="400" y="495" text-anchor="middle" fill="#9CA3AF" font-size="13">💡 <tspan fill="#F8FAFC" font-weight="bold">重點：</tspan>布根地沒有絕對的好壞年份，只有風格差異。懂酒的人在冷涼年份找特級園（酸度撐起陳年結構），在炎熱年份找大區級（果熟易飲）。</text>

</svg>