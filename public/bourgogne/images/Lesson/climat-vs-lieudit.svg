<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/> <!-- Zinc 900 -->
      <stop offset="50%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#141110"/>
    </linearGradient>

    <!-- Fill Gradients -->
    <linearGradient id="climatFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lieuditFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="glowClimat"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6"/></filter>
    <filter id="glowLieudit"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#F3F4F6" font-size="28" font-weight="bold" letter-spacing="1">Climat 與 Lieu-dit：地塊概念解析</text>
  <text x="400" y="68" text-anchor="middle" fill="#9CA3AF" font-size="14" letter-spacing="1">Understanding Burgundy's Complex Vineyard Terminology</text>

  <!-- Top Definition Cards -->
  <!-- Lieu-dit -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="150" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="160" y="35" text-anchor="middle" fill="#38BDF8" font-size="22" font-weight="bold" font-style="italic">Lieu-dit</text>
    <text x="160" y="55" text-anchor="middle" fill="#BAE6FD" font-size="13">「被指名的地方」(Local Name)</text>
    
    <line x1="40" y1="70" x2="280" y2="70" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <text x="25" y="95" fill="#E2E8F0" font-size="13">📌 <tspan fill="#7DD3FC" font-weight="bold">本質：</tspan>行政與地籍劃分概念</text>
    <text x="25" y="120" fill="#E2E8F0" font-size="13">📜 <tspan fill="#7DD3FC" font-weight="bold">來源：</tspan>歷史地籍圖上的傳統俗稱</text>
    <text x="25" y="140" fill="#9CA3AF" font-size="12">(通常依據歷史事件、地形或植被命名)</text>
  </g>

  <!-- Climat -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="150" rx="8" fill="#29211A" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="35" text-anchor="middle" fill="#F59E0B" font-size="22" font-weight="bold" font-style="italic">Climat</text>
    <text x="160" y="55" text-anchor="middle" fill="#FDE68A" font-size="13">「風土氣候區」(Specific Terroir)</text>
    
    <line x1="40" y1="70" x2="280" y2="70" stroke="#45311F" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <text x="25" y="95" fill="#E2E8F0" font-size="13">🍷 <tspan fill="#FCD34D" font-weight="bold">本質：</tspan>釀酒學與 AOC 法律概念</text>
    <text x="25" y="120" fill="#E2E8F0" font-size="13">⚖️ <tspan fill="#FCD34D" font-weight="bold">來源：</tspan>擁有特定風土並被 INAO 認可的地塊</text>
    <text x="25" y="140" fill="#9CA3AF" font-size="12">(專指布根地具備特定釀酒特徵的葡萄園)</text>
  </g>

  <!-- The "VS" badge -->
  <g transform="translate(400, 185)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#18181B" stroke="#4B5563" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#D1D5DB" font-size="14" font-weight="bold">VS</text>
  </g>

  <!-- Title for relations -->
  <text x="400" y="315" text-anchor="middle" fill="#F3F4F6" font-size="18" font-weight="bold">三種交錯的現實情況 (Relationship Scenarios)</text>

  <!-- Relation 1: 1=1 -->
  <g transform="translate(130, 360)">
    <text x="0" y="-15" text-anchor="middle" fill="#D1D5DB" font-size="14" font-weight="bold">情況一：完美重合</text>
    
    <!-- Squares -->
    <rect x="-45" y="5" width="90" height="90" rx="4" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8,4"/>
    <rect x="-40" y="10" width="80" height="80" rx="3" fill="url(#climatFill)" stroke="#F59E0B" stroke-width="3" filter="url(#glowClimat)"/>
    
    <text x="0" y="45" text-anchor="middle" fill="#FDE68A" font-size="11">1個 Climat</text>
    <text x="0" y="65" text-anchor="middle" fill="#BAE6FD" font-size="11">= 1個 Lieu-dit</text>
    
    <text x="0" y="125" text-anchor="middle" fill="#9CA3AF" font-size="12">最常見的情況</text>
  </g>

  <!-- Relation 2: 1 Climat = Multiple Lieu-dit -->
  <g transform="translate(400, 360)">
    <text x="0" y="-15" text-anchor="middle" fill="#D1D5DB" font-size="14" font-weight="bold">情況二：一概全</text>
    
    <!-- Big Climat containing small Lieux-dits -->
    <rect x="-60" y="5" width="120" height="90" rx="4" fill="url(#climatFill)" stroke="#F59E0B" stroke-width="3" filter="url(#glowClimat)"/>
    <text x="0" y="22" text-anchor="middle" fill="#FDE68A" font-size="12" font-weight="bold">Grand Cru : Clos de Vougeot</text>
    
    <rect x="-50" y="35" width="45" height="50" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="5" y="35" width="45" height="20" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="5" y="65" width="45" height="20" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,2"/>

    <text x="-27" y="65" text-anchor="middle" fill="#BAE6FD" font-size="10">Lieu-dit A</text>
    <text x="27" y="50" text-anchor="middle" fill="#BAE6FD" font-size="9">Lieu-dit B</text>
    <text x="27" y="80" text-anchor="middle" fill="#BAE6FD" font-size="9">Lieu-dit C</text>

    <text x="0" y="125" text-anchor="middle" fill="#9CA3AF" font-size="12">1個大 Climat (特級園/一級園)</text>
    <text x="0" y="145" text-anchor="middle" fill="#9CA3AF" font-size="12">涵蓋多個不同的 Lieu-dits</text>
  </g>

  <!-- Relation 3: 1 Lieu-dit = Multiple Climats -->
  <g transform="translate(670, 360)">
    <text x="0" y="-15" text-anchor="middle" fill="#D1D5DB" font-size="14" font-weight="bold">情況三：被分割</text>
    
    <!-- Big Lieu-dit split into climats -->
    <rect x="-55" y="5" width="110" height="90" rx="4" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="0" y="90" text-anchor="middle" fill="#BAE6FD" font-size="11" font-weight="bold">同一個 Lieu-dit 地籍名稱</text>

    <rect x="-45" y="15" width="90" height="35" fill="url(#climatFill)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="-45" y="50" width="90" height="25" fill="#3F3F46" stroke="#9CA3AF" stroke-width="1.5"/>

    <text x="0" y="38" text-anchor="middle" fill="#FDE68A" font-size="11">Climat A (一級園)</text>
    <text x="0" y="66" text-anchor="middle" fill="#D1D5DB" font-size="10">Climat B (村莊級)</text>

    <text x="0" y="125" text-anchor="middle" fill="#9CA3AF" font-size="12">同一個 Lieu-dit 卻因為風土差異</text>
    <text x="0" y="145" text-anchor="middle" fill="#9CA3AF" font-size="12">被 INAO 劃分為不同等級的 Climats</text>
  </g>

  <!-- Key Rule Footer -->
  <rect x="40" y="520" width="720" height="40" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="400" y="545" text-anchor="middle" fill="#9CA3AF" font-size="13">💡 <tspan fill="#F3F4F6" font-weight="bold">一言以蔽之：</tspan>Lieu-dit 像是地圖上的「門牌號碼」，而 Climat 則是被官方認證具有完美「靈魂與履歷」的特權地塊。</text>

</svg>