<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgSE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0e10"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
    <filter id="shSE"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgSE)"/>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#C0952C" font-size="21" font-weight="bold">Saint-Estèphe　Power of the Northern Fortress</text>
  <text x="400" y="60" text-anchor="middle" fill="#9A7040" font-size="12">Northernmost Médoc · highest clay content · strongest structure · demands patience</text>

  <!-- Left: soil analysis -->
  <rect x="40" y="82" width="345" height="290" rx="8" fill="#10120E" stroke="#5A7040" stroke-width="1.5" filter="url(#shSE)"/>
  <rect x="40" y="82" width="345" height="50" rx="8" fill="#3A5028"/>
  <rect x="40" y="112" width="345" height="20" fill="#3A5028"/>
  <text x="212" y="108" text-anchor="middle" fill="#D0F0A0" font-size="16" font-weight="bold">🪨 Soil Character</text>
  <text x="212" y="126" text-anchor="middle" fill="#88AA68" font-size="11">Highest clay proportion in Médoc</text>

  <!-- Soil composition bar chart -->
  <text x="60" y="155" fill="#80B060" font-size="12" font-weight="bold">Soil Composition Comparison (relative)</text>

  <!-- Saint-Estèphe soil bars -->
  <text x="60" y="176" fill="#C0D0A0" font-size="11" font-weight="bold">Saint-Estèphe</text>
  <text x="60" y="192" fill="#C0D0A0" font-size="10">Clay</text>
  <rect x="105" y="182" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="182" width="145" height="13" rx="3" fill="#6A9840" opacity="0.9"/>
  <text x="310" y="193" fill="#80B060" font-size="10">35%+</text>
  <text x="60" y="208" fill="#C0D0A0" font-size="10">Gravel</text>
  <rect x="105" y="198" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="198" width="90" height="13" rx="3" fill="#9A8850" opacity="0.8"/>
  <text x="310" y="209" fill="#A09070" font-size="10">~25%</text>

  <text x="60" y="228" fill="#C0D0A0" font-size="11" font-weight="bold">Pauillac (for comparison)</text>
  <text x="60" y="244" fill="#B0C090" font-size="10">Clay</text>
  <rect x="105" y="234" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="234" width="50" height="13" rx="3" fill="#6A9840" opacity="0.5"/>
  <text x="310" y="245" fill="#708860" font-size="10">~10%</text>
  <text x="60" y="260" fill="#B0C090" font-size="10">Gravel</text>
  <rect x="105" y="250" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="250" width="180" height="13" rx="3" fill="#9A8850" opacity="0.8"/>
  <text x="310" y="261" fill="#A09070" font-size="10">~60%+</text>

  <text x="60" y="288" fill="#80B060" font-size="12" font-weight="bold">Role of Clay</text>
  <rect x="60" y="295" width="310" height="65" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="75" y="311" fill="#A0C880" font-size="11">✓ Strong water retention → stable supply in drought years</text>
  <text x="75" y="326" fill="#A0C880" font-size="11">✓ Cooler temperatures → delayed ripening → higher acidity</text>
  <text x="75" y="342" fill="#A0C880" font-size="11">✓ Mineral-rich → imparts deep mineral character</text>
  <text x="75" y="357" fill="#A0C880" font-size="11">⚠ Poorer drainage → waterlogging risk in wet seasons</text>

  <!-- Right: style -->
  <rect x="415" y="82" width="345" height="290" rx="8" fill="#10120E" stroke="#5A7040" stroke-width="1.5" filter="url(#shSE)"/>
  <rect x="415" y="82" width="345" height="50" rx="8" fill="#3A5028"/>
  <rect x="415" y="112" width="345" height="20" fill="#3A5028"/>
  <text x="588" y="108" text-anchor="middle" fill="#D0F0A0" font-size="16" font-weight="bold">🍷 Style & Key Estates</text>
  <text x="588" y="126" text-anchor="middle" fill="#88AA68" font-size="11">Style Profile &amp; Key Châteaux</text>

  <text x="435" y="155" fill="#80B060" font-size="12" font-weight="bold">Style Keywords</text>
  <rect x="435" y="162" width="308" height="72" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="450" y="178" fill="#C0E890" font-size="12">• Firmest tannins, imposing structure</text>
  <text x="450" y="194" fill="#C0E890" font-size="12">• Black fruits · minerality · tobacco</text>
  <text x="450" y="210" fill="#C0E890" font-size="12">• High acidity · full body</text>
  <text x="450" y="226" fill="#C0E890" font-size="12">• Needs at least 10–15 years to begin showing its best</text>

  <text x="435" y="252" fill="#80B060" font-size="12" font-weight="bold">Key Estates</text>
  <rect x="435" y="259" width="308" height="96" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="450" y="276" fill="#FFD080" font-size="13" font-weight="bold">Cos d'Estournel　Second Growth</text>
  <text x="450" y="292" fill="#C0A860" font-size="11">Most celebrated in Saint-Estèphe · Oriental architecture · rich and concentrated</text>
  <text x="450" y="310" fill="#D0B070" font-size="13" font-weight="bold">Château Montrose　Second Growth</text>
  <text x="450" y="326" fill="#C0A860" font-size="11">Most traditional St-Estèphe style · powerful, age-worthy · firm tannins</text>
  <text x="450" y="345" fill="#A09060" font-size="11">Calon-Ségur (Third Growth) · Lafon-Rochet (Fourth Growth)</text>

  <!-- Bottom: North vs South comparison -->
  <rect x="40" y="386" width="720" height="100" rx="8" fill="#0C0E0A" stroke="#5A7040" stroke-width="1" stroke-opacity="0.5" filter="url(#shSE)"/>
  <text x="400" y="408" text-anchor="middle" fill="#C0952C" font-size="14" font-weight="bold">Médoc North–South Style Gradient (south to north)</text>
  <line x1="60" y1="414" x2="740" y2="414" stroke="#5A7040" stroke-width="0.5" opacity="0.5"/>

  <!-- Arrow from south to north -->
  <text x="55" y="448" fill="#888" font-size="11">← South</text>
  <line x1="88" y1="445" x2="712" y2="445" stroke="#4A6030" stroke-width="1.5"/>
  <polygon points="712,445 700,441 700,449" fill="#4A6030"/>
  <text x="720" y="448" fill="#888" font-size="11">North →</text>

  <!-- Region labels on line -->
  <text x="108" y="438" text-anchor="middle" fill="#FF7090" font-size="11" font-weight="bold">Margaux</text>
  <line x1="108" y1="440" x2="108" y2="445" stroke="#FF7090" stroke-width="1"/>
  <text x="108" y="468" text-anchor="middle" fill="#CC5070" font-size="10">Most Elegant</text>
  <text x="108" y="480" text-anchor="middle" fill="#CC5070" font-size="10">Fine Gravel</text>

  <text x="250" y="438" text-anchor="middle" fill="#8080FF" font-size="11" font-weight="bold">Saint-Julien</text>
  <line x1="250" y1="440" x2="250" y2="445" stroke="#8080FF" stroke-width="1"/>
  <text x="250" y="468" text-anchor="middle" fill="#6060EE" font-size="10">Most Balanced</text>
  <text x="250" y="480" text-anchor="middle" fill="#6060EE" font-size="10">Balanced Gravel-Clay</text>

  <text x="450" y="438" text-anchor="middle" fill="#FF8050" font-size="11" font-weight="bold">Pauillac</text>
  <line x1="450" y1="440" x2="450" y2="445" stroke="#FF8050" stroke-width="1"/>
  <text x="450" y="468" text-anchor="middle" fill="#DD6030" font-size="10">Most Powerful</text>
  <text x="450" y="480" text-anchor="middle" fill="#DD6030" font-size="10">Deep Gravel</text>

  <text x="648" y="438" text-anchor="middle" fill="#A0E060" font-size="11" font-weight="bold">Saint-Estèphe</text>
  <line x1="648" y1="440" x2="648" y2="445" stroke="#80C040" stroke-width="1"/>
  <text x="648" y="468" text-anchor="middle" fill="#70A840" font-size="10">Most Robust</text>
  <text x="648" y="480" text-anchor="middle" fill="#70A840" font-size="10">Highest Clay</text>

  <!-- Gradient: elegance to power -->
  <defs>
    <linearGradient id="gradNS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7090" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#80C040" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect x="88" y="448" width="624" height="4" rx="2" fill="url(#gradNS)" opacity="0.5"/>

  <!-- Bottom note -->
  <line x1="40" y1="496" x2="760" y2="496" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="513" text-anchor="middle" fill="#706050" font-size="11">* From Margaux (south) to Saint-Estèphe (north), clay content gradually increases and wine style shifts from elegant to robust</text>
</svg>
