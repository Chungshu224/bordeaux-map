<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgSE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0e10"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
    <filter id="shSE"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgSE)"/>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#C0952C" font-size="21" font-weight="bold">Saint-Estèphe　北方堡壘的力量</text>
  <text x="400" y="60" text-anchor="middle" fill="#9A7040" font-size="12">Médoc 最北、黏土最多 · 骨架最強 · 最需耐心等待</text>

  <!-- Left: soil analysis -->
  <rect x="40" y="82" width="345" height="290" rx="8" fill="#10120E" stroke="#5A7040" stroke-width="1.5" filter="url(#shSE)"/>
  <rect x="40" y="82" width="345" height="50" rx="8" fill="#3A5028"/>
  <rect x="40" y="112" width="345" height="20" fill="#3A5028"/>
  <text x="212" y="108" text-anchor="middle" fill="#D0F0A0" font-size="16" font-weight="bold">🪨 土壤特性</text>
  <text x="212" y="126" text-anchor="middle" fill="#88AA68" font-size="11">Médoc 中黏土比例最高</text>

  <!-- Soil composition bar chart -->
  <text x="60" y="155" fill="#80B060" font-size="12" font-weight="bold">土壤成分比較（相對含量）</text>

  <!-- Saint-Estèphe soil bars -->
  <text x="60" y="176" fill="#C0D0A0" font-size="11" font-weight="bold">Saint-Estèphe</text>
  <text x="60" y="192" fill="#C0D0A0" font-size="10">黏土</text>
  <rect x="105" y="182" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="182" width="145" height="13" rx="3" fill="#6A9840" opacity="0.9"/>
  <text x="310" y="193" fill="#80B060" font-size="10">35%+</text>
  <text x="60" y="208" fill="#C0D0A0" font-size="10">礫石</text>
  <rect x="105" y="198" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="198" width="90" height="13" rx="3" fill="#9A8850" opacity="0.8"/>
  <text x="310" y="209" fill="#A09070" font-size="10">~25%</text>

  <text x="60" y="228" fill="#C0D0A0" font-size="11" font-weight="bold">Pauillac（比較）</text>
  <text x="60" y="244" fill="#B0C090" font-size="10">黏土</text>
  <rect x="105" y="234" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="234" width="50" height="13" rx="3" fill="#6A9840" opacity="0.5"/>
  <text x="310" y="245" fill="#708860" font-size="10">~10%</text>
  <text x="60" y="260" fill="#B0C090" font-size="10">礫石</text>
  <rect x="105" y="250" width="200" height="13" rx="3" fill="#1A2018"/>
  <rect x="105" y="250" width="180" height="13" rx="3" fill="#9A8850" opacity="0.8"/>
  <text x="310" y="261" fill="#A09070" font-size="10">~60%+</text>

  <text x="60" y="288" fill="#80B060" font-size="12" font-weight="bold">黏土的作用</text>
  <rect x="60" y="295" width="310" height="65" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="75" y="311" fill="#A0C880" font-size="11">✓ 保水性強 → 乾旱年份穩定供水</text>
  <text x="75" y="326" fill="#A0C880" font-size="11">✓ 較低溫度 → 延緩成熟 → 更高酸度</text>
  <text x="75" y="342" fill="#A0C880" font-size="11">✓ 礦物質豐富 → 賦予深度礦物感</text>
  <text x="75" y="357" fill="#A0C880" font-size="11">⚠ 排水較差 → 雨季需注意淹水風險</text>

  <!-- Right: style -->
  <rect x="415" y="82" width="345" height="290" rx="8" fill="#10120E" stroke="#5A7040" stroke-width="1.5" filter="url(#shSE)"/>
  <rect x="415" y="82" width="345" height="50" rx="8" fill="#3A5028"/>
  <rect x="415" y="112" width="345" height="20" fill="#3A5028"/>
  <text x="588" y="108" text-anchor="middle" fill="#D0F0A0" font-size="16" font-weight="bold">🍷 風格與酒莊</text>
  <text x="588" y="126" text-anchor="middle" fill="#88AA68" font-size="11">Style Profile &amp; Key Châteaux</text>

  <text x="435" y="155" fill="#80B060" font-size="12" font-weight="bold">風格關鍵詞</text>
  <rect x="435" y="162" width="308" height="72" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="450" y="178" fill="#C0E890" font-size="12">• 單寧最強硬、骨架雄偉</text>
  <text x="450" y="194" fill="#C0E890" font-size="12">• 黑色水果 · 礦物感 · 菸草</text>
  <text x="450" y="210" fill="#C0E890" font-size="12">• 高酸度 · 豐厚酒體</text>
  <text x="450" y="226" fill="#C0E890" font-size="12">• 需至少 10–15 年才開始展現魅力</text>

  <text x="435" y="252" fill="#80B060" font-size="12" font-weight="bold">代表酒莊</text>
  <rect x="435" y="259" width="308" height="96" rx="4" fill="#0C100A" stroke="#4A6030" stroke-width="0.8"/>
  <text x="450" y="276" fill="#FFD080" font-size="13" font-weight="bold">Cos d'Estournel　二級莊</text>
  <text x="450" y="292" fill="#C0A860" font-size="11">最著名的 Saint-Estèphe · 東方式建築 · 豐厚濃郁</text>
  <text x="450" y="310" fill="#D0B070" font-size="13" font-weight="bold">Château Montrose　二級莊</text>
  <text x="450" y="326" fill="#C0A860" font-size="11">最傳統的 St-Estèphe 風格 · 強勁耐陳 · 高單寧</text>
  <text x="450" y="345" fill="#A09060" font-size="11">Calon-Ségur（三級）· Lafon-Rochet（四級）</text>

  <!-- Bottom: North vs South comparison -->
  <rect x="40" y="386" width="720" height="100" rx="8" fill="#0C0E0A" stroke="#5A7040" stroke-width="1" stroke-opacity="0.5" filter="url(#shSE)"/>
  <text x="400" y="408" text-anchor="middle" fill="#C0952C" font-size="14" font-weight="bold">Médoc 南北風格差異示意（由南到北）</text>
  <line x1="60" y1="414" x2="740" y2="414" stroke="#5A7040" stroke-width="0.5" opacity="0.5"/>

  <!-- Arrow from south to north -->
  <text x="55" y="448" fill="#888" font-size="11">← 南部</text>
  <line x1="88" y1="445" x2="712" y2="445" stroke="#4A6030" stroke-width="1.5"/>
  <polygon points="712,445 700,441 700,449" fill="#4A6030"/>
  <text x="720" y="448" fill="#888" font-size="11">北部 →</text>

  <!-- Region labels on line -->
  <text x="108" y="438" text-anchor="middle" fill="#FF7090" font-size="11" font-weight="bold">Margaux</text>
  <line x1="108" y1="440" x2="108" y2="445" stroke="#FF7090" stroke-width="1"/>
  <text x="108" y="468" text-anchor="middle" fill="#CC5070" font-size="10">最優雅</text>
  <text x="108" y="480" text-anchor="middle" fill="#CC5070" font-size="10">細砂礫</text>

  <text x="250" y="438" text-anchor="middle" fill="#8080FF" font-size="11" font-weight="bold">Saint-Julien</text>
  <line x1="250" y1="440" x2="250" y2="445" stroke="#8080FF" stroke-width="1"/>
  <text x="250" y="468" text-anchor="middle" fill="#6060EE" font-size="10">最均衡</text>
  <text x="250" y="480" text-anchor="middle" fill="#6060EE" font-size="10">砂礫均衡</text>

  <text x="450" y="438" text-anchor="middle" fill="#FF8050" font-size="11" font-weight="bold">Pauillac</text>
  <line x1="450" y1="440" x2="450" y2="445" stroke="#FF8050" stroke-width="1"/>
  <text x="450" y="468" text-anchor="middle" fill="#DD6030" font-size="10">最強勁</text>
  <text x="450" y="480" text-anchor="middle" fill="#DD6030" font-size="10">深礫石</text>

  <text x="648" y="438" text-anchor="middle" fill="#A0E060" font-size="11" font-weight="bold">Saint-Estèphe</text>
  <line x1="648" y1="440" x2="648" y2="445" stroke="#80C040" stroke-width="1"/>
  <text x="648" y="468" text-anchor="middle" fill="#70A840" font-size="10">最雄厚</text>
  <text x="648" y="480" text-anchor="middle" fill="#70A840" font-size="10">黏土最多</text>

  <!-- Gradient: elegance to power -->
  <defs>
    <linearGradient id="gradNS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7090" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#80C040" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect x="88" y="448" width="624" height="4" rx="2" fill="url(#gradNS)" opacity="0.5"/>

  <!-- Bottom note -->
  <line x1="40" y1="496" x2="760" y2="496" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="513" text-anchor="middle" fill="#706050" font-size="11">* 從 Margaux（南）到 Saint-Estèphe（北），土壤中黏土比例逐漸增加，酒款風格由優雅轉為雄渾</text>
</svg>
