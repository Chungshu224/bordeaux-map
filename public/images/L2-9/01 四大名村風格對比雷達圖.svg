<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0a08"/>
      <stop offset="100%" stop-color="#181412"/>
    </linearGradient>
    <filter id="sh9"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg9)"/>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="42" text-anchor="middle" fill="#C0952C" font-size="21" font-weight="bold">Médoc 四大名村風格對比</text>
  <text x="400" y="62" text-anchor="middle" fill="#9A7040" font-size="12">Margaux · Pauillac · Saint-Julien · Saint-Estèphe　五維風格雷達圖</text>

  <!-- ===== RADAR CHART ===== -->
  <!-- Center: 400, 320 | Radius: 180 -->
  <!-- 5 axes: 0°=頂=單寧強度, 72°=飽滿度, 144°=礦物感, 216°=優雅度, 288°=陳年潛力 -->
  <!-- Axis angles (from top, clockwise): 270°,342°,54°,126°,198° in SVG coords -->
  <!-- Using: top(270°)=單寧, right-top(342°)=飽滿度, right-bot(54°)=礦物感, left-bot(126°)=優雅度, left-top(198°)=陳年潛力 -->

  <!-- Grid circles -->
  <g stroke="#3A3028" stroke-width="1" fill="none">
    <polygon points="400,160 557,260 497,450 303,450 243,260" opacity="0.4"/>
    <polygon points="400,196 521,275 472,417 328,417 279,275" opacity="0.4"/>
    <polygon points="400,232 485,290 448,384 352,384 315,290" opacity="0.5"/>
    <polygon points="400,268 449,305 424,351 376,351 351,305" opacity="0.6"/>
    <polygon points="400,304 413,320 400,320 387,320 387,320" opacity="0.3"/>
  </g>

  <!-- Axis lines -->
  <g stroke="#4A4038" stroke-width="1.2">
    <line x1="400" y1="320" x2="400" y2="140"/>
    <line x1="400" y1="320" x2="573" y2="248"/>
    <line x1="400" y1="320" x2="505" y2="462"/>
    <line x1="400" y1="320" x2="295" y2="462"/>
    <line x1="400" y1="320" x2="227" y2="248"/>
  </g>

  <!-- Axis labels -->
  <text x="400" y="128" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">單寧強度</text>
  <text x="400" y="142" text-anchor="middle" fill="#907040" font-size="10">Tannin Intensity</text>

  <text x="590" y="242" text-anchor="start" fill="#C0952C" font-size="13" font-weight="bold">飽滿度</text>
  <text x="590" y="256" text-anchor="start" fill="#907040" font-size="10">Body</text>

  <text x="525" y="476" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">礦物感</text>
  <text x="525" y="490" text-anchor="middle" fill="#907040" font-size="10">Minerality</text>

  <text x="275" y="476" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">優雅度</text>
  <text x="275" y="490" text-anchor="middle" fill="#907040" font-size="10">Elegance</text>

  <text x="195" y="242" text-anchor="end" fill="#C0952C" font-size="13" font-weight="bold">陳年潛力</text>
  <text x="195" y="256" text-anchor="end" fill="#907040" font-size="10">Ageing</text>

  <!-- Scale labels on 單寧 axis -->
  <text x="408" y="160" fill="#504030" font-size="9">100</text>
  <text x="408" y="196" fill="#504030" font-size="9">80</text>
  <text x="408" y="232" fill="#504030" font-size="9">60</text>
  <text x="408" y="268" fill="#504030" font-size="9">40</text>
  <text x="408" y="304" fill="#504030" font-size="9">20</text>

  <!-- === Radar polygons ===
       Center: (400, 320), max radius = 180 (for score 100)
       For score S: radius = 180 * S / 100
       Axes (SVG angle from negative Y, clockwise):
         Top (270°=up):       px = 400 + r*cos(270°-90°) = 400,  py = 320 - r
         Right-top (342°):   px = 400 + r*cos(-18°), py = 320 - r*sin(-18°) ... let me recalculate
       5 axes at 72° intervals starting from top (270° in standard, which is -90° from x-axis)
       Axis 0 (top):      angle = 270° = -π/2        => (0, -1)        => x=400+0*r,      y=320-1*r
       Axis 1 (right-top):angle = 270+72=342°=-18°  => (cos-18°, -sin-18°) => (0.951, 0.309) => x=400+0.951r, y=320-0.309r   (note: SVG y inverted) => x=400+0.951r, y=320+0.309r  Wait...
       
       Actually in SVG: y increases downward.
       For angle θ measured clockwise from top (north):
         x = cx + r * sin(θ)
         y = cy - r * cos(θ)
       
       Axis 0 (top, θ=0°): x=400+r*0=400, y=320-r*1=320-r
       Axis 1 (θ=72°): x=400+r*sin72°=400+r*0.951, y=320-r*cos72°=320-r*0.309
       Axis 2 (θ=144°): x=400+r*sin144°=400+r*0.588, y=320-r*cos144°=320+r*0.809
       Axis 3 (θ=216°): x=400+r*sin216°=400-r*0.588, y=320-r*cos216°=320+r*0.809
       Axis 4 (θ=288°): x=400+r*sin288°=400-r*0.951, y=320-r*cos288°=320-r*0.309

       Label positions (r=195):
         Axis 0: (400, 125) ✓ 單寧
         Axis 1: (585, 260) ✓ 飽滿度
         Axis 2: (515, 478) ✓ 礦物感
         Axis 3: (285, 478) ✓ 優雅度
         Axis 4: (215, 260) ✓ 陳年潛力

       Pauillac: 單寧=95, 飽滿=90, 礦物=85, 優雅=70, 陳年=95
         A0: r=171, (400, 149)
         A1: r=162, (400+162*0.951, 320-162*0.309)=(554, 270)
         A2: r=153, (400+153*0.588, 320+153*0.809)=(490, 444)
         A3: r=126, (400-126*0.588, 320+126*0.809)=(326, 422)
         A4: r=171, (400-171*0.951, 320-171*0.309)=(237, 267)

       Saint-Estèphe: 單寧=90, 飽滿=85, 礦物=80, 優雅=55, 陳年=88
         A0: r=162, (400, 158)
         A1: r=153, (400+145.5, 320-47.3)=(546, 273)
         A2: r=144, (400+84.7, 320+116.5)=(485, 437)
         A3: r=99, (400-58.2, 320+80.1)=(342, 400)
         A4: r=158.4, (400-150.7, 320-49.0)=(249, 271)

       Saint-Julien: 單寧=78, 飽滿=82, 礦物=78, 優雅=85, 陳年=82
         A0: r=140, (400, 180)
         A1: r=147.6, (400+140.4, 320-45.6)=(540, 274)
         A2: r=140.4, (400+82.6, 320+113.6)=(483, 434)
         A3: r=153, (400-89.9, 320+123.8)=(310, 444)
         A4: r=147.6, (400-140.4, 320-45.6)=(260, 274)

       Margaux: 單寧=68, 飽滿=72, 礦物=75, 優雅=98, 陳年=80
         A0: r=122, (400, 198)
         A1: r=129.6, (400+123.2, 320-40.0)=(523, 280)
         A2: r=135, (400+79.4, 320+109.3)=(479, 429)
         A3: r=176.4, (400-103.7, 320+142.7)=(296, 463)
         A4: r=144, (400-136.9, 320-44.5)=(263, 276)
  -->

  <!-- Pauillac polygon: deep red, filled -->
  <polygon points="400,149 554,270 490,444 326,422 237,267" 
           fill="#8B0000" fill-opacity="0.35" stroke="#CC2020" stroke-width="2.5"/>

  <!-- Saint-Estèphe polygon: dark brown -->
  <polygon points="400,158 546,273 485,437 342,400 249,271" 
           fill="#5A3020" fill-opacity="0.35" stroke="#AA6040" stroke-width="2"/>

  <!-- Saint-Julien polygon: purple -->
  <polygon points="400,180 540,274 483,434 310,444 260,274" 
           fill="#402060" fill-opacity="0.35" stroke="#8860CC" stroke-width="2"/>

  <!-- Margaux polygon: rose pink -->
  <polygon points="400,198 523,280 479,429 296,463 263,276" 
           fill="#601830" fill-opacity="0.35" stroke="#FF7090" stroke-width="2"/>

  <!-- Center dot -->
  <circle cx="400" cy="320" r="4" fill="#C0952C"/>

  <!-- ===== LEGEND ===== -->
  <rect x="42" y="510" width="710" height="70" rx="6" fill="#100C08" stroke="#3A3020" stroke-width="1"/>

  <!-- Pauillac -->
  <line x1="62" y1="535" x2="98" y2="535" stroke="#CC2020" stroke-width="2.5"/>
  <circle cx="80" cy="535" r="5" fill="#8B0000"/>
  <text x="104" y="530" fill="#FF8080" font-size="13" font-weight="bold">Pauillac</text>
  <text x="104" y="546" fill="#CC5050" font-size="11">王者・強勁・陳年</text>
  <text x="104" y="561" fill="#AA4040" font-size="10">單寧95 飽滿90 陳年95</text>

  <!-- Saint-Estèphe -->
  <line x1="215" y1="535" x2="251" y2="535" stroke="#AA6040" stroke-width="2"/>
  <circle cx="233" cy="535" r="5" fill="#5A3020"/>
  <text x="257" y="530" fill="#D4A080" font-size="13" font-weight="bold">Saint-Estèphe</text>
  <text x="257" y="546" fill="#A07050" font-size="11">濃郁・堅實・力量</text>
  <text x="257" y="561" fill="#806040" font-size="10">單寧90 飽滿85 陳年88</text>

  <!-- Saint-Julien -->
  <line x1="400" y1="535" x2="436" y2="535" stroke="#8860CC" stroke-width="2"/>
  <circle cx="418" cy="535" r="5" fill="#402060"/>
  <text x="442" y="530" fill="#B090F0" font-size="13" font-weight="bold">Saint-Julien</text>
  <text x="442" y="546" fill="#9070C0" font-size="11">均衡・優雅・精緻</text>
  <text x="442" y="561" fill="#7050A0" font-size="10">單寧78 飽滿82 優雅85</text>

  <!-- Margaux -->
  <line x1="575" y1="535" x2="611" y2="535" stroke="#FF7090" stroke-width="2"/>
  <circle cx="593" cy="535" r="5" fill="#601830"/>
  <text x="617" y="530" fill="#FFAACC" font-size="13" font-weight="bold">Margaux</text>
  <text x="617" y="546" fill="#CC80A0" font-size="11">優雅・細膩・花香</text>
  <text x="617" y="561" fill="#A06080" font-size="10">單寧68 優雅98 礦物75</text>

  <!-- Bottom note -->
  <line x1="40" y1="588" x2="760" y2="588" stroke="#C0952C" stroke-width="0.5" opacity="0.2"/>
  <text x="400" y="598" text-anchor="middle" fill="#504030" font-size="10">* 數值為風格相對指標，非絕對評分 · 各軸滿分 100</text>
</svg>
