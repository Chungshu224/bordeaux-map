<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a6a2acc"/>
      <stop offset="35%" stop-color="#4a6a2a"/>
      <stop offset="65%" stop-color="#4a6a2a"/>
      <stop offset="100%" stop-color="#4a6a2a88"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <filter id="bottleShadow"><feDropShadow dx="4" dy="4" stdDeviation="5" flood-opacity="0.25"/></filter>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12"/>
  <!-- 葡萄藤裝飾 -->
  <path d="M30 260 Q80 220 70 180 Q60 140 90 100" stroke="#c8d8a0" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M370 260 Q320 220 330 180 Q340 140 310 100" stroke="#c8d8a0" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- 酒瓶主體 -->
  <g filter="url(#bottleShadow)">
    <!-- 瓶身 -->
    <path d="M162 240 L162 135 Q155 120 152 100 L152 72 Q155 68 162 66 L162 52 Q180 46 200 46 Q220 46 238 52 L238 66 Q245 68 248 72 L248 100 Q245 120 238 135 L238 240 Q220 248 200 248 Q180 248 162 240Z" fill="url(#bottleGrad)"/>
    <!-- 瓶頸 -->
    <rect x="185" y="30" width="30" height="24" rx="4" fill="#4a6a2a"/>
    <!-- 瓶口 -->
    <rect x="188" y="22" width="24" height="12" rx="6" fill="#888"/>
    <!-- 膠囊 (capsule) -->
    <path d="M162 66 L162 88 Q180 92 200 92 Q220 92 238 88 L238 66 Q220 62 200 62 Q180 62 162 66Z" fill="#d4a830"/>
    <!-- 瓶身高光 -->
    <path d="M170 100 L170 230" stroke="white" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
    <!-- 酒液顏色 -->
    <path d="M163 148 L163 240 Q180 248 200 248 Q220 248 237 240 L237 148" fill="#2a401022"/>
  </g>
  <!-- 酒標 -->
  <rect x="170" y="130" width="60" height="80" fill="white" rx="4" opacity="0.95"/>
  <rect x="172" y="132" width="56" height="76" fill="none" stroke="#2a4010" stroke-width="1.5" rx="3"/>
  <text x="200" y="152" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#2a4010" font-weight="bold">Domaine Huet</text>
  <line x1="175" y1="156" x2="225" y2="156" stroke="#2a4010" stroke-width="0.8" opacity="0.6"/>
  <text x="200" y="170" font-family="Georgia, serif" font-size="9.5" text-anchor="middle" fill="#2a4010" font-weight="bold">Vouvray</text>
  <text x="200" y="184" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle" fill="#555">Moelleux · Chenin Blanc</text>
  <text x="200" y="198" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#2a4010">2018</text>
  <!-- 說明文字 -->
  <text x="200" y="268" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#5a4a3a">Vouvray — 代表酒款</text>
</svg>