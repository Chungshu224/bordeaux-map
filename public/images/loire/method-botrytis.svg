<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5018"/>
      <stop offset="100%" stop-color="#e8b050"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)" rx="12"/>
  <!-- 頂部標題條 -->
  <rect x="0" y="0" width="400" height="52" fill="rgba(0,0,0,0.35)" rx="12"/>
  <rect x="0" y="40" width="400" height="12" fill="rgba(0,0,0,0.35)"/>
  <text x="200" y="22" font-family="Georgia, serif" font-size="17" font-weight="bold" text-anchor="middle" fill="white">貴腐菌 Botrytis Cinerea</text>
  <text x="200" y="40" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-style="italic">Pourriture Noble</text>
  <!-- 中央大 Emoji 圖標 -->
  <text x="200" y="130" font-family="system-ui" font-size="72" text-anchor="middle" dominant-baseline="middle">🍯</text>
  <!-- 葡萄狀態視覺 -->
  <!-- 貴腐葡萄示意 -->
<ellipse cx="100" cy="130" rx="25" ry="30" fill="#6a3808" opacity="0.8"/>
<text x="100" y="134" font-size="22" text-anchor="middle" font-family="system-ui">🫙</text>
<text x="100" y="155" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif" fill="#f8d080">感染縮水</text>
<ellipse cx="200" cy="128" rx="28" ry="20" fill="#d4a020" opacity="0.6"/>
<text x="200" y="132" font-size="22" text-anchor="middle" font-family="system-ui">🌫️</text>
<text x="200" y="152" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif" fill="#f8d080">晨霧環境</text>
<ellipse cx="305" cy="128" rx="22" ry="26" fill="#5a2808" opacity="0.8"/>
<text x="305" y="132" font-size="22" text-anchor="middle" font-family="system-ui">💧</text>
<text x="305" y="155" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif" fill="#f8d080">水分蒸發</text>
  <!-- 流程步驟 -->
  <rect x="18" y="178" width="364" height="92" fill="rgba(255,255,255,0.88)" rx="10"/>
  <circle cx="36" cy="195" r="8" fill="#8a4010"/>
  <text x="36" y="198" font-family="system-ui" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">1</text>
  <text x="54" y="198" font-family="system-ui, sans-serif" font-size="11" dominant-baseline="middle" fill="#1e293b">貴腐菌（Botrytis cinerea）感染成熟葡萄</text>
  <circle cx="36" cy="217" r="8" fill="#8a4010"/>
  <text x="36" y="220" font-family="system-ui" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">2</text>
  <text x="54" y="220" font-family="system-ui, sans-serif" font-size="11" dominant-baseline="middle" fill="#1e293b">晨霧+午後乾燥，穿透果皮蒸發水分</text>
  <circle cx="36" cy="239" r="8" fill="#8a4010"/>
  <text x="36" y="242" font-family="system-ui" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">3</text>
  <text x="54" y="242" font-family="system-ui, sans-serif" font-size="11" dominant-baseline="middle" fill="#1e293b">糖度飆升至 500+ g/L，酒精發酵緩慢</text>
  <circle cx="36" cy="261" r="8" fill="#8a4010"/>
  <text x="36" y="264" font-family="system-ui" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">4</text>
  <text x="54" y="264" font-family="system-ui, sans-serif" font-size="11" dominant-baseline="middle" fill="#1e293b">成酒：蜂蜜、杏桃乾、藏紅花複合香氣</text>
</svg>