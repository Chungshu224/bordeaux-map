<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgOak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0a06"/>
      <stop offset="100%" stop-color="#160e08"/>
    </linearGradient>
    <filter id="shO"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgOak)"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="36" text-anchor="middle" fill="#C0952C" font-size="20" font-weight="bold">橡木桶科學：法國橡木 vs 美國橡木</text>
  <text x="400" y="56" text-anchor="middle" fill="#9A7040" font-size="12">Oak Barrel Science · 木質、烘烤與風味萃取的完整解析</text>

  <!-- French Oak Column -->
  <rect x="40" y="76" width="340" height="280" rx="8" fill="#100c08" stroke="#8B5A1C" stroke-width="1.5" filter="url(#shO)"/>
  <rect x="40" y="76" width="340" height="46" rx="8" fill="#3a2010"/>
  <rect x="40" y="108" width="340" height="14" fill="#3a2010"/>
  <text x="210" y="100" text-anchor="middle" fill="#E8C080" font-size="15" font-weight="bold">🌳 法國橡木 French Oak</text>
  <text x="210" y="113" text-anchor="middle" fill="#806040" font-size="11">Quercus petraea · Allier / Vosges / Tronçais 森林</text>

  <!-- French oak barrel illustration -->
  <ellipse cx="90" cy="170" rx="32" ry="50" fill="none" stroke="#8B5A1C" stroke-width="2" opacity="0.7"/>
  <rect x="58" y="140" width="64" height="70" fill="#2A1808" stroke="#8B5A1C" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="90" cy="140" rx="32" ry="10" fill="#3A2010" stroke="#8B5A1C" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="90" cy="210" rx="32" ry="10" fill="#3A2010" stroke="#8B5A1C" stroke-width="1.5" opacity="0.8"/>
  <line x1="58" y1="170" x2="153" y2="170" stroke="#8B5A1C" stroke-width="2" opacity="0.5"/>
  <text x="90" y="174" text-anchor="middle" fill="#C0952C" font-size="10">225L</text>

  <!-- French oak properties list -->
  <text x="170" y="142" fill="#C0952C" font-size="11" font-weight="bold">木紋緊密</text>
  <text x="170" y="156" fill="#D0B070" font-size="10">氣孔少，氧化緩慢</text>

  <text x="170" y="173" fill="#C0952C" font-size="11" font-weight="bold">單寧細膩</text>
  <text x="170" y="187" fill="#D0B070" font-size="10">萃取量少但質量高</text>

  <text x="170" y="204" fill="#C0952C" font-size="11" font-weight="bold">香氣貢獻</text>
  <text x="170" y="218" fill="#D0B070" font-size="10">香草、丁香、雪松、</text>
  <text x="170" y="230" fill="#D0B070" font-size="10">煙燻、礦石</text>

  <text x="170" y="248" fill="#C0952C" font-size="11" font-weight="bold">製作工藝</text>
  <text x="170" y="262" fill="#D0B070" font-size="10">手工劈裂（非鋸切）</text>
  <text x="170" y="274" fill="#D0B070" font-size="10">戶外風乾 2–4 年</text>

  <!-- French oak cost/use badge -->
  <rect x="55" y="290" width="310" height="52" rx="5" fill="#0a0808" stroke="#8B5A1C" stroke-width="0.8"/>
  <text x="80" y="312" fill="#C0952C" font-size="11" font-weight="bold">💰 成本與使用</text>
  <text x="80" y="328" fill="#D0B070" font-size="11">每桶 €800–1,500 · 波爾多頂級莊 80–100% 使用</text>
  <text x="80" y="340" fill="#907050" font-size="10">新桶比例高 = 更多風味萃取，但過多會掩蓋果味</text>

  <!-- American Oak Column -->
  <rect x="420" y="76" width="340" height="280" rx="8" fill="#080c10" stroke="#2860A0" stroke-width="1.5" filter="url(#shO)"/>
  <rect x="420" y="76" width="340" height="46" rx="8" fill="#102840"/>
  <rect x="420" y="108" width="340" height="14" fill="#102840"/>
  <text x="590" y="100" text-anchor="middle" fill="#80C0F0" font-size="15" font-weight="bold">🌲 美國橡木 American Oak</text>
  <text x="590" y="113" text-anchor="middle" fill="#406080" font-size="11">Quercus alba · Missouri / Appalachian 森林</text>

  <!-- American oak barrel illustration -->
  <ellipse cx="470" cy="170" rx="32" ry="50" fill="none" stroke="#2860A0" stroke-width="2" opacity="0.7"/>
  <rect x="438" y="140" width="64" height="70" fill="#0A1820" stroke="#2860A0" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="470" cy="140" rx="32" ry="10" fill="#102840" stroke="#2860A0" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="470" cy="210" rx="32" ry="10" fill="#102840" stroke="#2860A0" stroke-width="1.5" opacity="0.8"/>
  <line x1="438" y1="170" x2="534" y2="170" stroke="#2860A0" stroke-width="2" opacity="0.5"/>
  <text x="470" y="174" text-anchor="middle" fill="#80C0F0" font-size="10">225L</text>

  <!-- American oak properties list -->
  <text x="550" y="142" fill="#80C0F0" font-size="11" font-weight="bold">木紋寬疏</text>
  <text x="550" y="156" fill="#B0D0F0" font-size="10">氣孔多，氧化較快</text>

  <text x="550" y="173" fill="#80C0F0" font-size="11" font-weight="bold">單寧粗獷</text>
  <text x="550" y="187" fill="#B0D0F0" font-size="10">萃取量多，影響更明顯</text>

  <text x="550" y="204" fill="#80C0F0" font-size="11" font-weight="bold">香氣貢獻</text>
  <text x="550" y="218" fill="#B0D0F0" font-size="10">椰子、香草（強烈）、</text>
  <text x="550" y="230" fill="#B0D0F0" font-size="10">奶油、甜香料</text>

  <text x="550" y="248" fill="#80C0F0" font-size="11" font-weight="bold">製作工藝</text>
  <text x="550" y="262" fill="#B0D0F0" font-size="10">可機鋸，成本較低</text>
  <text x="550" y="274" fill="#B0D0F0" font-size="10">烘乾較快，風乾 1–2 年</text>

  <!-- American oak cost/use badge -->
  <rect x="435" y="290" width="310" height="52" rx="5" fill="#060a0e" stroke="#2860A0" stroke-width="0.8"/>
  <text x="460" y="312" fill="#80C0F0" font-size="11" font-weight="bold">💰 成本與使用</text>
  <text x="460" y="328" fill="#A0C8E8" font-size="11">每桶 €300–600 · 較少用於波爾多，多見於Rioja</text>
  <text x="460" y="340" fill="#608090" font-size="10">部分酒莊用於二軍酒或追求特殊風格的實驗款</text>

  <!-- Toasting levels section -->
  <rect x="40" y="368" width="720" height="60" rx="6" fill="#0e0c08" stroke="#C0952C" stroke-width="1" stroke-opacity="0.5" filter="url(#shO)"/>
  <text x="400" y="390" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">🔥 烘烤程度（Toasting Level）的影響</text>
  <line x1="60" y1="396" x2="740" y2="396" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <!-- Toast levels -->
  <text x="110" y="415" text-anchor="middle" fill="#D0D0F0" font-size="11" font-weight="bold">輕度 Light</text>
  <text x="110" y="428" text-anchor="middle" fill="#9090C0" font-size="10">保留更多木質單寧</text>

  <line x1="195" y1="410" x2="195" y2="426" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <text x="270" y="415" text-anchor="middle" fill="#F0E090" font-size="11" font-weight="bold">中度 Medium</text>
  <text x="270" y="428" text-anchor="middle" fill="#C0B060" font-size="10">香草、烤麵包、平衡</text>

  <line x1="355" y1="410" x2="355" y2="426" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <text x="440" y="415" text-anchor="middle" fill="#F0B060" font-size="11" font-weight="bold">中重度 Med+</text>
  <text x="440" y="428" text-anchor="middle" fill="#C08040" font-size="10">波爾多最常用，烤堅果香</text>

  <line x1="525" y1="410" x2="525" y2="426" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <text x="620" y="415" text-anchor="middle" fill="#F07030" font-size="11" font-weight="bold">重度 Heavy</text>
  <text x="620" y="428" text-anchor="middle" fill="#C05020" font-size="10">咖啡、巧克力、煙燻，掩蓋果味</text>

  <!-- Bottom box: Bordeaux usage -->
  <rect x="40" y="440" width="720" height="88" rx="8" fill="#0a0808" stroke="#C0952C" stroke-width="0.8" stroke-opacity="0.4" filter="url(#shO)"/>
  <text x="400" y="462" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">🏆 波爾多名莊橡木桶策略</text>
  <line x1="60" y1="468" x2="740" y2="468" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <text x="80" y="486" fill="#E8C070" font-size="11" font-weight="bold">一級莊策略</text>
  <text x="80" y="500" fill="#D0B060" font-size="11">100% 全新法國橡木桶 · 陳釀 18–24 個月 · 多家桶廠混用（如 Seguin Moreau, Taransaud）</text>
  <text x="80" y="516" fill="#907050" font-size="10">→ 結果：豐富結構感、複雜香氣，與強勁的 Cab.S. 充分融合</text>

  <text x="460" y="486" fill="#A0C080" font-size="11" font-weight="bold">中型莊策略</text>
  <text x="460" y="500" fill="#90B070" font-size="11">30–60% 新桶 · 其餘用 1–2 年舊桶 · 陳釀 12–18 個月</text>
  <text x="460" y="516" fill="#608050" font-size="10">→ 平衡成本與風味，避免橡木味壓過果味</text>

  <line x1="40" y1="530" x2="760" y2="530" stroke="#C0952C" stroke-width="0.5" opacity="0.2"/>
  <text x="400" y="540" text-anchor="middle" fill="#706050" font-size="10">* 近年趨勢：頂級莊逐漸降低新桶比例（70→60%），強調地塊個性而非木味</text>
</svg>
