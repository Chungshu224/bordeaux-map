  <line x1="10" y1="72" x2="160" y2="72" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="10" y1="64" x2="160" y2="64" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
