<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgESG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05100C"/>
      <stop offset="50%" stop-color="#0A2016"/>
      <stop offset="100%" stop-color="#103020"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <linearGradient id="scope1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#40C080"/><stop offset="100%" stop-color="#20A060"/></linearGradient>
    <linearGradient id="scope2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#60D0A0"/><stop offset="100%" stop-color="#40C080"/></linearGradient>
    <linearGradient id="scope3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#80E0C0"/><stop offset="100%" stop-color="#60D0A0"/></linearGradient>
  </defs>

  <rect width="800" height="540" fill="url(#bgESG)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#80E0B0" font-size="24" font-weight="bold">酒莊 ESG 永續經營與碳盤查路徑</text>
  <text x="400" y="65" text-anchor="middle" fill="#60C090" font-size="13">ESG Framework &amp; Greenhouse Gas (GHG) Protocol</text>

  <!-- Top 3 ESG Pillars -->
  <g transform="translate(140, 100)">
    <!-- E -->
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#0A2518" stroke="#308050" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="30" text-anchor="middle" fill="#60E080" font-size="20">🌱</text>
    <text x="80" y="55" text-anchor="middle" fill="#A0E0C0" font-size="14" font-weight="bold">Environment(環境)</text>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#308050"/>
    <text x="80" y="85" text-anchor="middle" fill="#80C0A0" font-size="11">碳排放管理 / 節水</text>
    <text x="80" y="105" text-anchor="middle" fill="#80C0A0" font-size="11">土壤健康 / 生物多樣性</text>

    <!-- S -->
    <rect x="180" y="0" width="160" height="120" rx="8" fill="#0E221C" stroke="#407060" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="260" y="30" text-anchor="middle" fill="#80D0E0" font-size="20">🤝</text>
    <text x="260" y="55" text-anchor="middle" fill="#B0D0E0" font-size="14" font-weight="bold">Social(社會)</text>
    <line x1="200" y1="65" x2="320" y2="65" stroke="#407060"/>
    <text x="260" y="85" text-anchor="middle" fill="#80B0C0" font-size="11">勞工安全 / 居住權</text>
    <text x="260" y="105" text-anchor="middle" fill="#80B0C0" font-size="11">在地社區回饋 / 供應鏈</text>

    <!-- G -->
    <rect x="360" y="0" width="160" height="120" rx="8" fill="#122020" stroke="#506070" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="440" y="30" text-anchor="middle" fill="#D0E080" font-size="20">⚖️</text>
    <text x="440" y="55" text-anchor="middle" fill="#D0E0A0" font-size="14" font-weight="bold">Governance(治理)</text>
    <line x1="380" y1="65" x2="500" y2="65" stroke="#506070"/>
    <text x="440" y="85" text-anchor="middle" fill="#A0B090" font-size="11">透明公開 / 財報合規</text>
    <text x="440" y="105" text-anchor="middle" fill="#A0B090" font-size="11">道德經營 / 長期資本</text>
  </g>

  <!-- GHG Protocol Chart -->
  <rect x="90" y="250" width="620" height="180" rx="8" fill="#0C1A14" stroke="#205035" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="280" text-anchor="middle" fill="#A0E0C0" font-size="15" font-weight="bold">溫室氣體盤查 (GHG Protocol) 分類架構</text>
  
  <g transform="translate(120, 300)">
    <!-- Scope 1 -->
    <rect x="0" y="0" width="100" height="50" rx="6" fill="url(#scope1)"/>
    <text x="50" y="20" text-anchor="middle" fill="#003010" font-size="12" font-weight="bold">範疇一 Scope 1</text>
    <text x="50" y="40" text-anchor="middle" fill="#054020" font-size="10">直接排放 (5-10%)</text>
    
    <text x="50" y="70" text-anchor="middle" fill="#70B090" font-size="11">莊園柴油車/鍋爐</text>

    <!-- Plus -->
    <text x="125" y="30" text-anchor="middle" fill="#408060" font-size="16" font-weight="bold">+</text>

    <!-- Scope 2 -->
    <rect x="150" y="0" width="100" height="50" rx="6" fill="url(#scope2)"/>
    <text x="200" y="20" text-anchor="middle" fill="#003010" font-size="12" font-weight="bold">範疇二 Scope 2</text>
    <text x="200" y="40" text-anchor="middle" fill="#054020" font-size="10">間接能源 (10-15%)</text>
    
    <text x="200" y="70" text-anchor="middle" fill="#70B090" font-size="11">購買的台電/外購電</text>

    <!-- Plus -->
    <text x="275" y="30" text-anchor="middle" fill="#408060" font-size="16" font-weight="bold">+</text>

    <!-- Scope 3 -->
    <rect x="300" y="0" width="280" height="50" rx="6" fill="url(#scope3)" stroke="#A0F0D0" stroke-width="2"/>
    <text x="440" y="20" text-anchor="middle" fill="#003010" font-size="12" font-weight="bold">範疇三 Scope 3 (價值鏈上下游)</text>
    <text x="440" y="40" text-anchor="middle" fill="#054020" font-size="10">最大隱性碳排來源 (70-85%)</text>

    <circle cx="340" cy="80" r="15" fill="#153020" stroke="#40A070"/>
    <text x="340" y="84" text-anchor="middle" fill="#80E0B0" font-size="10">1️⃣</text>
    <text x="340" y="110" text-anchor="middle" fill="#80C0A0" font-size="10">玻璃瓶/包裝</text>

    <circle cx="440" cy="80" r="15" fill="#153020" stroke="#40A070"/>
    <text x="440" y="84" text-anchor="middle" fill="#80E0B0" font-size="10">2️⃣</text>
    <text x="440" y="110" text-anchor="middle" fill="#80C0A0" font-size="10">國際物流運輸</text>

    <circle cx="540" cy="80" r="15" fill="#153020" stroke="#40A070"/>
    <text x="540" y="84" text-anchor="middle" fill="#80E0B0" font-size="10">3️⃣</text>
    <text x="540" y="110" text-anchor="middle" fill="#80C0A0" font-size="10">商務旅行/通勤</text>
  </g>

  <!-- Bottom Message -->
  <rect x="140" y="460" width="520" height="45" rx="8" fill="#0A2A1A" stroke="#306040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="482" text-anchor="middle" fill="#80E0A0" font-size="13" font-weight="bold">永續不僅是環保，更是延長企業壽命、提升品牌全球競爭力的護城河</text>
  <text x="400" y="498" text-anchor="middle" fill="#60A080" font-size="11">推動玻璃瓶輕量化與轉用綠電，是目前投資報酬率最高的減碳捷徑。</text>

</svg>