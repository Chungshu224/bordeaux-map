<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgTerra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1008"/>
      <stop offset="100%" stop-color="#141E10"/>
    </linearGradient>
    <filter id="shT"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>

    <pattern id="clayP" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#201810"/>
      <circle cx="10" cy="10" r="2" fill="#302018"/>
    </pattern>
    <pattern id="gravelP" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#302820"/>
      <circle cx="5" cy="5" r="4" fill="#403830"/>
      <circle cx="12" cy="12" r="3" fill="#282018"/>
    </pattern>
    <pattern id="limeP" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#D0D0C0"/>
      <path d="M 0 0 L 20 20 M 20 0 L 0 20" stroke="#B0B0A0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="540" fill="url(#bgTerra)"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#80C080" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="36" text-anchor="middle" fill="#A0E0A0" font-size="20" font-weight="bold">Advanced Terroir: Precision Micro-Plot Analysis & Management</text>
  <text x="400" y="56" text-anchor="middle" fill="#80A080" font-size="12">Micro-Terroir Analysis · Four Levels from Macro-Climate to Vine Roots</text>

  <!-- 4 Pillars Section -->
  <rect x="40" y="90" width="720" height="180" rx="8" fill="#122014" stroke="#306040" stroke-width="1.5" filter="url(#shT)"/>
  
  <text x="400" y="115" text-anchor="middle" fill="#80C080" font-size="14" font-weight="bold">Four Pillars of Precision Viticulture</text>
  <line x1="280" y1="125" x2="520" y2="125" stroke="#306040" stroke-width="1"/>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#182A1A" stroke="#408050" stroke-width="1"/>
    <text x="75" y="25" text-anchor="middle" fill="#80D0A0" font-size="13" font-weight="bold">⛰️ 1. Topography</text>
    <text x="75" y="45" text-anchor="middle" fill="#C0E0C0" font-size="11">Aspect, elevation, sun exposure</text>
    <text x="75" y="65" text-anchor="middle" fill="#A0C0A0" font-size="10">Affects microclimate and heat accumulation</text>
    <text x="75" y="80" text-anchor="middle" fill="#A0C0A0" font-size="10">Prevents cold air settlement causing frost</text>
    <text x="75" y="95" text-anchor="middle" fill="#A0C0A0" font-size="10">Determines surface water flow direction</text>
  </g>

  <g transform="translate(233, 140)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#2A201A" stroke="#806040" stroke-width="1"/>
    <text x="75" y="25" text-anchor="middle" fill="#D0A080" font-size="13" font-weight="bold">🪨 2. Soil Profile</text>
    <text x="75" y="45" text-anchor="middle" fill="#E0C0A0" font-size="11">Profile, structure, mineral content</text>
    <text x="75" y="65" text-anchor="middle" fill="#C0A080" font-size="10">Affects root depth and nutrient uptake</text>
    <text x="75" y="80" text-anchor="middle" fill="#C0A080" font-size="10">Determines thermal inertia during the growing season</text>
    <text x="75" y="95" text-anchor="middle" fill="#C0A080" font-size="10">Zoning of clay / gravel / limestone</text>
  </g>

  <g transform="translate(406, 140)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#1A202A" stroke="#406080" stroke-width="1"/>
    <text x="75" y="25" text-anchor="middle" fill="#80A0D0" font-size="13" font-weight="bold">💧 3. Water Dynamics</text>
    <text x="75" y="45" text-anchor="middle" fill="#A0C0E0" font-size="11">Drainage capacity and water stress</text>
    <text x="75" y="65" text-anchor="middle" fill="#80A0C0" font-size="10">Mild water stress (Water Stress)</text>
    <text x="75" y="80" text-anchor="middle" fill="#80A0C0" font-size="10">Halts vegetative growth</text>
    <text x="75" y="95" text-anchor="middle" fill="#80A0C0" font-size="10">Concentrates energy on fruit ripening</text>
  </g>

  <g transform="translate(580, 140)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#2A182A" stroke="#804080" stroke-width="1"/>
    <text x="75" y="25" text-anchor="middle" fill="#D080D0" font-size="13" font-weight="bold">🍇 4. Plot-by-Plot Vinification</text>
    <text x="75" y="45" text-anchor="middle" fill="#E0A0E0" font-size="11">Separate plots, separately vinified</text>
    <text x="75" y="65" text-anchor="middle" fill="#C080C0" font-size="10">Batch harvesting by ripeness level</text>
    <text x="75" y="80" text-anchor="middle" fill="#C080C0" font-size="10">Different batches in small temperature-controlled tanks</text>
    <text x="75" y="95" text-anchor="middle" fill="#C080C0" font-size="10">Precision blending after ageing</text>
  </g>

  <!-- Cross Section Soil Model -->
  <rect x="40" y="290" width="720" height="210" rx="8" fill="#0C140E" stroke="#406040" stroke-width="1.5" filter="url(#shT)"/>
  <text x="400" y="315" text-anchor="middle" fill="#A0C0A0" font-size="14" font-weight="bold">Cross-Section: The Hidden Structure of a Perfect Grand Cru Soil Profile</text>

  <!-- Surface Level -->
  <rect x="60" y="340" width="460" height="20" fill="#3A3028"/>
  <text x="290" y="354" text-anchor="middle" fill="#A09080" font-size="10">Topsoil — organically rich, microbially active, heats quickly</text>
  
  <!-- Grapevine -->
  <line x1="290" y1="290" x2="290" y2="340" stroke="#8B5A2B" stroke-width="3"/>
  <path d="M 290 320 C 270 310, 250 320, 240 300" fill="none" stroke="#228B22" stroke-width="2"/>
  <path d="M 290 320 C 310 310, 330 320, 340 300" fill="none" stroke="#228B22" stroke-width="2"/>
  <circle cx="280" cy="325" r="4" fill="#4B0082"/>
  <circle cx="285" cy="330" r="4" fill="#4B0082"/>
  <circle cx="300" cy="330" r="4" fill="#4B0082"/>
  <circle cx="295" cy="325" r="4" fill="#4B0082"/>

  <!-- Roots -->
  <path d="M 290 340 C 280 370, 260 390, 250 420" fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  <path d="M 290 340 C 300 370, 320 390, 330 420" fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  <path d="M 290 340 L 290 480" fill="none" stroke="#8B5A2B" stroke-width="2"/>

  <!-- Gravel / Sand Layer -->
  <rect x="60" y="360" width="460" height="50" fill="url(#gravelP)"/>
  <text x="290" y="390" text-anchor="middle" fill="#C0B0A0" font-size="11" font-weight="bold">Deep Gravel Layer</text>
  <text x="290" y="405" text-anchor="middle" fill="#908070" font-size="10">Excellent drainage; absorbs heat by day, releases it at night</text>

  <!-- Clay / Subsoil Layer -->
  <rect x="60" y="410" width="460" height="70" fill="url(#clayP)"/>
  <text x="290" y="450" text-anchor="middle" fill="#D0A080" font-size="11" font-weight="bold">Clay &amp; Limestone Subsoil</text>
  <text x="290" y="465" text-anchor="middle" fill="#A08060" font-size="10">Deep moisture retention; supplies roots with water and minerals in extreme drought</text>

  <!-- Information Panel -->
  <rect x="540" y="340" width="200" height="140" rx="4" fill="#182A1A" stroke="#305030" stroke-width="1"/>
  <text x="640" y="360" text-anchor="middle" fill="#80D0A0" font-size="12" font-weight="bold">Benefits of Micro-Plot Management</text>
  
  <circle cx="560" cy="380" r="4" fill="#C0E0C0"/>
  <text x="575" y="384" fill="#A0C0A0" font-size="10">Full ripeness: smooth tannins, no green notes</text>
  
  <circle cx="560" cy="405" r="4" fill="#C0E0C0"/>
  <text x="575" y="409" fill="#A0C0A0" font-size="10">Avoid rot: harvest low-lying plots earlier</text>

  <circle cx="560" cy="430" r="4" fill="#C0E0C0"/>
  <text x="575" y="434" fill="#A0C0A0" font-size="10">Layered complexity: blend wines from different slopes</text>

  <circle cx="560" cy="455" r="4" fill="#C0E0C0"/>
  <text x="575" y="459" fill="#A0C0A0" font-size="10">Premium Grand Vin: select from the finest subsoil zones</text>

  <!-- Footer note -->
  <line x1="40" y1="515" x2="760" y2="515" stroke="#406040" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="530" text-anchor="middle" fill="#709070" font-size="10">💡 Summary: Micro-plot management is the MRI scan of the vineyard — no subtle terroir detail goes unexamined.</text>
</svg>