<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgRisk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0808"/>
      <stop offset="60%" stop-color="#2A1010"/>
      <stop offset="100%" stop-color="#3A1515"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgRisk)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#F0A0A0" font-size="24" font-weight="bold">Château Comprehensive Risk Management & Insurance Matrix</text>
  <text x="400" y="65" text-anchor="middle" fill="#D08080" font-size="13">Vineyard &amp; Estate Comprehensive Risk Matrix</text>

  <!-- Big Shield in the background -->
  <path d="M 400 90 L 650 120 L 650 350 C 650 450, 400 500, 400 520 C 400 500, 150 450, 150 350 L 150 120 Z" fill="#200A0A" stroke="#502020" stroke-width="4" opacity="0.6"/>
  <path d="M 400 90 L 650 120 L 650 350 C 650 450, 400 500, 400 520 L 400 90" fill="#280C0C" opacity="0.6"/>

  <!-- Three Risk Categories -->
  <g transform="translate(190, 140)">
    <!-- Climate Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#301515" stroke="#804040" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#FFA0A0" font-size="18">🌦️</text>
    <text x="65" y="55" text-anchor="middle" fill="#E0C0C0" font-size="12" font-weight="bold">Climate & Agricultural</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#804040" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#C09090" font-size="11">• Frost / Hail</text>
    <text x="65" y="105" text-anchor="middle" fill="#C09090" font-size="11">• Drought / Heatwave</text>
    <text x="65" y="125" text-anchor="middle" fill="#C09090" font-size="11">• Disease & Pests</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#502020"/>
    <text x="65" y="148" text-anchor="middle" fill="#FFA0A0" font-size="10">Yield Insurance Products</text>
  </g>

  <g transform="translate(335, 140)">
    <!-- Operations Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#301810" stroke="#805030" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#FFC0A0" font-size="18">🏭</text>
    <text x="65" y="55" text-anchor="middle" fill="#E0D0C0" font-size="12" font-weight="bold">Operations & Assets</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#805030" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#C0A090" font-size="11">• Fire / Theft</text>
    <text x="65" y="105" text-anchor="middle" fill="#C0A090" font-size="11">• Contamination / Equipment Failure</text>
    <text x="65" y="125" text-anchor="middle" fill="#C0A090" font-size="11">• Supply Chain Disruption</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#503020"/>
    <text x="65" y="148" text-anchor="middle" fill="#FFC0A0" font-size="10">Property & Liability Insurance</text>
  </g>

  <g transform="translate(480, 140)">
    <!-- Market Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#201520" stroke="#604060" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#C0A0FF" font-size="18">📉</text>
    <text x="65" y="55" text-anchor="middle" fill="#D0C0E0" font-size="12" font-weight="bold">Market & Geopolitical</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#604060" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#A090C0" font-size="11">• Tariffs & Trade Wars</text>
    <text x="65" y="105" text-anchor="middle" fill="#A090C0" font-size="11">• Currency Fluctuation</text>
    <text x="65" y="125" text-anchor="middle" fill="#A090C0" font-size="11">• Reputational Damage / PR Crisis</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#302040"/>
    <text x="65" y="148" text-anchor="middle" fill="#D0A0FF" font-size="10">Hedging & Crisis Response</text>
  </g>

  <!-- Process Arrow Down -->
  <path d="M 400 310 L 400 330 L 390 330 L 400 340 L 410 330 L 400 330" fill="#E08080"/>

  <!-- Mitigation Box -->
  <rect x="250" y="350" width="300" height="70" rx="8" fill="#1C0A0C" stroke="#A03030" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" fill="#FFA0A0" font-size="14" font-weight="bold">Proactive Defence Network (Risk Mitigation)</text>
  <text x="400" y="395" text-anchor="middle" fill="#D0A0A0" font-size="12">Frost fans / hail nets / fire inspections / IT backup</text>
  <text x="400" y="410" text-anchor="middle" fill="#A07070" font-size="10">Proactively reduces incident probability, optimising insurance costs and business resilience</text>

  <!-- Bottom Message -->
  <rect x="180" y="455" width="440" height="40" rx="20" fill="#3A1515" stroke="#803030" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="480" text-anchor="middle" fill="#FFC0C0" font-size="13" font-weight="bold">Risk management is not merely about buying insurance — it is a comprehensive health check for all château assets</text>

</svg>