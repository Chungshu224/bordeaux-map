<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgRisk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0808"/>
      <stop offset="60%" stop-color="#2A1010"/>
      <stop offset="100%" stop-color="#3A1515"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgRisk)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#F0A0A0" font-size="24" font-weight="bold">酒莊全方位風險管理與保險防護矩陣</text>
  <text x="400" y="65" text-anchor="middle" fill="#D08080" font-size="13">Vineyard &amp; Estate Comprehensive Risk Matrix</text>

  <!-- Big Shield in the background -->
  <path d="M 400 90 L 650 120 L 650 350 C 650 450, 400 500, 400 520 C 400 500, 150 450, 150 350 L 150 120 Z" fill="#200A0A" stroke="#502020" stroke-width="4" opacity="0.6"/>
  <path d="M 400 90 L 650 120 L 650 350 C 650 450, 400 500, 400 520 L 400 90" fill="#280C0C" opacity="0.6"/>

  <!-- Three Risk Categories -->
  <g transform="translate(190, 140)">
    <!-- Climate Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#301515" stroke="#804040" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#FFA0A0" font-size="18">🌦️</text>
    <text x="65" y="55" text-anchor="middle" fill="#E0C0C0" font-size="12" font-weight="bold">氣候與農務</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#804040" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#C09090" font-size="11">• 霜凍 / 冰雹</text>
    <text x="65" y="105" text-anchor="middle" fill="#C09090" font-size="11">• 乾旱 / 熱浪</text>
    <text x="65" y="125" text-anchor="middle" fill="#C09090" font-size="11">• 疾病蟲害</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#502020"/>
    <text x="65" y="148" text-anchor="middle" fill="#FFA0A0" font-size="10">產量保險險種</text>
  </g>

  <g transform="translate(335, 140)">
    <!-- Operations Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#301810" stroke="#805030" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#FFC0A0" font-size="18">🏭</text>
    <text x="65" y="55" text-anchor="middle" fill="#E0D0C0" font-size="12" font-weight="bold">營運與資產</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#805030" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#C0A090" font-size="11">• 火災 / 竊盜</text>
    <text x="65" y="105" text-anchor="middle" fill="#C0A090" font-size="11">• 污染 / 設備故障</text>
    <text x="65" y="125" text-anchor="middle" fill="#C0A090" font-size="11">• 供應鏈中斷</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#503020"/>
    <text x="65" y="148" text-anchor="middle" fill="#FFC0A0" font-size="10">財產與責任險</text>
  </g>

  <g transform="translate(480, 140)">
    <!-- Market Risk -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#201520" stroke="#604060" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="30" text-anchor="middle" fill="#C0A0FF" font-size="18">📉</text>
    <text x="65" y="55" text-anchor="middle" fill="#D0C0E0" font-size="12" font-weight="bold">市場與地緣政策</text>
    <line x1="20" y1="65" x2="110" y2="65" stroke="#604060" stroke-width="1"/>
    <text x="65" y="85" text-anchor="middle" fill="#A090C0" font-size="11">• 關稅與貿易戰</text>
    <text x="65" y="105" text-anchor="middle" fill="#A090C0" font-size="11">• 匯率波動</text>
    <text x="65" y="125" text-anchor="middle" fill="#A090C0" font-size="11">• 名譽受損 / 公關</text>
    <rect x="25" y="135" width="80" height="20" rx="10" fill="#302040"/>
    <text x="65" y="148" text-anchor="middle" fill="#D0A0FF" font-size="10">避險與危機應變</text>
  </g>

  <!-- Process Arrow Down -->
  <path d="M 400 310 L 400 330 L 390 330 L 400 340 L 410 330 L 400 330" fill="#E08080"/>

  <!-- Mitigation Box -->
  <rect x="250" y="350" width="300" height="70" rx="8" fill="#1C0A0C" stroke="#A03030" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" fill="#FFA0A0" font-size="14" font-weight="bold">主動防護網 (Risk Mitigation)</text>
  <text x="400" y="395" text-anchor="middle" fill="#D0A0A0" font-size="12">防霜風扇 / 冰雹網 / 消防安檢 / 網路備案</text>
  <text x="400" y="410" text-anchor="middle" fill="#A07070" font-size="10">主動降低出險機率，優化保費支出與企業韌性</text>

  <!-- Bottom Message -->
  <rect x="180" y="455" width="440" height="40" rx="20" fill="#3A1515" stroke="#803030" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="480" text-anchor="middle" fill="#FFC0C0" font-size="13" font-weight="bold">風險管理不只是買保險，而是為酒莊資產做「全方位健康體檢」</text>

</svg>