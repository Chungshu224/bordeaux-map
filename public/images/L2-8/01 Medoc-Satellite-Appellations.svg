<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgSat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a0e"/>
      <stop offset="100%" stop-color="#161418"/>
    </linearGradient>
    <filter id="shSat"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgSat)"/>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>

  <text x="400" y="40" text-anchor="middle" fill="#C0952C" font-size="21" font-weight="bold">Médoc Satellite Appellations Overview</text>
  <text x="400" y="60" text-anchor="middle" fill="#9A7040" font-size="12">Satellite Appellations of Médoc · Seven AOCs · Hidden Value Gems</text>

  <!-- 7 satellite appellations in a grid layout -->
  <!-- Row 1: Moulis, Listrac, Haut-Médoc -->
  <!-- Row 2: Côtes de Bourg, Blaye, Fronsac, Lalande-de-Pomerol -->

  <!-- Moulis -->
  <rect x="40" y="82" width="235" height="130" rx="8" fill="#1A1020" stroke="#6640A0" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="40" y="82" width="235" height="38" rx="8" fill="#3A1A5A"/>
  <rect x="40" y="106" width="235" height="14" fill="#3A1A5A"/>
  <text x="157" y="102" text-anchor="middle" fill="#D0A0FF" font-size="14" font-weight="bold">Moulis-en-Médoc</text>
  <text x="60" y="136" fill="#B888EE" font-size="11" font-weight="bold">🗺️ Location</text>
  <text x="60" y="151" fill="#C8B0E0" font-size="11">Inland, central Haut-Médoc</text>
  <text x="60" y="166" fill="#B888EE" font-size="11" font-weight="bold">🍷 Character</text>
  <text x="60" y="180" fill="#C8B0E0" font-size="11">Soft and approachable · gravel-clay soils</text>
  <text x="60" y="196" fill="#C8B0E0" font-size="11">Key estate: Chasse-Spleen</text>

  <!-- Listrac -->
  <rect x="285" y="82" width="235" height="130" rx="8" fill="#201018" stroke="#8040A0" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="285" y="82" width="235" height="38" rx="8" fill="#4A1A40"/>
  <rect x="285" y="106" width="235" height="14" fill="#4A1A40"/>
  <text x="402" y="102" text-anchor="middle" fill="#F0A0D0" font-size="14" font-weight="bold">Listrac-Médoc</text>
  <text x="305" y="136" fill="#D880B0" font-size="11" font-weight="bold">🗺️ Location</text>
  <text x="305" y="151" fill="#E0B0C8" font-size="11">Highest elevation zone in Médoc</text>
  <text x="305" y="166" fill="#D880B0" font-size="11" font-weight="bold">🍷 Character</text>
  <text x="305" y="180" fill="#E0B0C8" font-size="11">Limestone · crisp acidity</text>
  <text x="305" y="196" fill="#E0B0C8" font-size="11">Key estates: Clarke · Fourcas</text>

  <!-- Haut-Médoc -->
  <rect x="530" y="82" width="230" height="130" rx="8" fill="#0E1A20" stroke="#2060A0" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="530" y="82" width="230" height="38" rx="8" fill="#1A3A5A"/>
  <rect x="530" y="106" width="230" height="14" fill="#1A3A5A"/>
  <text x="645" y="102" text-anchor="middle" fill="#A0C8FF" font-size="14" font-weight="bold">Haut-Médoc AOC</text>
  <text x="550" y="136" fill="#7AAAEE" font-size="11" font-weight="bold">🗺️ Location</text>
  <text x="550" y="151" fill="#B0C8E8" font-size="11">Premium zone outside the four main villages</text>
  <text x="550" y="166" fill="#7AAAEE" font-size="11" font-weight="bold">🍷 Character</text>
  <text x="550" y="180" fill="#B0C8E8" font-size="11">Includes Château La Lagune</text>
  <text x="550" y="196" fill="#B0C8E8" font-size="11">and Château Cantemerle</text>

  <!-- Row 2 -->
  <!-- Lalande-de-Pomerol -->
  <rect x="40" y="224" width="173" height="130" rx="8" fill="#101A0E" stroke="#406040" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="40" y="224" width="173" height="38" rx="8" fill="#1A3A18"/>
  <rect x="40" y="248" width="173" height="14" fill="#1A3A18"/>
  <text x="126" y="243" text-anchor="middle" fill="#A0D880" font-size="12" font-weight="bold">Lalande de Pomerol</text>
  <text x="55" y="276" fill="#80C060" font-size="10" font-weight="bold">🗺️ Adjacent to northern Pomerol</text>
  <text x="55" y="291" fill="#B0D890" font-size="10">Merlot dominant</text>
  <text x="55" y="305" fill="#B0D890" font-size="10">Plush and supple · early maturing</text>
  <text x="55" y="319" fill="#B0D890" font-size="10">Néac is also within this AOC</text>
  <text x="55" y="343" fill="#80C060" font-size="10" font-weight="bold">💰 €15–35 / bottle</text>

  <!-- Fronsac -->
  <rect x="223" y="224" width="173" height="130" rx="8" fill="#1A1208" stroke="#806030" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="223" y="224" width="173" height="38" rx="8" fill="#3A2410"/>
  <rect x="223" y="248" width="173" height="14" fill="#3A2410"/>
  <text x="309" y="243" text-anchor="middle" fill="#F0C880" font-size="12" font-weight="bold">Fronsac &amp; Canon-Fronsac</text>
  <text x="238" y="276" fill="#D0A850" font-size="10" font-weight="bold">🗺️ Northwest of Libourne</text>
  <text x="238" y="291" fill="#E8D090" font-size="10">Limestone terrace</text>
  <text x="238" y="305" fill="#E8D090" font-size="10">Strong structure · Cab. Franc character</text>
  <text x="238" y="319" fill="#E8D090" font-size="10">Regarded as the "value Right Bank"</text>
  <text x="238" y="343" fill="#D0A850" font-size="10" font-weight="bold">💰 €12–40 / bottle</text>

  <!-- Blaye -->
  <rect x="406" y="224" width="173" height="130" rx="8" fill="#0E1818" stroke="#408060" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="406" y="224" width="173" height="38" rx="8" fill="#1A3828"/>
  <rect x="406" y="248" width="173" height="14" fill="#1A3828"/>
  <text x="492" y="243" text-anchor="middle" fill="#80F0B0" font-size="12" font-weight="bold">Blaye Côtes de Bordeaux</text>
  <text x="421" y="276" fill="#60C090" font-size="10" font-weight="bold">🗺️ Northern Right Bank of the Gironde</text>
  <text x="421" y="291" fill="#A8E0C0" font-size="10">Limestone clay</text>
  <text x="421" y="305" fill="#A8E0C0" font-size="10">Fresh fruit · balanced and easy-drinking</text>
  <text x="421" y="319" fill="#A8E0C0" font-size="10">Quality improving rapidly in recent years</text>
  <text x="421" y="343" fill="#60C090" font-size="10" font-weight="bold">💰 €10–25 / bottle</text>

  <!-- Côtes de Bourg -->
  <rect x="589" y="224" width="171" height="130" rx="8" fill="#100E1A" stroke="#404090" stroke-width="1.5" filter="url(#shSat)"/>
  <rect x="589" y="224" width="171" height="38" rx="8" fill="#202050"/>
  <rect x="589" y="248" width="171" height="14" fill="#202050"/>
  <text x="674" y="243" text-anchor="middle" fill="#C0C0FF" font-size="12" font-weight="bold">Côtes de Bourg</text>
  <text x="604" y="276" fill="#9090EE" font-size="10" font-weight="bold">🗺️ Right Bank of the Gironde</text>
  <text x="604" y="291" fill="#C0C0F0" font-size="10">Limestone, clay and gravel</text>
  <text x="604" y="305" fill="#C0C0F0" font-size="10">Merlot-dominant · Plush</text>
  <text x="604" y="319" fill="#C0C0F0" font-size="10">Can rival Saint-Émilion in quality</text>
  <text x="604" y="343" fill="#9090EE" font-size="10" font-weight="bold">💰 €10–30 / bottle</text>

  <!-- Bottom comparison bar -->
  <rect x="40" y="368" width="720" height="112" rx="8" fill="#0c0a0e" stroke="#C0952C" stroke-width="1" stroke-opacity="0.4" filter="url(#shSat)"/>
  <text x="400" y="390" text-anchor="middle" fill="#C0952C" font-size="14" font-weight="bold">Value Proposition of Satellite Appellations</text>
  <line x1="60" y1="396" x2="740" y2="396" stroke="#C0952C" stroke-width="0.5" opacity="0.4"/>

  <!-- Value vs quality bar -->
  <text x="80" y="415" fill="#A09080" font-size="12" font-weight="bold">Quality</text>
  <rect x="130" y="406" width="480" height="14" rx="3" fill="#1A1818"/>
  <rect x="130" y="406" width="350" height="14" rx="3" fill="#8B4040" opacity="0.7"/>
  <text x="615" y="417" fill="#AA6060" font-size="11">~70% of classified estate quality</text>

  <text x="80" y="438" fill="#A09080" font-size="12" font-weight="bold">Price</text>
  <rect x="130" y="429" width="480" height="14" rx="3" fill="#1A1818"/>
  <rect x="130" y="429" width="140" height="14" rx="3" fill="#4070A0" opacity="0.7"/>
  <text x="615" y="440" fill="#6090CC" font-size="11">30–40% of classified estate prices</text>

  <text x="80" y="460" fill="#C0952C" font-size="12" font-weight="bold">Value</text>
  <rect x="130" y="451" width="480" height="14" rx="3" fill="#1A1818"/>
  <rect x="130" y="451" width="460" height="14" rx="3" fill="#4A9040" opacity="0.8"/>
  <text x="615" y="462" fill="#70B060" font-size="12" font-weight="bold">Exceptional ★★★★☆</text>

  <text x="400" y="478" text-anchor="middle" fill="#9A7040" font-size="11">→ Satellite appellations are the ideal entry point for budget-conscious wine lovers, offering authentic Bordeaux terroir at accessible prices</text>

  <!-- Bottom note -->
  <line x1="40" y1="490" x2="760" y2="490" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="507" text-anchor="middle" fill="#706050" font-size="11">* Some satellite estates (e.g. Fronsac, Côtes de Bourg) match mid-tier classified growth quality at one-third the price</text>
</svg>
