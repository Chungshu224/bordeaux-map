<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgFinance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#15202a"/>
    </linearGradient>
    <linearGradient id="barCost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#406080"/>
      <stop offset="100%" stop-color="#203040"/>
    </linearGradient>
    <linearGradient id="barProfit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0A050"/>
      <stop offset="100%" stop-color="#806030"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgFinance)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#A0C0E0" font-size="22" font-weight="bold">Château Financial Model Fundamentals: From Costs to ROI</text>
  <text x="400" y="60" text-anchor="middle" fill="#80A0C0" font-size="12">Wine Business Financial Architecture</text>

  <!-- Left: Production Cost Breakdown Chart -->
  <rect x="40" y="100" width="340" height="380" rx="8" fill="#101820" stroke="#304050" stroke-width="1"/>
  <text x="210" y="130" text-anchor="middle" fill="#80A0C0" font-size="14" font-weight="bold">Cost Breakdown of One Bottle of Fine Wine</text>

  <g transform="translate(70, 160)">
    <!-- Y Axis -->
    <line x1="40" y1="0" x2="40" y2="280" stroke="#304050" stroke-width="1"/>
    <!-- Bars -->
    <rect x="50" y="200" width="40" height="80" fill="url(#barCost)" filter="url(#shadow)"/>
    <text x="70" y="190" text-anchor="middle" fill="#A0C0E0" font-size="11">Viticulture Costs</text>
    <text x="70" y="245" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="bold">30%</text>

    <rect x="110" y="230" width="40" height="50" fill="url(#barCost)" filter="url(#shadow)"/>
    <text x="130" y="220" text-anchor="middle" fill="#A0C0E0" font-size="11">Winemaking / Labour</text>
    <text x="130" y="255" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="bold">20%</text>

    <rect x="170" y="160" width="40" height="120" fill="url(#barCost)" filter="url(#shadow)"/>
    <text x="190" y="150" text-anchor="middle" fill="#A0C0E0" font-size="11">Oak Barrels / Equipment</text>
    <text x="190" y="220" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="bold">25%</text>

    <rect x="230" y="240" width="40" height="40" fill="url(#barCost)" filter="url(#shadow)"/>
    <text x="250" y="230" text-anchor="middle" fill="#A0C0E0" font-size="11">Packaging & Marketing</text>
    <text x="250" y="260" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="bold">15%</text>

    <!-- Base line -->
    <line x1="40" y1="280" x2="290" y2="280" stroke="#507090" stroke-width="2"/>
    <text x="165" y="300" text-anchor="middle" fill="#6080A0" font-size="11">Fixed & Variable Costs (OPEX)</text>
  </g>

  <!-- Right: CAPEX & ROI & Breakeven -->
  <rect x="420" y="100" width="340" height="180" rx="8" fill="#18181A" stroke="#403020" stroke-width="1"/>
  <text x="590" y="125" text-anchor="middle" fill="#D0B080" font-size="14" font-weight="bold">Capital Expenditure (CAPEX) & ROI Assessment</text>
  
  <rect x="440" y="145" width="300" height="115" rx="4" fill="#201C18"/>
  <circle cx="470" cy="180" r="18" fill="#302010" stroke="#D0A050" stroke-width="1"/>
  <text x="470" y="185" text-anchor="middle" fill="#D0A050" font-size="14">⚙️</text>
  <text x="500" y="175" fill="#E0C090" font-size="12" font-weight="bold">Purchasing a high-end optical sorter (€80,000)</text>
  <text x="500" y="195" fill="#A09080" font-size="10">→ How much manual sorting cost does it save?</text>
  <text x="500" y="210" fill="#A09080" font-size="10">→ How much does it improve yield quality and the likelihood of upgrading to Grand Vin?</text>
  <line x1="440" y1="230" x2="740" y2="230" stroke="#403020" stroke-dasharray="2,2"/>
  <text x="590" y="250" text-anchor="middle" fill="#C0A070" font-size="11" font-weight="bold">ROI = (Expected Gain - Investment Cost) / Investment Cost</text>

  <rect x="420" y="300" width="340" height="180" rx="8" fill="#101C18" stroke="#204030" stroke-width="1"/>
  <text x="590" y="330" text-anchor="middle" fill="#80C0A0" font-size="14" font-weight="bold">Break-Even Point & Sensitivity Analysis</text>
  
  <g transform="translate(440, 360)">
    <line x1="0" y1="90" x2="280" y2="90" stroke="#204030" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="90" stroke="#204030" stroke-width="1"/>
    
    <!-- Lines -->
    <path d="M 20 80 L 260 80" stroke="#A0B0C0" stroke-width="2" stroke-dasharray="4,4"/> <!-- Fixed Cost -->
    <path d="M 20 80 L 260 20" stroke="#C06060" stroke-width="2"/> <!-- Total Cost -->
    <path d="M 20 90 L 260 0" stroke="#60C080" stroke-width="2"/> <!-- Revenue -->
    
    <circle cx="165" cy="45" r="5" fill="#E0D080" filter="url(#shadow)"/>
    <text x="165" y="35" text-anchor="middle" fill="#E0D080" font-size="10" font-weight="bold">Break-Even Point</text>
    <text x="165" y="60" text-anchor="middle" fill="#80A080" font-size="10">(e.g. annual sales of 50,000 bottles)</text>

    <!-- Context Text -->
    <text x="265" y="83" fill="#A0B0C0" font-size="9">Fixed Costs</text>
    <text x="265" y="23" fill="#C06060" font-size="9">Total Costs</text>
    <text x="265" y="8" fill="#60C080" font-size="9">Total Revenue</text>
  </g>

  <rect x="40" y="495" width="720" height="30" rx="15" fill="#203040" filter="url(#shadow)"/>
  <text x="400" y="515" text-anchor="middle" fill="#A0C0E0" font-size="13" font-weight="bold">High Quality + Rigorous Financial Control = A Sustainable Fine Château Operating Model</text>

</svg>