<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140a06"/>
      <stop offset="100%" stop-color="#221010"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="100%" stop-color="#6A0F0F"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B3030"/>
      <stop offset="100%" stop-color="#5A1E1E"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4444"/>
      <stop offset="100%" stop-color="#4A2A2A"/>
    </linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4040"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" fill="url(#bg1)"/>

  <!-- Top ornamental line -->
  <line x1="60" y1="68" x2="740" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.6"/>
  <circle cx="60" cy="68" r="3" fill="#C0952C" opacity="0.6"/>
  <circle cx="740" cy="68" r="3" fill="#C0952C" opacity="0.6"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#C0952C" font-size="22" font-weight="bold" letter-spacing="2">Médoc AOC Classification Hierarchy</text>
  <text x="400" y="62" text-anchor="middle" fill="#9A7040" font-size="12">Médoc AOC Classification Hierarchy</text>

  <!-- === PYRAMID === -->
  <!-- Layer 4 (bottom) : Bordeaux AOC -->
  <polygon points="60,530 740,530 680,455 120,455" fill="url(#t4)" filter="url(#shadow)"/>
  <rect x="60" y="455" width="680" height="4" fill="#C0952C" opacity="0.4"/>
  <text x="400" y="489" text-anchor="middle" fill="#E8DCC8" font-size="16" font-weight="bold">Bordeaux AOC ／ Bordeaux Supérieur</text>
  <text x="400" y="512" text-anchor="middle" fill="#B8A080" font-size="12">Broadest Bordeaux appellation · ~57,000 ha · applicable region-wide</text>

  <!-- Layer 3 : Médoc AOC / Haut-Médoc AOC -->
  <polygon points="120,450 680,450 605,370 195,370" fill="url(#t3)" filter="url(#shadow)"/>
  <rect x="120" y="370" width="560" height="4" fill="#C0952C" opacity="0.5"/>
  <text x="400" y="402" text-anchor="middle" fill="#F0E4D0" font-size="15" font-weight="bold">Médoc AOC ／ Haut-Médoc AOC</text>
  <text x="400" y="422" text-anchor="middle" fill="#C0A878" font-size="12">Peninsula-level AOC · ~15,000 ha · stricter variety & yield rules</text>
  <text x="400" y="441" text-anchor="middle" fill="#A09060" font-size="11">Médoc AOC (North)　　Haut-Médoc AOC (Southern Core)</text>

  <!-- Layer 2 : 六大村莊級 AOC -->
  <polygon points="195,365 605,365 540,280 260,280" fill="url(#t2)" filter="url(#shadow)"/>
  <rect x="195" y="280" width="410" height="4" fill="#C0952C" opacity="0.6"/>
  <text x="400" y="308" text-anchor="middle" fill="#F5EAD8" font-size="15" font-weight="bold">Six Village AOCs (Village Appellations)</text>
  <text x="400" y="326" text-anchor="middle" fill="#D4B880" font-size="11">Margaux · Pauillac · Saint-Julien · Saint-Estèphe · Moulis · Listrac</text>
  <text x="400" y="346" text-anchor="middle" fill="#B09860" font-size="11">Strictest yield controls · specific varieties only · ~6,000 ha</text>

  <!-- Layer 1 (top) : Grand Cru Classé -->
  <polygon points="260,275 540,275 490,195 310,195" fill="url(#t1)" filter="url(#shadow)"/>
  <rect x="260" y="195" width="280" height="4" fill="#C0952C" opacity="0.8"/>
  <text x="400" y="223" text-anchor="middle" fill="#FFE8C0" font-size="14" font-weight="bold">1855 Classified Growths</text>
  <text x="400" y="241" text-anchor="middle" fill="#D4A840" font-size="12">Grands Crus Classés · 61 Châteaux</text>
  <text x="400" y="260" text-anchor="middle" fill="#B09030" font-size="11">1er ～ 5ème Grand Cru Classé</text>

  <!-- Crown at top -->
  <polygon points="310,190 340,155 370,175 400,145 430,175 460,155 490,190" fill="none" stroke="#C0952C" stroke-width="2"/>
  <polygon points="340,155 370,175 400,145 430,175 460,155 490,190 460,178 430,195 400,180 370,195 340,178 310,190" fill="#C0952C" opacity="0.15"/>
  <text x="400" y="174" text-anchor="middle" font-size="20">👑</text>

  <!-- Left arrow: 品質 -->
  <line x1="42" y1="510" x2="42" y2="215" stroke="#C0952C" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="4,0 8,8 0,8" fill="#C0952C"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <polygon points="4,8 8,0 0,0" fill="#888"/>
    </marker>
  </defs>
  <text x="30" y="365" text-anchor="middle" fill="#C0952C" font-size="12" font-weight="bold" transform="rotate(-90,30,365)">Quality Rules Stricter ▲</text>

  <!-- Right arrow: 面積 -->
  <line x1="758" y1="215" x2="758" y2="510" stroke="#888" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="770" y="365" text-anchor="middle" fill="#888" font-size="12" transform="rotate(90,770,365)">Appellation Area Expands ▼</text>

  <!-- Bottom note -->
  <line x1="60" y1="548" x2="740" y2="548" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="565" text-anchor="middle" fill="#706050" font-size="11">* Higher tiers = stricter AOC rules but smaller permitted areas · more precise quality benchmarks</text>
</svg>
