<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgVin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0808"/>
      <stop offset="100%" stop-color="#120c0c"/>
    </linearGradient>
    <filter id="shV"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="580" fill="url(#bgVin)"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="36" text-anchor="middle" fill="#C0952C" font-size="20" font-weight="bold">波爾多頂級年份品質概覽</text>
  <text x="400" y="56" text-anchor="middle" fill="#9A7040" font-size="12">Bordeaux Vintage Quality · 2000–2023 重要年份評分與特徵</text>

  <!-- Chart area -->
  <!-- Y axis: 80-100 points -->
  <!-- X axis: years 2000-2023 -->

  <rect x="55" y="74" width="710" height="310" rx="6" fill="#080608" stroke="#3a2020" stroke-width="1"/>

  <!-- Y axis labels and gridlines -->
  <text x="50" y="380" text-anchor="end" fill="#706050" font-size="9">80</text>
  <line x1="55" y1="378" x2="765" y2="378" stroke="#1a1010" stroke-width="0.7" stroke-dasharray="4,3"/>

  <text x="50" y="347" text-anchor="end" fill="#706050" font-size="9">85</text>
  <line x1="55" y1="345" x2="765" y2="345" stroke="#1a1010" stroke-width="0.7" stroke-dasharray="4,3"/>

  <text x="50" y="315" text-anchor="end" fill="#C0952C" font-size="9">90</text>
  <line x1="55" y1="313" x2="765" y2="313" stroke="#302010" stroke-width="1" stroke-dasharray="4,3" opacity="0.8"/>

  <text x="50" y="282" text-anchor="end" fill="#D0A040" font-size="9">95</text>
  <line x1="55" y1="280" x2="765" y2="280" stroke="#302010" stroke-width="0.7" stroke-dasharray="4,3"/>

  <text x="50" y="249" text-anchor="end" fill="#E8C060" font-size="9">99</text>
  <line x1="55" y1="247" x2="765" y2="247" stroke="#2a1808" stroke-width="0.7" stroke-dasharray="4,3"/>

  <!-- Score region fills -->
  <rect x="55" y="247" width="710" height="32" fill="#C0952C" opacity="0.04"/>
  <text x="770" y="263" fill="#C0A030" font-size="9">★★★★★</text>
  <rect x="55" y="280" width="710" height="32" fill="#C0952C" opacity="0.03"/>
  <text x="770" y="296" fill="#9A7030" font-size="9">★★★★</text>

  <!-- Year bars data: scores approximate based on industry consensus -->
  <!-- Format: year, score(0-100), color category -->
  <!-- Years: 2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023 -->
  <!-- X spacing: 710/24 ≈ 29.6px per year, starting at x=65 -->

  <!-- Helper: score to y: y = 378 - (score-80)*6.6 -->
  <!-- 80→378, 85→345, 90→313, 95→280, 99→253 -->

  <!-- 2000: 92 → y=313 + (90-92)*6.6 = 313-13=300, bar height=378-300=78 -->
  <rect x="63" y="300" width="22" height="78" rx="2" fill="#C08040" opacity="0.8"/>
  <text x="74" y="393" text-anchor="middle" fill="#806040" font-size="7.5">00</text>

  <!-- 2001: 86 → y = 378-(86-80)*6.6 = 378-40=338 -->
  <rect x="92" y="338" width="22" height="40" rx="2" fill="#6060A0" opacity="0.8"/>
  <text x="103" y="393" text-anchor="middle" fill="#606090" font-size="7.5">01</text>

  <!-- 2002: 82 → y=378-(82-80)*6.6=378-13=365 -->
  <rect x="121" y="365" width="22" height="13" rx="2" fill="#505080" opacity="0.6"/>
  <text x="132" y="393" text-anchor="middle" fill="#505070" font-size="7.5">02</text>

  <!-- 2003: 93 → special hot year -->
  <rect x="150" y="294" width="22" height="84" rx="2" fill="#E05020" opacity="0.85"/>
  <text x="161" y="393" text-anchor="middle" fill="#A04020" font-size="7.5">03</text>
  <text x="161" y="285" text-anchor="middle" fill="#FF6040" font-size="9">☀️</text>

  <!-- 2004: 84 → y=378-26=352 -->
  <rect x="179" y="352" width="22" height="26" rx="2" fill="#506080" opacity="0.7"/>
  <text x="190" y="393" text-anchor="middle" fill="#607080" font-size="7.5">04</text>

  <!-- 2005: 98 → y=378-118=260 (legendary!) -->
  <rect x="208" y="260" width="22" height="118" rx="2" fill="#C0952C" opacity="0.9"/>
  <text x="219" y="393" text-anchor="middle" fill="#A07020" font-size="7.5">05</text>
  <text x="219" y="252" text-anchor="middle" fill="#E0B040" font-size="9">⭐</text>

  <!-- 2006: 87 → y=378-46=332 -->
  <rect x="237" y="332" width="22" height="46" rx="2" fill="#7070A0" opacity="0.75"/>
  <text x="248" y="393" text-anchor="middle" fill="#6070A0" font-size="7.5">06</text>

  <!-- 2007: 81 → y=378-7=371 -->
  <rect x="266" y="371" width="22" height="7" rx="2" fill="#404060" opacity="0.6"/>
  <text x="277" y="393" text-anchor="middle" fill="#404060" font-size="7.5">07</text>

  <!-- 2008: 90 → y=313 -->
  <rect x="295" y="313" width="22" height="65" rx="2" fill="#A08040" opacity="0.8"/>
  <text x="306" y="393" text-anchor="middle" fill="#806030" font-size="7.5">08</text>

  <!-- 2009: 99 → y=247 (century!) -->
  <rect x="324" y="247" width="22" height="131" rx="2" fill="#FFD030" opacity="0.9"/>
  <text x="335" y="393" text-anchor="middle" fill="#C0A020" font-size="7.5">09</text>
  <text x="335" y="239" text-anchor="middle" fill="#FFD030" font-size="11">👑</text>

  <!-- 2010: 99 → y=247 (legendary!) -->
  <rect x="353" y="247" width="22" height="131" rx="2" fill="#FFD030" opacity="0.9"/>
  <text x="364" y="393" text-anchor="middle" fill="#C0A020" font-size="7.5">10</text>
  <text x="364" y="239" text-anchor="middle" fill="#FFD030" font-size="11">👑</text>

  <!-- 2011: 86 → y=338 -->
  <rect x="382" y="338" width="22" height="40" rx="2" fill="#607090" opacity="0.7"/>
  <text x="393" y="393" text-anchor="middle" fill="#607090" font-size="7.5">11</text>

  <!-- 2012: 87 (right bank better) -->
  <rect x="411" y="332" width="22" height="46" rx="2" fill="#6080A0" opacity="0.7"/>
  <text x="422" y="393" text-anchor="middle" fill="#5070A0" font-size="7.5">12</text>

  <!-- 2013: 82 → difficult -->
  <rect x="440" y="365" width="22" height="13" rx="2" fill="#405060" opacity="0.6"/>
  <text x="451" y="393" text-anchor="middle" fill="#405060" font-size="7.5">13</text>

  <!-- 2014: 91 → left bank great -->
  <rect x="469" y="306" width="22" height="72" rx="2" fill="#B07040" opacity="0.85"/>
  <text x="480" y="393" text-anchor="middle" fill="#906030" font-size="7.5">14</text>

  <!-- 2015: 97 → y=378-112=266 -->
  <rect x="498" y="266" width="22" height="112" rx="2" fill="#E09030" opacity="0.9"/>
  <text x="509" y="393" text-anchor="middle" fill="#B07020" font-size="7.5">15</text>
  <text x="509" y="258" text-anchor="middle" fill="#F0A040" font-size="9">⭐</text>

  <!-- 2016: 99 → LEGEND -->
  <rect x="527" y="247" width="22" height="131" rx="2" fill="#FFD030" opacity="0.9"/>
  <text x="538" y="393" text-anchor="middle" fill="#C0A020" font-size="7.5">16</text>
  <text x="538" y="239" text-anchor="middle" fill="#FFD030" font-size="11">👑</text>

  <!-- 2017: 89 → spring frost year -->
  <rect x="556" y="319" width="22" height="59" rx="2" fill="#8070A0" opacity="0.75"/>
  <text x="567" y="393" text-anchor="middle" fill="#706090" font-size="7.5">17</text>

  <!-- 2018: 95 → y=280 -->
  <rect x="585" y="280" width="22" height="98" rx="2" fill="#D08040" opacity="0.85"/>
  <text x="596" y="393" text-anchor="middle" fill="#A06030" font-size="7.5">18</text>

  <!-- 2019: 97 → y=266 -->
  <rect x="614" y="266" width="22" height="112" rx="2" fill="#E09030" opacity="0.88"/>
  <text x="625" y="393" text-anchor="middle" fill="#B07020" font-size="7.5">19</text>
  <text x="625" y="258" text-anchor="middle" fill="#F0A040" font-size="9">⭐</text>

  <!-- 2020: 94 → y=286 -->
  <rect x="643" y="286" width="22" height="92" rx="2" fill="#C07838" opacity="0.85"/>
  <text x="654" y="393" text-anchor="middle" fill="#906030" font-size="7.5">20</text>

  <!-- 2021: 90 (cool year, good acid) -->
  <rect x="672" y="313" width="22" height="65" rx="2" fill="#6090A0" opacity="0.8"/>
  <text x="683" y="393" text-anchor="middle" fill="#507080" font-size="7.5">21</text>

  <!-- 2022: 94 → hot/dry but good -->
  <rect x="701" y="286" width="22" height="92" rx="2" fill="#D06840" opacity="0.85"/>
  <text x="712" y="393" text-anchor="middle" fill="#A05030" font-size="7.5">22</text>

  <!-- 2023: 97 → exceptional! -->
  <rect x="730" y="266" width="22" height="112" rx="2" fill="#E09030" opacity="0.88"/>
  <text x="741" y="393" text-anchor="middle" fill="#B07020" font-size="7.5">23</text>
  <text x="741" y="258" text-anchor="middle" fill="#F0A040" font-size="9">⭐</text>

  <!-- X axis label -->
  <text x="400" y="403" text-anchor="middle" fill="#605040" font-size="10">年份 →</text>

  <!-- Legend -->
  <rect x="55" y="415" width="710" height="50" rx="6" fill="#0c0808" stroke="#3a2020" stroke-width="0.8"/>
  <rect x="75" y="430" width="16" height="16" rx="2" fill="#FFD030" opacity="0.9"/>
  <text x="97" y="442" fill="#E0C060" font-size="11" font-weight="bold">傳奇年份 (99分)</text>
  <text x="97" y="455" fill="#907040" font-size="10">2009、2010、2016</text>

  <rect x="230" y="430" width="16" height="16" rx="2" fill="#E09030" opacity="0.9"/>
  <text x="252" y="442" fill="#D09050" font-size="11" font-weight="bold">頂級年份 (95–98分)</text>
  <text x="252" y="455" fill="#907040" font-size="10">2005、2015、2019、2023</text>

  <rect x="440" y="430" width="16" height="16" rx="2" fill="#B07040" opacity="0.85"/>
  <text x="462" y="442" fill="#C08050" font-size="11" font-weight="bold">優秀年份 (90–94分)</text>
  <text x="462" y="455" fill="#807040" font-size="10">2008、2014、2018、2020</text>

  <rect x="640" y="430" width="16" height="16" rx="2" fill="#5060A0" opacity="0.7"/>
  <text x="662" y="442" fill="#8080B0" font-size="11" font-weight="bold">一般年份 (&lt;90分)</text>
  <text x="662" y="455" fill="#606080" font-size="10">2002、2007、2013</text>

  <!-- Bottom annotation -->
  <rect x="40" y="476" width="720" height="90" rx="8" fill="#0a0808" stroke="#C0952C" stroke-width="0.8" stroke-opacity="0.4" filter="url(#shV)"/>
  <text x="400" y="498" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">📌 年份解讀要點</text>
  <line x1="60" y1="504" x2="740" y2="504" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <text x="80" y="522" fill="#A08060" font-size="11" font-weight="bold">左岸佳年</text>
  <text x="80" y="536" fill="#C0A080" font-size="11">炎熱乾燥利於 Cab.S. 成熟：2000、2005、2009、2015、2016、2022</text>

  <text x="80" y="552" fill="#80A060" font-size="11" font-weight="bold">右岸佳年</text>
  <text x="80" y="566" fill="#A0C080" font-size="11">涼爽均衡利於 Merlot：2012（右岸優）、2010、2016、2023</text>
</svg>
