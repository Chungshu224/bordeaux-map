<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 165">
  <defs>
    <linearGradient id="bg-tignanello" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A0E1C"/>
      <stop offset="100%" stop-color="#AA2840"/>
    </linearGradient>
    <linearGradient id="shine-tignanello" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="65%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="90" height="165" rx="10" fill="url(#bg-tignanello)"/>
  <!-- 瓶身（Bordeaux 方肩型） -->
  <rect x="26" y="55" width="38" height="85" rx="3" fill="rgba(8,18,8,0.88)"/>
  <!-- 瓶肩 -->
  <path d="M26 55 Q26 44 32 40 L32 30 L58 30 L58 40 Q64 44 64 55Z" fill="rgba(8,18,8,0.88)"/>
  <!-- 瓶頸 -->
  <rect x="32" y="18" width="26" height="14" rx="2" fill="rgba(8,18,8,0.88)"/>
  <!-- 瓶頂帽蓋 -->
  <rect x="31" y="12" width="28" height="8" rx="2" fill="#D06080" opacity="0.92"/>
  <rect x="31" y="18" width="28" height="2" fill="rgba(255,255,255,0.2)"/>
  <!-- 正標 -->
  <rect x="28" y="66" width="34" height="48" rx="2.5" fill="#C04060" opacity="0.9"/>
  <!-- 標籤裝飾線 -->
  <rect x="30" y="68" width="30" height="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="30" y="111" width="30" height="1" fill="rgba(255,255,255,0.4)"/>
  <!-- 標籤文字 -->
  <text x="45" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="white" font-weight="bold" letter-spacing="0.5">TIGNANELLO</text>
  <text x="45" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.2" fill="rgba(255,255,255,0.85)">Toscana IGT</text>
  <text x="45" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.2" fill="rgba(255,255,255,0.75)"></text>
  <text x="45" y="107" text-anchor="middle" font-family="Georgia, serif" font-size="5.5" fill="rgba(255,230,150,0.85)" font-style="italic">Est. 1971</text>
  <!-- 光澤效果 -->
  <rect x="27" y="55" width="35" height="83" rx="2" fill="url(#shine-tignanello)" opacity="0.4"/>
  <!-- 酒液顏色透視 -->
  <rect x="27" y="57" width="36" height="80" rx="2" fill="rgba(80,5,15,0.18)"/>
  <!-- 底部名稱 -->
  <text x="45" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" fill="rgba(255,255,255,0.75)" font-style="italic">Tignanello</text>
</svg>