  <text x="18" y="22" font-family="Georgia, serif" font-size="15" fill="rgba(255,255,255,0.92)" font-weight="bold">🌋 南義 South</text>
  <!-- 子產區列表 -->
  <text x="18" y="36" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.58)" letter-spacing="0.5">Campania · Puglia · Sicilia · Sardinia · Calabria</text>
</svg>