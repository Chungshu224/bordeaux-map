<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgViti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1A10"/>
      <stop offset="50%" stop-color="#152A18"/>
      <stop offset="100%" stop-color="#1A3A20"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgViti)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#A0E0B0" font-size="24" font-weight="bold">波爾多葡萄園管理與永續農業三大體系</text>
  <text x="400" y="65" text-anchor="middle" fill="#80C090" font-size="13">Vineyard Management Cycle &amp; Sustainable Viticulture Practices</text>

  <!-- Cycle Graphic -->
  <g transform="translate(180, 270)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#254030" stroke-width="40" filter="url(#shadow)"/>
    <path d="M 0 -130 A 130 130 0 0 1 130 0" fill="none" stroke="#60A070" stroke-width="40"/> <!-- Spring -->
    <path d="M 130 0 A 130 130 0 0 1 0 130" fill="none" stroke="#A0D080" stroke-width="40"/> <!-- Summer -->
    <path d="M 0 130 A 130 130 0 0 1 -130 0" fill="none" stroke="#D0A060" stroke-width="40"/> <!-- Autumn -->
    <path d="M -130 0 A 130 130 0 0 1 0 -130" fill="none" stroke="#6080A0" stroke-width="40"/> <!-- Winter -->
    
    <!-- Sun/Center -->
    <circle cx="0" cy="0" r="30" fill="#203A25" stroke="#407045" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" fill="#80D0A0" font-size="16" font-weight="bold">全年</text>
    <text x="0" y="20" text-anchor="middle" fill="#60A080" font-size="10">週期</text>

    <!-- Seasons & Activities -->
    <!-- Winter -->
    <circle cx="-130" cy="-60" r="25" fill="#1A2A3A" stroke="#6080A0"/>
    <text x="-130" y="-55" text-anchor="middle" fill="#A0C0E0" font-size="18">✂️</text>
    <text x="-170" y="-15" text-anchor="middle" fill="#80B0D0" font-size="14" font-weight="bold">冬季 (Winter)</text>
    <text x="-170" y="5" text-anchor="middle" fill="#6090B0" font-size="11">剪枝 (Pruning)</text>
    <text x="-170" y="20" text-anchor="middle" fill="#6090B0" font-size="11">決定來年產量結構</text>

    <!-- Spring -->
    <circle cx="60" cy="-130" r="25" fill="#1A3A25" stroke="#60A070"/>
    <text x="60" y="-125" text-anchor="middle" fill="#A0E0B0" font-size="18">🌱</text>
    <text x="130" y="-125" text-anchor="middle" fill="#80C090" font-size="14" font-weight="bold">春季 (Spring)</text>
    <text x="130" y="-105" text-anchor="middle" fill="#60A070" font-size="11">萌芽防霜凍</text>
    <text x="130" y="-90" text-anchor="middle" fill="#60A070" font-size="11">除芽與新梢管理</text>

    <!-- Summer -->
    <circle cx="130" cy="60" r="25" fill="#2A3A1A" stroke="#A0D080"/>
    <text x="130" y="65" text-anchor="middle" fill="#C0F0A0" font-size="18">☀️</text>
    <text x="160" y="10" text-anchor="middle" fill="#A0C080" font-size="14" font-weight="bold">夏季 (Summer)</text>
    <text x="160" y="30" text-anchor="middle" fill="#80A060" font-size="11">摘葉通風 (Canopy)</text>
    <text x="160" y="45" text-anchor="middle" fill="#80A060" font-size="11">綠色採收控產</text>

    <!-- Autumn -->
    <circle cx="-60" cy="130" r="25" fill="#3A251A" stroke="#D0A060"/>
    <text x="-60" y="135" text-anchor="middle" fill="#F0C080" font-size="18">🍇</text>
    <text x="-130" y="120" text-anchor="middle" fill="#D0A070" font-size="14" font-weight="bold">秋季 (Autumn)</text>
    <text x="-130" y="140" text-anchor="middle" fill="#B08050" font-size="11">監測完美成熟度</text>
    <text x="-130" y="155" text-anchor="middle" fill="#B08050" font-size="11">採收時機與物流</text>
  </g>

  <!-- Right Side: Sustainable Paradigms -->
  <rect x="420" y="120" width="340" height="340" rx="8" fill="#101815" stroke="#305035" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="155" text-anchor="middle" fill="#A0E0B0" font-size="16" font-weight="bold">波爾多三大永續農業哲學</text>

  <!-- HVE -->
  <rect x="440" y="180" width="300" height="70" rx="6" fill="#152A20" stroke="#408050" stroke-width="1"/>
  <circle cx="475" cy="215" r="18" fill="#0A1510" stroke="#40A060"/>
  <text x="475" y="221" text-anchor="middle" fill="#80E0A0" font-size="18">🌍</text>
  <text x="510" y="205" fill="#A0E0B0" font-size="14" font-weight="bold">HVE (高環境價值)</text>
  <text x="510" y="225" fill="#80B090" font-size="11">國家級標準。著重生物多樣性、植物保護</text>
  <text x="510" y="240" fill="#80B090" font-size="11">大幅減少化療，重視 IPM 綜合防治管理。</text>

  <!-- Organic (AB) -->
  <rect x="440" y="270" width="300" height="70" rx="6" fill="#1A2A1A" stroke="#609050" stroke-width="1"/>
  <circle cx="475" cy="305" r="18" fill="#0D1A0D" stroke="#60B060"/>
  <text x="475" y="311" text-anchor="middle" fill="#60C060" font-size="18">🌿</text>
  <text x="510" y="295" fill="#80D090" font-size="14" font-weight="bold">Organic (有機農業 - AB 인증)</text>
  <text x="510" y="315" fill="#70A080" font-size="11">禁用人工合成化學肥料與系統性農藥。</text>
  <text x="510" y="330" fill="#70A080" font-size="11">只允許使用天然物質，如銅(波爾多液)與硫防霉。</text>

  <!-- Biodynamic (Demeter/Biodyvin) -->
  <rect x="440" y="360" width="300" height="70" rx="6" fill="#151A25" stroke="#507090" stroke-width="1"/>
  <circle cx="475" cy="395" r="18" fill="#0D101A" stroke="#6080C0"/>
  <text x="475" y="401" text-anchor="middle" fill="#80A0E0" font-size="18">🌙</text>
  <text x="510" y="385" fill="#A0C0E0" font-size="14" font-weight="bold">Biodynamic (生物動力法)</text>
  <text x="510" y="405" fill="#80A0B0" font-size="11">將葡萄園視為獨立生態生命體。</text>
  <text x="510" y="420" fill="#80A0B0" font-size="11">依循日月星辰曆法，使用「500/501」等配方製劑。</text>

  <!-- Bottom Quote -->
  <rect x="40" y="480" width="720" height="40" rx="8" fill="#152A18" stroke="#306040" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="505" text-anchor="middle" fill="#90D0A0" font-size="14" font-weight="bold">💡 從科學管理到生態哲學：好酒，永遠誕生於健康的葡萄園中。</text>

</svg>