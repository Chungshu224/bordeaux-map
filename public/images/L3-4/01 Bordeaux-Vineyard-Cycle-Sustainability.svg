<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgViti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1A10"/>
      <stop offset="50%" stop-color="#152A18"/>
      <stop offset="100%" stop-color="#1A3A20"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgViti)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#A0E0B0" font-size="24" font-weight="bold">Bordeaux Vineyard Management & Three Sustainability Systems</text>
  <text x="400" y="65" text-anchor="middle" fill="#80C090" font-size="13">Vineyard Management Cycle &amp; Sustainable Viticulture Practices</text>

  <!-- Cycle Graphic -->
  <g transform="translate(180, 270)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#254030" stroke-width="40" filter="url(#shadow)"/>
    <path d="M 0 -130 A 130 130 0 0 1 130 0" fill="none" stroke="#60A070" stroke-width="40"/> <!-- Spring -->
    <path d="M 130 0 A 130 130 0 0 1 0 130" fill="none" stroke="#A0D080" stroke-width="40"/> <!-- Summer -->
    <path d="M 0 130 A 130 130 0 0 1 -130 0" fill="none" stroke="#D0A060" stroke-width="40"/> <!-- Autumn -->
    <path d="M -130 0 A 130 130 0 0 1 0 -130" fill="none" stroke="#6080A0" stroke-width="40"/> <!-- Winter -->
    
    <!-- Sun/Center -->
    <circle cx="0" cy="0" r="30" fill="#203A25" stroke="#407045" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" fill="#80D0A0" font-size="16" font-weight="bold">Annual</text>
    <text x="0" y="20" text-anchor="middle" fill="#60A080" font-size="10">Cycle</text>

    <!-- Seasons & Activities -->
    <!-- Winter -->
    <circle cx="-130" cy="-60" r="25" fill="#1A2A3A" stroke="#6080A0"/>
    <text x="-130" y="-55" text-anchor="middle" fill="#A0C0E0" font-size="18">✂️</text>
    <text x="-170" y="-15" text-anchor="middle" fill="#80B0D0" font-size="14" font-weight="bold">Winter</text>
    <text x="-170" y="5" text-anchor="middle" fill="#6090B0" font-size="11">Pruning</text>
    <text x="-170" y="20" text-anchor="middle" fill="#6090B0" font-size="11">Determines next year's yield structure</text>

    <!-- Spring -->
    <circle cx="60" cy="-130" r="25" fill="#1A3A25" stroke="#60A070"/>
    <text x="60" y="-125" text-anchor="middle" fill="#A0E0B0" font-size="18">🌱</text>
    <text x="130" y="-125" text-anchor="middle" fill="#80C090" font-size="14" font-weight="bold">Spring</text>
    <text x="130" y="-105" text-anchor="middle" fill="#60A070" font-size="11">Budbreak & Frost Protection</text>
    <text x="130" y="-90" text-anchor="middle" fill="#60A070" font-size="11">Bud removal & shoot management</text>

    <!-- Summer -->
    <circle cx="130" cy="60" r="25" fill="#2A3A1A" stroke="#A0D080"/>
    <text x="130" y="65" text-anchor="middle" fill="#C0F0A0" font-size="18">☀️</text>
    <text x="160" y="10" text-anchor="middle" fill="#A0C080" font-size="14" font-weight="bold">Summer</text>
    <text x="160" y="30" text-anchor="middle" fill="#80A060" font-size="11">Leaf removal & Canopy Management</text>
    <text x="160" y="45" text-anchor="middle" fill="#80A060" font-size="11">Green harvest (crop thinning)</text>

    <!-- Autumn -->
    <circle cx="-60" cy="130" r="25" fill="#3A251A" stroke="#D0A060"/>
    <text x="-60" y="135" text-anchor="middle" fill="#F0C080" font-size="18">🍇</text>
    <text x="-130" y="120" text-anchor="middle" fill="#D0A070" font-size="14" font-weight="bold">Autumn</text>
    <text x="-130" y="140" text-anchor="middle" fill="#B08050" font-size="11">Monitoring for perfect ripeness</text>
    <text x="-130" y="155" text-anchor="middle" fill="#B08050" font-size="11">Harvest timing & logistics</text>
  </g>

  <!-- Right Side: Sustainable Paradigms -->
  <rect x="420" y="120" width="340" height="340" rx="8" fill="#101815" stroke="#305035" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="155" text-anchor="middle" fill="#A0E0B0" font-size="16" font-weight="bold">Bordeaux's Three Sustainability Philosophies</text>

  <!-- HVE -->
  <rect x="440" y="180" width="300" height="70" rx="6" fill="#152A20" stroke="#408050" stroke-width="1"/>
  <circle cx="475" cy="215" r="18" fill="#0A1510" stroke="#40A060"/>
  <text x="475" y="221" text-anchor="middle" fill="#80E0A0" font-size="18">🌍</text>
  <text x="510" y="205" fill="#A0E0B0" font-size="14" font-weight="bold">HVE (High Environmental Value)</text>
  <text x="510" y="225" fill="#80B090" font-size="11">National standard. Focused on biodiversity and plant protection.</text>
  <text x="510" y="240" fill="#80B090" font-size="11">Substantially reduces chemical treatments; prioritises Integrated Pest Management (IPM).</text>

  <!-- Organic (AB) -->
  <rect x="440" y="270" width="300" height="70" rx="6" fill="#1A2A1A" stroke="#609050" stroke-width="1"/>
  <circle cx="475" cy="305" r="18" fill="#0D1A0D" stroke="#60B060"/>
  <text x="475" y="311" text-anchor="middle" fill="#60C060" font-size="18">🌿</text>
  <text x="510" y="295" fill="#80D090" font-size="14" font-weight="bold">Organic (Organic Farming – AB Certification)</text>
  <text x="510" y="315" fill="#70A080" font-size="11">Prohibits synthetic chemical fertilisers and systemic pesticides.</text>
  <text x="510" y="330" fill="#70A080" font-size="11">Only natural substances permitted, such as copper (Bordeaux mixture) and sulphur for mildew.</text>

  <!-- Biodynamic (Demeter/Biodyvin) -->
  <rect x="440" y="360" width="300" height="70" rx="6" fill="#151A25" stroke="#507090" stroke-width="1"/>
  <circle cx="475" cy="395" r="18" fill="#0D101A" stroke="#6080C0"/>
  <text x="475" y="401" text-anchor="middle" fill="#80A0E0" font-size="18">🌙</text>
  <text x="510" y="385" fill="#A0C0E0" font-size="14" font-weight="bold">Biodynamic (Biodynamic Farming)</text>
  <text x="510" y="405" fill="#80A0B0" font-size="11">Treats the vineyard as a self-contained ecological organism.</text>
  <text x="510" y="420" fill="#80A0B0" font-size="11">Follows a lunar-solar calendar; uses preparations such as "500/501".</text>

  <!-- Bottom Quote -->
  <rect x="40" y="480" width="720" height="40" rx="8" fill="#152A18" stroke="#306040" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="505" text-anchor="middle" fill="#90D0A0" font-size="14" font-weight="bold">💡 From scientific management to ecological philosophy: great wine is always born in a healthy vineyard.</text>

</svg>