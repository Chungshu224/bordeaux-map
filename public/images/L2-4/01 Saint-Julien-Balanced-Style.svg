<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bgSJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#10121e"/>
    </linearGradient>
    <filter id="shSJ"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgSJ)"/>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>

  <text x="400" y="40" text-anchor="middle" fill="#C0952C" font-size="21" font-weight="bold">Saint-Julien　The Balanced Benchmark</text>
  <text x="400" y="60" text-anchor="middle" fill="#9A7040" font-size="12">Médoc's "Balanced Benchmark" · perfect gravel-clay ratio · consistently high quality</text>

  <!-- Center balance visualization -->
  <rect x="40" y="82" width="720" height="100" rx="8" fill="#0E1018" stroke="#4466AA" stroke-width="1.5" filter="url(#shSJ)"/>
  <text x="400" y="108" text-anchor="middle" fill="#88AAFF" font-size="15" font-weight="bold">⚖️ Why the "Balanced Benchmark"?</text>

  <!-- Balance scale visual -->
  <line x1="400" y1="115" x2="400" y2="135" stroke="#8888CC" stroke-width="2"/>
  <line x1="240" y1="135" x2="560" y2="135" stroke="#8888CC" stroke-width="2.5"/>
  <!-- Left pan -->
  <line x1="268" y1="135" x2="250" y2="158" stroke="#6688CC" stroke-width="1.5"/>
  <rect x="220" y="158" width="60" height="18" rx="4" fill="#2A3868" stroke="#4466AA" stroke-width="1"/>
  <text x="250" y="171" text-anchor="middle" fill="#A0C0FF" font-size="10">Gravel 45%</text>
  <!-- Right pan -->
  <line x1="532" y1="135" x2="550" y2="158" stroke="#6688CC" stroke-width="1.5"/>
  <rect x="520" y="158" width="60" height="18" rx="4" fill="#2A3868" stroke="#4466AA" stroke-width="1"/>
  <text x="550" y="171" text-anchor="middle" fill="#A0C0FF" font-size="10">Clay 30%</text>
  <text x="400" y="163" text-anchor="middle" fill="#6680CC" font-size="11">Perfect Balance</text>

  <!-- Two columns below -->
  <rect x="40" y="196" width="350" height="200" rx="8" fill="#0E1018" stroke="#4466AA" stroke-width="1.5" filter="url(#shSJ)"/>
  <rect x="40" y="196" width="350" height="48" rx="8" fill="#1E3060"/>
  <rect x="40" y="224" width="350" height="20" fill="#1E3060"/>
  <text x="215" y="220" text-anchor="middle" fill="#C0D8FF" font-size="15" font-weight="bold">🍷 Style Profile</text>

  <text x="60" y="260" fill="#88AAFF" font-size="12" font-weight="bold">Aromas</text>
  <text x="60" y="276" fill="#C0D0F0" font-size="11">Blackcurrant · Blackberry · Violet</text>
  <text x="60" y="292" fill="#C0D0F0" font-size="11">Cedar · Spice · Smoke</text>
  <text x="60" y="316" fill="#88AAFF" font-size="12" font-weight="bold">Palate</text>
  <text x="60" y="332" fill="#C0D0F0" font-size="11">Medium-to-full body · ripe, rounded tannins</text>
  <text x="60" y="348" fill="#C0D0F0" font-size="11">Perfect acidity · long finish</text>
  <text x="60" y="372" fill="#88AAFF" font-size="12" font-weight="bold">Ageing</text>
  <text x="60" y="388" fill="#C0D0F0" font-size="11">Classified estates 15–30 years · generally more approachable than Pauillac</text>
  <text x="60" y="403" fill="#C0D0F0" font-size="11">earlier; more durable than Margaux</text>

  <rect x="410" y="196" width="350" height="200" rx="8" fill="#0E1018" stroke="#4466AA" stroke-width="1.5" filter="url(#shSJ)"/>
  <rect x="410" y="196" width="350" height="48" rx="8" fill="#1E3060"/>
  <rect x="410" y="224" width="350" height="20" fill="#1E3060"/>
  <text x="585" y="220" text-anchor="middle" fill="#C0D8FF" font-size="15" font-weight="bold">🏰 Key Classified Estates</text>

  <text x="430" y="260" fill="#D4A840" font-size="13" font-weight="bold">Château Léoville Las Cases　Second Growth</text>
  <text x="430" y="276" fill="#C0A060" font-size="11">Hailed as "the greatest Second Growth" · near First Growth quality</text>
  <text x="430" y="300" fill="#D4A840" font-size="13" font-weight="bold">Château Léoville Barton　Second Growth</text>
  <text x="430" y="316" fill="#C0A060" font-size="11">Estate-bottled · one of the best value classified estates</text>
  <text x="430" y="340" fill="#D4A840" font-size="13" font-weight="bold">Château Ducru-Beaucaillou　Second Growth</text>
  <text x="430" y="356" fill="#C0A060" font-size="11">Elegant and refined · deepest gravel in the commune</text>
  <text x="430" y="380" fill="#B09050" font-size="12">Also: Gruaud Larose · Talbot (Fourth Growth)</text>
  <text x="430" y="396" fill="#B09050" font-size="12">Beychevelle · Branaire-Ducru (Fourth Growth)</text>

  <!-- Bottom info bar -->
  <rect x="40" y="410" width="720" height="65" rx="8" fill="#0A0C14" stroke="#4466AA" stroke-width="1" stroke-opacity="0.4" filter="url(#shSJ)"/>
  <text x="400" y="434" text-anchor="middle" fill="#8899CC" font-size="13" font-weight="bold">Saint-Julien AOC Facts</text>
  <line x1="60" y1="440" x2="740" y2="440" stroke="#4466AA" stroke-width="0.5" opacity="0.4"/>

  <text x="160" y="460" text-anchor="middle" fill="#8899BB" font-size="12" font-weight="bold">Area</text>
  <text x="160" y="474" text-anchor="middle" fill="#C0D0F0" font-size="12">910 ha</text>
  <line x1="270" y1="446" x2="270" y2="468" stroke="#2A3860" stroke-width="1"/>
  <text x="360" y="460" text-anchor="middle" fill="#8899BB" font-size="12" font-weight="bold">Classified Growths</text>
  <text x="360" y="474" text-anchor="middle" fill="#C0D0F0" font-size="12">11 (all Second to Fourth Growths)</text>
  <line x1="480" y1="446" x2="480" y2="468" stroke="#2A3860" stroke-width="1"/>
  <text x="570" y="460" text-anchor="middle" fill="#8899BB" font-size="12" font-weight="bold">Characteristic</text>
  <text x="570" y="474" text-anchor="middle" fill="#C0D0F0" font-size="12">No First Growth, yet most consistently high quality overall</text>
  <line x1="670" y1="446" x2="670" y2="468" stroke="#2A3860" stroke-width="1"/>
  <text x="720" y="460" text-anchor="middle" fill="#C0952C" font-size="13" font-weight="bold">100%</text>
  <text x="720" y="474" text-anchor="middle" fill="#907840" font-size="11">Balance Index</text>

  <!-- Bottom note -->
  <line x1="40" y1="486" x2="760" y2="486" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="503" text-anchor="middle" fill="#706050" font-size="11">* Despite having no First Growth, Saint-Julien holds six Second Growths; its overall quality consistency is the highest among Médoc's four main villages</text>
  <text x="400" y="516" text-anchor="middle" fill="#504030" font-size="11">Situated between Pauillac (power) and Margaux (elegance), Saint-Julien perfectly blends the strengths of both</text>
</svg>
