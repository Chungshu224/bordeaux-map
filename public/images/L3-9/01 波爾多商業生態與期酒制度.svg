<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgBiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <filter id="shB"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgBiz)"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#C0A060" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="36" text-anchor="middle" fill="#E8C070" font-size="20" font-weight="bold">波爾多葡萄酒商業生態圈系統</text>
  <text x="400" y="56" text-anchor="middle" fill="#A0A0C0" font-size="12">The Bordeaux Wine Business Ecosystem · 價值鏈與「波爾多市場（La Place de Bordeaux）」運作機制</text>

  <!-- Production Tier -->
  <rect x="60" y="90" width="180" height="120" rx="8" fill="#182030" stroke="#4060A0" stroke-width="1.5" filter="url(#shB)"/>
  <text x="150" y="120" text-anchor="middle" fill="#80B0F0" font-size="14" font-weight="bold">🏰 酒莊 (Châteaux)</text>
  <text x="150" y="145" text-anchor="middle" fill="#C0D0E0" font-size="11">生產者</text>
  <text x="150" y="165" text-anchor="middle" fill="#90A0C0" font-size="10">• 專注葡萄種植與釀造</text>
  <text x="150" y="180" text-anchor="middle" fill="#90A0C0" font-size="10">• 制定品牌與定價策略</text>
  <text x="150" y="195" text-anchor="middle" fill="#90A0C0" font-size="10">• 產量分配管理</text>

  <!-- Broker Tier -->
  <rect x="310" y="90" width="180" height="120" rx="8" fill="#201830" stroke="#A060A0" stroke-width="1.5" filter="url(#shB)"/>
  <text x="400" y="120" text-anchor="middle" fill="#D0A0F0" font-size="14" font-weight="bold">🤝 經紀人 (Courtiers)</text>
  <text x="400" y="145" text-anchor="middle" fill="#E0D0E0" font-size="11">中介與保證人</text>
  <text x="400" y="165" text-anchor="middle" fill="#B0A0C0" font-size="10">• 連接酒莊與酒商</text>
  <text x="400" y="180" text-anchor="middle" fill="#B0A0C0" font-size="10">• 價格談判與資訊傳遞</text>
  <text x="400" y="195" text-anchor="middle" fill="#B0A0C0" font-size="10">• 收取 2% 固定佣金</text>

  <!-- Merchant Tier -->
  <rect x="560" y="90" width="180" height="120" rx="8" fill="#302018" stroke="#A07040" stroke-width="1.5" filter="url(#shB)"/>
  <text x="650" y="120" text-anchor="middle" fill="#F0B080" font-size="14" font-weight="bold">🏢 酒商 (Négociants)</text>
  <text x="650" y="145" text-anchor="middle" fill="#E0D0C0" font-size="11">批發與出口商</text>
  <text x="650" y="165" text-anchor="middle" fill="#C0A090" font-size="10">• 承擔庫存與資金風險</text>
  <text x="650" y="180" text-anchor="middle" fill="#C0A090" font-size="10">• 全球分銷網絡</text>
  <text x="650" y="195" text-anchor="middle" fill="#C0A090" font-size="10">• 推廣與物流管理</text>

  <!-- Connection Arrows -->
  <path d="M 240,150 L 300,150" fill="none" stroke="#C0C0D0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 490,150 L 550,150" fill="none" stroke="#C0C0D0" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#C0C0D0"/>
    </marker>
  </defs>

  <!-- La Place Box (Encircling Broker & Merchant) -->
  <rect x="290" y="65" width="470" height="160" rx="10" fill="none" stroke="#80C080" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="525" y="80" text-anchor="middle" fill="#80C080" font-size="12" font-weight="bold">La Place de Bordeaux (波爾多市場/交易廣場)</text>

  <!-- En Primeur System Section -->
  <rect x="60" y="240" width="680" height="260" rx="8" fill="#151b18" stroke="#508050" stroke-width="1.5" filter="url(#shB)"/>
  <text x="400" y="270" text-anchor="middle" fill="#80D080" font-size="15" font-weight="bold">💰 期酒制度 (En Primeur) 運作流程</text>
  <text x="400" y="290" text-anchor="middle" fill="#80A080" font-size="11">提前銷售還在橡木桶中陳釀的葡萄酒，創造「金融+商品」雙重期貨屬性</text>

  <line x1="100" y1="305" x2="700" y2="305" stroke="#305030" stroke-width="1"/>

  <!-- Timeline Steps for En Primeur -->
  <circle cx="150" cy="350" r="15" fill="#204020" stroke="#80D080" stroke-width="2"/>
  <text x="150" y="355" text-anchor="middle" fill="#D0F0D0" font-size="14" font-weight="bold">1</text>
  <text x="150" y="380" text-anchor="middle" fill="#80D080" font-size="12" font-weight="bold">採收與發釀</text>
  <text x="150" y="400" text-anchor="middle" fill="#A0C0A0" font-size="10">年份 N 的 9-10 月</text>
  <text x="150" y="415" text-anchor="middle" fill="#709070" font-size="9">葡萄酒進入橡木桶</text>

  <path d="M 180,350 L 290,350" fill="none" stroke="#508050" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <circle cx="320" cy="350" r="15" fill="#303010" stroke="#E0C060" stroke-width="2"/>
  <text x="320" y="355" text-anchor="middle" fill="#F0F0D0" font-size="14" font-weight="bold">2</text>
  <text x="320" y="380" text-anchor="middle" fill="#E0C060" font-size="12" font-weight="bold">期酒品鑑週</text>
  <text x="320" y="400" text-anchor="middle" fill="#C0B080" font-size="10">年份 N+1 的 4 月</text>
  <text x="320" y="415" text-anchor="middle" fill="#908060" font-size="9">酒評家打分與定價</text>

  <path d="M 350,350 L 460,350" fill="none" stroke="#808040" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <circle cx="490" cy="350" r="15" fill="#103040" stroke="#60A0E0" stroke-width="2"/>
  <text x="490" y="355" text-anchor="middle" fill="#D0E0F0" font-size="14" font-weight="bold">3</text>
  <text x="490" y="380" text-anchor="middle" fill="#60A0E0" font-size="12" font-weight="bold">市場發售款</text>
  <text x="490" y="400" text-anchor="middle" fill="#A0C0E0" font-size="10">年份 N+1 的 5-6 月</text>
  <text x="490" y="415" text-anchor="middle" fill="#7090B0" font-size="9">酒商/藏家支付定金</text>

  <path d="M 520,350 L 630,350" fill="none" stroke="#406080" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <circle cx="660" cy="350" r="15" fill="#401020" stroke="#F06080" stroke-width="2"/>
  <text x="660" y="355" text-anchor="middle" fill="#F0D0E0" font-size="14" font-weight="bold">4</text>
  <text x="660" y="380" text-anchor="middle" fill="#F06080" font-size="12" font-weight="bold">裝瓶與交付</text>
  <text x="660" y="400" text-anchor="middle" fill="#D0A0B0" font-size="10">年份 N+2 的 春季</text>
  <text x="660" y="415" text-anchor="middle" fill="#B07080" font-size="9">實體酒送達消費者</text>

  <!-- Advantages of En Primeur -->
  <rect x="80" y="440" width="310" height="45" rx="5" fill="#1a251a" stroke="#80D080" stroke-width="0.5"/>
  <text x="90" y="458" fill="#A0D0A0" font-size="11" font-weight="bold">酒莊優勢 (資金面)</text>
  <text x="90" y="475" fill="#709070" font-size="10">提早18個月獲得現金流，降低倉儲與庫存壓力</text>

  <rect x="410" y="440" width="310" height="45" rx="5" fill="#1a202a" stroke="#60A0E0" stroke-width="0.5"/>
  <text x="420" y="458" fill="#A0C0E0" font-size="11" font-weight="bold">買家優勢 (投資面)</text>
  <text x="420" y="475" fill="#7080A0" font-size="10">以低於裝瓶後的價格(通常便宜15-30%)確保買到稀有配額</text>

  <!-- Bottom Note -->
  <line x1="40" y1="520" x2="760" y2="520" stroke="#C0A060" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="534" text-anchor="middle" fill="#807050" font-size="10">💡 現代趨勢：部分頂級酒莊（如 Latour）正逐步減少期酒釋放比例，轉向於適飲期再從酒窖發售（Ex-Château）以提升利潤控制權。</text>
</svg>