<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgWine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0508"/>
      <stop offset="50%" stop-color="#180a10"/>
      <stop offset="100%" stop-color="#2a0815"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgWine)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#E0A0B0" font-size="22" font-weight="bold">進階釀造科學：精準控制的三大核心</text>
  <text x="400" y="60" text-anchor="middle" fill="#A08090" font-size="12">從傳統經驗法則到科學化品質工程 (From Empirical to Precision Enology)</text>

  <!-- Left: Yeast Metabolism -->
  <rect x="40" y="100" width="220" height="380" rx="10" fill="#150810" stroke="#602040" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="150" cy="140" r="24" fill="#300820" stroke="#E05080" stroke-width="2"/>
  <text x="150" y="146" text-anchor="middle" fill="#E05080" font-size="20">🧫</text>
  <text x="150" y="190" text-anchor="middle" fill="#E080A0" font-size="16" font-weight="bold">1. 酵母代謝調控</text>
  
  <g transform="translate(60, 210)">
    <rect width="180" height="80" rx="4" fill="#201018" stroke="#803050" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#C08090" font-size="11" font-weight="bold">氮源管理 (YAN)</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#803050" stroke-width="1"/>
    <text x="10" y="46" fill="#A07080" font-size="10">• 充足: 生成果香酯類</text>
    <text x="10" y="62" fill="#A07080" font-size="10">• 匱乏: 產生H2S(還原臭)</text>
  </g>
  <g transform="translate(60, 300)">
    <rect width="180" height="80" rx="4" fill="#201018" stroke="#803050" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#C08090" font-size="11" font-weight="bold">溫度曲線控制</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#803050" stroke-width="1"/>
    <text x="10" y="46" fill="#A07080" font-size="10">• 低溫(15℃): 保留揮發芳香</text>
    <text x="10" y="62" fill="#A07080" font-size="10">• 高溫(28℃): 加速單寧萃取</text>
  </g>
  <path d="M 150 390 L 150 410" stroke="#602040" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="440" text-anchor="middle" fill="#E080A0" font-size="12" font-weight="bold">目標：純淨香氣</text>
  
  <!-- Middle: Oxygen Management -->
  <rect x="290" y="100" width="220" height="380" rx="10" fill="#081018" stroke="#204060" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="400" cy="140" r="24" fill="#082030" stroke="#5090E0" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" fill="#5090E0" font-size="20">🫧</text>
  <text x="400" y="190" text-anchor="middle" fill="#80B0E0" font-size="16" font-weight="bold">2. 氧氣管理 (Ox Management)</text>

  <g transform="translate(310, 210)">
    <rect width="180" height="80" rx="4" fill="#101820" stroke="#305080" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#80A0C0" font-size="11" font-weight="bold">發酵期 (Macro-ox)</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#305080" stroke-width="1"/>
    <text x="10" y="46" fill="#7090B0" font-size="10">• 需氧: 酵母細胞壁合成</text>
    <text x="10" y="62" fill="#7090B0" font-size="10">• 手段: 開放循環打水(Pump-over)</text>
  </g>
  <g transform="translate(310, 300)">
    <rect width="180" height="80" rx="4" fill="#101820" stroke="#305080" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#80A0C0" font-size="11" font-weight="bold">熟成期 (Micro-ox)</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#305080" stroke-width="1"/>
    <text x="10" y="46" fill="#7090B0" font-size="10">• 微氧: 聚合單寧與花青素</text>
    <text x="10" y="62" fill="#7090B0" font-size="10">• 控氧: 惰性氣體保護/微氧機</text>
  </g>
  <path d="M 400 390 L 400 410" stroke="#204060" stroke-width="2"/>
  <text x="400" y="440" text-anchor="middle" fill="#80B0E0" font-size="12" font-weight="bold">目標：顏色穩定與抗氧化</text>

  <!-- Right: Stabilization -->
  <rect x="540" y="100" width="220" height="380" rx="10" fill="#101810" stroke="#306040" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="650" cy="140" r="24" fill="#082A15" stroke="#50E080" stroke-width="2"/>
  <text x="650" y="146" text-anchor="middle" fill="#50E080" font-size="20">🧪</text>
  <text x="650" y="190" text-anchor="middle" fill="#80E0A0" font-size="16" font-weight="bold">3. 穩定化技術</text>

  <g transform="translate(560, 210)">
    <rect width="180" height="80" rx="4" fill="#152015" stroke="#306040" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#80C0A0" font-size="11" font-weight="bold">冷穩定 (Tartaric Auth)</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#306040" stroke-width="1"/>
    <text x="10" y="46" fill="#70A080" font-size="10">• 防: 酒石酸結晶(鑽石)</text>
    <text x="10" y="62" fill="#70A080" font-size="10">• 法: 降溫處理 / 電滲析微濾</text>
  </g>
  <g transform="translate(560, 300)">
    <rect width="180" height="80" rx="4" fill="#152015" stroke="#306040" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#80C0A0" font-size="11" font-weight="bold">蛋白質與微生穩定</text>
    <line x1="20" y1="30" x2="160" y2="30" stroke="#306040" stroke-width="1"/>
    <text x="10" y="46" fill="#70A080" font-size="10">• 防: 蛋白質混濁 / 酒香酵母(Brett)</text>
    <text x="10" y="62" fill="#70A080" font-size="10">• 法: 皂土澄清 / 精準SO2添加</text>
  </g>
  <path d="M 650 390 L 650 410" stroke="#306040" stroke-width="2"/>
  <text x="650" y="440" text-anchor="middle" fill="#80E0A0" font-size="12" font-weight="bold">目標：長久如新</text>

  <!-- Connectors -->
  <path d="M 150 460 C 150 490, 400 480, 400 500" fill="none" stroke="#A08090" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 650 460 C 650 490, 400 480, 400 500" fill="none" stroke="#A08090" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 400 460 L 400 500" fill="none" stroke="#A08090" stroke-width="2"/>
  
  <rect x="250" y="490" width="300" height="30" rx="15" fill="#E0A0B0" filter="url(#shadow)"/>
  <text x="400" y="510" text-anchor="middle" fill="#1A0510" font-size="14" font-weight="bold">品質可預測 ｜ 風格可複製 ｜ 缺陷可追溯</text>

</svg>