<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgFood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0808"/>
      <stop offset="100%" stop-color="#120a0a"/>
    </linearGradient>
    <filter id="shF"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="580" fill="url(#bgFood)"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#C0952C" stroke-width="0.8" opacity="0.5"/>
  <text x="400" y="36" text-anchor="middle" fill="#C0952C" font-size="20" font-weight="bold">波爾多葡萄酒餐酒搭配指南</text>
  <text x="400" y="56" text-anchor="middle" fill="#9A7040" font-size="12">Food &amp; Wine Pairing · 讓每一口食物都為葡萄酒加分</text>

  <!-- 3 wine style categories across the top -->
  <!-- Left Bank Red / Right Bank Red / Dry White/Sweet -->

  <!-- Card 1: Left Bank Red -->
  <rect x="30" y="76" width="228" height="260" rx="8" fill="#0e1018" stroke="#3050A0" stroke-width="1.5" filter="url(#shF)"/>
  <rect x="30" y="76" width="228" height="46" rx="8" fill="#1a2850"/>
  <rect x="30" y="108" width="228" height="14" fill="#1a2850"/>
  <text x="144" y="100" text-anchor="middle" fill="#A0C0F0" font-size="13" font-weight="bold">🏛️ 左岸紅酒</text>
  <text x="144" y="113" text-anchor="middle" fill="#506080" font-size="10">Cab.S. 主導 · 強勁結構</text>

  <text x="48" y="140" fill="#80A0D0" font-size="11" font-weight="bold">🥩 最佳肉類搭配</text>
  <text x="48" y="156" fill="#C0D0E8" font-size="11">• 肋眼牛排 / 烤牛腰脊</text>
  <text x="48" y="171" fill="#C0D0E8" font-size="11">• 香草烤羊排（經典）</text>
  <text x="48" y="186" fill="#C0D0E8" font-size="11">• 鹿肉 / 野豬等野味</text>
  <text x="48" y="201" fill="#C0D0E8" font-size="11">• 紅酒燉牛肉（鏡面搭配）</text>

  <text x="48" y="220" fill="#80A0D0" font-size="11" font-weight="bold">🧀 乳酪搭配</text>
  <text x="48" y="235" fill="#C0D0E8" font-size="11">陳年 Comté / Cheddar</text>
  <text x="48" y="250" fill="#C0D0E8" font-size="11">Parmigiano-Reggiano</text>

  <text x="48" y="269" fill="#80A0D0" font-size="11" font-weight="bold">❌ 避免搭配</text>
  <text x="48" y="284" fill="#907090" font-size="11">• 生魚片 / 海鮮</text>
  <text x="48" y="299" fill="#907090" font-size="11">• 甜點（單寧加澀）</text>
  <text x="48" y="314" fill="#907090" font-size="11">• 辛辣料理（放大苦感）</text>

  <!-- Card 2: Right Bank Red -->
  <rect x="286" y="76" width="228" height="260" rx="8" fill="#0e1208" stroke="#407040" stroke-width="1.5" filter="url(#shF)"/>
  <rect x="286" y="76" width="228" height="46" rx="8" fill="#1a3018"/>
  <rect x="286" y="108" width="228" height="14" fill="#1a3018"/>
  <text x="400" y="100" text-anchor="middle" fill="#90D090" font-size="13" font-weight="bold">🌱 右岸紅酒</text>
  <text x="400" y="113" text-anchor="middle" fill="#507050" font-size="10">Merlot 主導 · 柔順圓潤</text>

  <text x="304" y="140" fill="#70B070" font-size="11" font-weight="bold">🥩 最佳肉類搭配</text>
  <text x="304" y="156" fill="#A0D0A0" font-size="11">• 烤鴨胸 / 油封鴨</text>
  <text x="304" y="171" fill="#A0D0A0" font-size="11">• 煎小牛肉 / 豬里脊</text>
  <text x="304" y="186" fill="#A0D0A0" font-size="11">• 牛肉漢堡 / 肉丸</text>
  <text x="304" y="201" fill="#A0D0A0" font-size="11">• 蘑菇燉雞腿（親和力高）</text>

  <text x="304" y="220" fill="#70B070" font-size="11" font-weight="bold">🍄 蔬食搭配</text>
  <text x="304" y="235" fill="#A0D0A0" font-size="11">松露 / 牛肝菌燉飯</text>
  <text x="304" y="250" fill="#A0D0A0" font-size="11">烤根莖類蔬菜</text>

  <text x="304" y="269" fill="#70B070" font-size="11" font-weight="bold">🌏 亞洲料理</text>
  <text x="304" y="284" fill="#A0D0A0" font-size="11">• 北京烤鴨（出色搭配）</text>
  <text x="304" y="299" fill="#A0D0A0" font-size="11">• 紅燒肉 / 東坡肉</text>
  <text x="304" y="314" fill="#A0D0A0" font-size="11">• 日式壽喜燒</text>

  <!-- Card 3: White and Sweet -->
  <rect x="542" y="76" width="228" height="260" rx="8" fill="#101008" stroke="#706020" stroke-width="1.5" filter="url(#shF)"/>
  <rect x="542" y="76" width="228" height="46" rx="8" fill="#302810"/>
  <rect x="542" y="108" width="228" height="14" fill="#302810"/>
  <text x="656" y="100" text-anchor="middle" fill="#F0E080" font-size="13" font-weight="bold">🍾 白酒 &amp; 甜酒</text>
  <text x="656" y="113" text-anchor="middle" fill="#807040" font-size="10">Sauternes · Dry Graves · Pessac</text>

  <text x="560" y="140" fill="#D0C060" font-size="11" font-weight="bold">🐟 白酒 (Sauvignon Blanc)</text>
  <text x="560" y="156" fill="#E8D880" font-size="11">• 生蠔 / 海鮮塔</text>
  <text x="560" y="171" fill="#E8D880" font-size="11">• 清蒸海鱸 / 鱈魚</text>
  <text x="560" y="186" fill="#E8D880" font-size="11">• 山羊乳酪沙拉</text>
  <text x="560" y="201" fill="#E8D880" font-size="11">• 白蘆筍 / 野菜前菜</text>

  <text x="560" y="220" fill="#D0C060" font-size="11" font-weight="bold">🍯 Sauternes 貴腐甜酒</text>
  <text x="560" y="235" fill="#E8D880" font-size="11">• 鵝肝醬（天作之合！）</text>
  <text x="560" y="250" fill="#E8D880" font-size="11">• 藍紋乳酪（Roquefort）</text>
  <text x="560" y="265" fill="#E8D880" font-size="11">• 法式焦糖布蕾</text>
  <text x="560" y="280" fill="#E8D880" font-size="11">• 椰子蛋糕 / 杏桃塔</text>

  <text x="560" y="299" fill="#D0C060" font-size="11" font-weight="bold">💡 特殊搭配法</text>
  <text x="560" y="314" fill="#C0A840" font-size="11">甜配鹹：甜酒 + 鵝肝 = 傳奇</text>

  <!-- Bottom: Pairing principles -->
  <rect x="30" y="348" width="740" height="220" rx="8" fill="#0a0808" stroke="#C0952C" stroke-width="0.8" stroke-opacity="0.4" filter="url(#shF)"/>
  <text x="400" y="370" text-anchor="middle" fill="#C0952C" font-size="14" font-weight="bold">🎯 四大餐酒搭配原則</text>
  <line x1="55" y1="376" x2="745" y2="376" stroke="#C0952C" stroke-width="0.5" opacity="0.3"/>

  <!-- Principle 1 -->
  <rect x="50" y="384" width="160" height="72" rx="6" fill="#1a1008" stroke="#8B5A1C" stroke-width="1"/>
  <text x="130" y="400" text-anchor="middle" fill="#E0A040" font-size="12" font-weight="bold">⚖️ 重量配重量</text>
  <text x="130" y="416" text-anchor="middle" fill="#C08030" font-size="10">濃郁紅酒配厚重肉食</text>
  <text x="130" y="430" text-anchor="middle" fill="#C08030" font-size="10">清爽白酒配輕盈海鮮</text>
  <text x="130" y="444" text-anchor="middle" fill="#A07030" font-size="10">避免輕重失衡</text>

  <!-- Principle 2 -->
  <rect x="225" y="384" width="160" height="72" rx="6" fill="#081818" stroke="#204060" stroke-width="1"/>
  <text x="305" y="400" text-anchor="middle" fill="#60B0D0" font-size="12" font-weight="bold">🔴 單寧 × 蛋白質</text>
  <text x="305" y="416" text-anchor="middle" fill="#70A0C0" font-size="10">肉類蛋白質中和單寧</text>
  <text x="305" y="430" text-anchor="middle" fill="#70A0C0" font-size="10">使口感更柔順</text>
  <text x="305" y="444" text-anchor="middle" fill="#507090" font-size="10">牛排 + 左岸红酒 = 完美</text>

  <!-- Principle 3 -->
  <rect x="400" y="384" width="160" height="72" rx="6" fill="#101810" stroke="#405030" stroke-width="1"/>
  <text x="480" y="400" text-anchor="middle" fill="#90C060" font-size="12" font-weight="bold">🌿 酸度 × 油脂</text>
  <text x="480" y="416" text-anchor="middle" fill="#80B050" font-size="10">高酸葡萄酒切割油脂</text>
  <text x="480" y="430" text-anchor="middle" fill="#80B050" font-size="10">清新感增添食慾</text>
  <text x="480" y="444" text-anchor="middle" fill="#608040" font-size="10">Sauv. Blanc + 魚排 = 清爽</text>

  <!-- Principle 4 -->
  <rect x="575" y="384" width="160" height="72" rx="6" fill="#181010" stroke="#603020" stroke-width="1"/>
  <text x="655" y="400" text-anchor="middle" fill="#F0A060" font-size="12" font-weight="bold">🍯 甜酒配對等甜</text>
  <text x="655" y="416" text-anchor="middle" fill="#D09050" font-size="10">甜酒需配同等甜度食物</text>
  <text x="655" y="430" text-anchor="middle" fill="#D09050" font-size="10">否則甜酒顯苦澀</text>
  <text x="655" y="444" text-anchor="middle" fill="#A07040" font-size="10">例外：甜酒 + 鹹食 = 驚喜</text>

  <!-- Asian pairing special section -->
  <rect x="50" y="465" width="690" height="90" rx="6" fill="#0e0c08" stroke="#C0952C" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="395" y="485" text-anchor="middle" fill="#C0952C" font-size="12" font-weight="bold">🌏 亞洲料理配波爾多的特別建議</text>
  <line x1="70" y1="491" x2="720" y2="491" stroke="#C0952C" stroke-width="0.4" opacity="0.3"/>

  <text x="120" y="509" text-anchor="middle" fill="#C0A060" font-size="11" font-weight="bold">廣東料理</text>
  <text x="120" y="522" text-anchor="middle" fill="#B09050" font-size="10">清蒸魚 → 白酒</text>
  <text x="120" y="534" text-anchor="middle" fill="#B09050" font-size="10">燒鵝 → 右岸紅</text>
  <text x="120" y="546" text-anchor="middle" fill="#B09050" font-size="10">叉燒 → 右岸紅</text>

  <line x1="190" y1="498" x2="190" y2="550" stroke="#C0952C" stroke-width="0.3" opacity="0.3"/>

  <text x="265" y="509" text-anchor="middle" fill="#A0C060" font-size="11" font-weight="bold">日本料理</text>
  <text x="265" y="522" text-anchor="middle" fill="#90B050" font-size="10">壽喜燒 → 右岸紅</text>
  <text x="265" y="534" text-anchor="middle" fill="#90B050" font-size="10">牛排鐵板 → 左岸紅</text>
  <text x="265" y="546" text-anchor="middle" fill="#90B050" font-size="10">壽司 → 白酒</text>

  <line x1="340" y1="498" x2="340" y2="550" stroke="#C0952C" stroke-width="0.3" opacity="0.3"/>

  <text x="420" y="509" text-anchor="middle" fill="#D09080" font-size="11" font-weight="bold">台灣料理</text>
  <text x="420" y="522" text-anchor="middle" fill="#C08070" font-size="10">三杯雞 → 右岸紅（注意辣）</text>
  <text x="420" y="534" text-anchor="middle" fill="#C08070" font-size="10">蚵仔煎 → 偏甜白酒</text>
  <text x="420" y="546" text-anchor="middle" fill="#C08070" font-size="10">東坡肉 → 成熟右岸紅</text>

  <line x1="510" y1="498" x2="510" y2="550" stroke="#C0952C" stroke-width="0.3" opacity="0.3"/>

  <text x="615" y="509" text-anchor="middle" fill="#80C0C0" font-size="11" font-weight="bold">⚠️ 挑戰配對</text>
  <text x="615" y="522" text-anchor="middle" fill="#70A0A0" font-size="10">麻辣料理 → 果味豐富右岸</text>
  <text x="615" y="534" text-anchor="middle" fill="#70A0A0" font-size="10">醋漬食物 → 避免左岸</text>
  <text x="615" y="546" text-anchor="middle" fill="#70A0A0" font-size="10">重鹽食物 → 選高酸度酒</text>

  <line x1="40" y1="565" x2="760" y2="565" stroke="#C0952C" stroke-width="0.5" opacity="0.2"/>
  <text x="400" y="576" text-anchor="middle" fill="#706050" font-size="10">💡 記憶口訣：「重配重、輕配輕、酸切油、甜配甜、單寧愛蛋白質」</text>
</svg>
