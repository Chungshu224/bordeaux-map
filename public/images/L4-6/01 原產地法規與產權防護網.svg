<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="bgLaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="50%" stop-color="#122440"/>
      <stop offset="100%" stop-color="#183050"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="800" height="540" fill="url(#bgLaw)"/>
  
  <text x="400" y="45" text-anchor="middle" fill="#A0C0E0" font-size="24" font-weight="bold">法規與原產地：AOC/PDO 產權防護網</text>
  <text x="400" y="65" text-anchor="middle" fill="#80A0C0" font-size="13">Appellation Legal Framework &amp; Protection System</text>

  <!-- Central Temple/Bank Concept (Legal Institution) -->
  <g transform="translate(150, 110)">
    <!-- Pediment -->
    <polygon points="250,0 0,60 500,60" fill="#203045" stroke="#406080" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="40" text-anchor="middle" fill="#A0C0E0" font-size="18" font-weight="bold">AOC / PDO 原產地保護體系</text>
    
    <!-- Columns -->
    <rect x="40" y="60" width="60" height="240" fill="#182838" stroke="#305070" stroke-width="1" filter="url(#shadow)"/>
    <rect x="150" y="60" width="60" height="240" fill="#182838" stroke="#305070" stroke-width="1" filter="url(#shadow)"/>
    <rect x="290" y="60" width="60" height="240" fill="#182838" stroke="#305070" stroke-width="1" filter="url(#shadow)"/>
    <rect x="400" y="60" width="60" height="240" fill="#182838" stroke="#305070" stroke-width="1" filter="url(#shadow)"/>

    <!-- Base -->
    <rect x="0" y="300" width="500" height="40" fill="#203045" stroke="#406080" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="325" text-anchor="middle" fill="#80A0C0" font-size="14" font-weight="bold">合規管理與風險緩解機制 (Compliance &amp; Mitigation)</text>

    <!-- Column Texts -->
    <g transform="translate(70, 80)">
      <circle cx="0" cy="0" r="15" fill="#102030" stroke="#5080A0"/>
      <text x="0" y="5" text-anchor="middle" fill="#50A0D0" font-size="14">📜</text>
      <text x="0" y="40" text-anchor="middle" fill="#A0C0E0" font-size="11" font-weight="bold">產權證書</text>
      <line x1="-20" y1="50" x2="20" y2="50" stroke="#305070"/>
      <text x="0" y="65" text-anchor="middle" fill="#7090B0" font-size="10">界定風土</text>
      <text x="0" y="80" text-anchor="middle" fill="#7090B0" font-size="10">歷史傳承</text>
      <text x="0" y="95" text-anchor="middle" fill="#7090B0" font-size="10">專屬命名權</text>
    </g>

    <g transform="translate(180, 80)">
      <circle cx="0" cy="0" r="15" fill="#102030" stroke="#5080A0"/>
      <text x="0" y="5" text-anchor="middle" fill="#50A0D0" font-size="14">📐</text>
      <text x="0" y="40" text-anchor="middle" fill="#A0C0E0" font-size="11" font-weight="bold">生產規範</text>
      <line x1="-20" y1="50" x2="20" y2="50" stroke="#305070"/>
      <text x="0" y="65" text-anchor="middle" fill="#7090B0" font-size="10">Cahier des</text>
      <text x="0" y="80" text-anchor="middle" fill="#7090B0" font-size="10">Charges</text>
      <text x="0" y="95" text-anchor="middle" fill="#7090B0" font-size="10">品種工藝限制</text>
    </g>

    <g transform="translate(320, 80)">
      <circle cx="0" cy="0" r="15" fill="#102030" stroke="#5080A0"/>
      <text x="0" y="5" text-anchor="middle" fill="#50A0D0" font-size="14">🛡️</text>
      <text x="0" y="40" text-anchor="middle" fill="#A0C0E0" font-size="11" font-weight="bold">侵權監測</text>
      <line x1="-20" y1="50" x2="20" y2="50" stroke="#305070"/>
      <text x="0" y="65" text-anchor="middle" fill="#7090B0" font-size="10">仿冒防護</text>
      <text x="0" y="80" text-anchor="middle" fill="#7090B0" font-size="10">國際海關註冊</text>
      <text x="0" y="95" text-anchor="middle" fill="#7090B0" font-size="10">救濟路徑</text>
    </g>

    <g transform="translate(430, 80)">
      <circle cx="0" cy="0" r="15" fill="#102030" stroke="#5080A0"/>
      <text x="0" y="5" text-anchor="middle" fill="#50A0D0" font-size="14">⚖️</text>
      <text x="0" y="40" text-anchor="middle" fill="#A0C0E0" font-size="11" font-weight="bold">國際框架</text>
      <line x1="-20" y1="50" x2="20" y2="50" stroke="#305070"/>
      <text x="0" y="65" text-anchor="middle" fill="#7090B0" font-size="10">EU 認證</text>
      <text x="0" y="80" text-anchor="middle" fill="#7090B0" font-size="10">里斯本協定</text>
      <text x="0" y="95" text-anchor="middle" fill="#7090B0" font-size="10">TRIPS 協議</text>
    </g>
  </g>

  <!-- Floating Legal Elements / Connectors -->
  <path d="M 50 250 C 100 250, 100 150, 150 150" fill="none" stroke="#406080" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="20" y="235" width="100" height="30" rx="15" fill="#102030" stroke="#5080A0" stroke-width="1"/>
  <text x="70" y="254" text-anchor="middle" fill="#80C0E0" font-size="10">INao 國內審查</text>

  <path d="M 750 250 C 700 250, 700 150, 650 150" fill="none" stroke="#406080" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="680" y="235" width="100" height="30" rx="15" fill="#102030" stroke="#5080A0" stroke-width="1"/>
  <text x="730" y="254" text-anchor="middle" fill="#80C0E0" font-size="10">WIPO 國際註冊</text>

  <!-- Bottom Analogy Box -->
  <rect x="80" y="470" width="640" height="50" rx="8" fill="#142434" stroke="#406080" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="492" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="bold">⚖️ 核心概念：原產地保護就像頂級房地產的「產權證書」</text>
  <text x="400" y="510" text-anchor="middle" fill="#90B0D0" font-size="11">無產權證書，任何人皆可聲稱擁有；有生產規範，才能確保這片風土的文化遺產價值不會被稀釋。</text>

</svg>