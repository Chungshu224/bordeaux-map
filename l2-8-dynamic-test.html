<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2-8 動態測試 - 波爾多葡萄酒學院</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .app-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            min-height: 600px;
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .back-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()">← 返回主頁</button>
        
        <div class="header">
            <h1>🍷 L2-8: Libournais衛星產區 - 動態測試</h1>
            <p>完整的課程體驗測試</p>
        </div>
        
        <div class="app-container">
            <div id="app"></div>
        </div>
    </div>

    <script type="module">
        import { createApp } from 'vue'
        import PresentationLesson from './src/components/PresentationLesson.vue'
        
        const app = createApp({
            components: {
                PresentationLesson
            },
            template: `<PresentationLesson lessonId="l2-8" />`
        })
        
        app.mount('#app')
        
        window.goBack = function() {
            window.location.href = './index.html'
        }
        
        console.log('L2-8 動態測試啟動')
    </script>
</body>
</html>
