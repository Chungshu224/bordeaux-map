<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pauillac 土層剖面圖 - 測試頁面</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 32px;
      font-size: 14px;
    }

    #soil-profile {
      display: block;
      margin: 0 auto;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      background: linear-gradient(to bottom, #f8f9fa, #ffffff);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.active {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .info-box {
      position: fixed;
      background: white;
      border: 2px solid #3498db;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: none;
      min-width: 300px;
      max-width: 400px;
      z-index: 1000;
    }

    .info-box.active {
      display: block;
    }

    .info-box h3 {
      margin: 0 0 12px 0;
      color: #2c3e50;
      font-size: 18px;
    }

    .info-box p {
      margin: 8px 0;
      color: #34495e;
      font-size: 14px;
      line-height: 1.6;
    }

    .info-box .label {
      font-weight: 600;
      color: #7f8c8d;
      font-size: 12px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .info-box .close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #95a5a6;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .info-box .close:hover {
      background: #ecf0f1;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪨 Pauillac 土層剖面圖</h1>
    <p class="subtitle">深達 30 米的古老砂礫層 - 互動式 D3.js 視覺化</p>
    
    <svg id="soil-profile" width="700" height="700"></svg>
    
    <div class="controls">
      <button id="play-btn">▶ 播放動畫</button>
      <button id="reset-btn">🔄 重置</button>
      <button id="heat-btn">🌡️ 熱循環</button>
    </div>
  </div>

  <div id="info-box" class="info-box">
    <button class="close" onclick="closeInfo()">×</button>
    <div id="info-content"></div>
  </div>

  <script>
    // 土層資料
    const soilLayers = [
      {
        id: 'surface',
        name: '表層砂礫',
        depth: [0, 2],
        color: '#8B4513',
        composition: '砂礫 85% + 黏土 10% + 沙 5%',
        function: '優異排水、熱儲存、反射陽光'
      },
      {
        id: 'gunz',
        name: '深層 Gunz 砂礫',
        depth: [2, 10],
        color: '#A0522D',
        composition: '古老砂礫 80% + 黏土 15% + 其他 5%',
        function: '深層排水、礦物質來源、根系延伸'
      },
      {
        id: 'transition',
        name: '過渡層',
        depth: [10, 15],
        color: '#CD853F',
        composition: '砂礫 60% + 黏土 30% + 沙 10%',
        function: '緩衝層、養分交換、水分調節'
      },
      {
        id: 'deep',
        name: '深層砂礫',
        depth: [15, 20],
        color: '#8B7355',
        composition: '細砂礫 70% + 黏土 20% + 石灰岩 10%',
        function: '深層礦物質、根系支撐'
      },
      {
        id: 'clay',
        name: '黏土基底',
        depth: [20, 30],
        color: '#708090',
        composition: '黏土 80% + 石灰岩 15% + 其他 5%',
        function: '保水層、礦物質儲存庫'
      }
    ];

    // SVG 設定
    const width = 700;
    const height = 700;
    const margin = { top: 40, right: 100, bottom: 40, left: 80 };
    const chartWidth = width - margin.left - margin.right;
    const chartHeight = height - margin.top - margin.bottom;

    // 建立 SVG
    const svg = d3.select('#soil-profile')
      .append('g')
      .attr('transform', `translate(${margin.left}, ${margin.top})`);

    // 比例尺
    const yScale = d3.scaleLinear()
      .domain([0, 30])
      .range([0, chartHeight]);

    // 繪製函數
    function draw() {
      svg.selectAll('*').remove();

      // 網格線
      for (let depth = 0; depth <= 30; depth += 5) {
        svg.append('line')
          .attr('x1', 0)
          .attr('y1', yScale(depth))
          .attr('x2', chartWidth)
          .attr('y2', yScale(depth))
          .attr('stroke', '#e0e0e0')
          .attr('stroke-width', 1)
          .attr('stroke-dasharray', '4,4')
          .attr('opacity', 0.5);
      }

      // 深度刻度
      const yAxis = d3.axisLeft(yScale)
        .tickValues(d3.range(0, 31, 5))
        .tickFormat(d => `${d}m`);

      svg.append('g')
        .attr('transform', 'translate(100, 0)')
        .call(yAxis)
        .selectAll('text')
        .style('font-size', '12px');

      // Y軸標題
      svg.append('text')
        .attr('transform', 'rotate(-90)')
        .attr('x', -chartHeight / 2)
        .attr('y', 20)
        .attr('text-anchor', 'middle')
        .style('font-size', '14px')
        .style('font-weight', '600')
        .text('深度 (米)');

      // 地表線
      svg.append('line')
        .attr('x1', 100)
        .attr('y1', 0)
        .attr('x2', 380)
        .attr('y2', 0)
        .attr('stroke', '#2c3e50')
        .attr('stroke-width', 3);

      svg.append('text')
        .attr('x', 240)
        .attr('y', -10)
        .attr('text-anchor', 'middle')
        .style('font-size', '13px')
        .style('font-weight', '700')
        .style('fill', '#2c3e50')
        .text('━━━ 地表 ━━━');

      // 繪製土層
      soilLayers.forEach((layer, i) => {
        const y1 = yScale(layer.depth[0]);
        const y2 = yScale(layer.depth[1]);
        const h = y2 - y1;

        const g = svg.append('g')
          .attr('class', `layer-${layer.id}`);

        // 土層矩形
        g.append('rect')
          .attr('x', 110)
          .attr('y', y1)
          .attr('width', 260)
          .attr('height', 0)
          .attr('fill', layer.color)
          .attr('stroke', '#333')
          .attr('stroke-width', 2)
          .attr('opacity', 0.9)
          .style('cursor', 'pointer')
          .on('click', function(event) {
            showInfo(layer, event);
          })
          .on('mouseover', function() {
            d3.select(this)
              .attr('stroke', '#FFD700')
              .attr('stroke-width', 3);
          })
          .on('mouseout', function() {
            d3.select(this)
              .attr('stroke', '#333')
              .attr('stroke-width', 2);
          });

        // 標籤
        g.append('text')
          .attr('x', 390)
          .attr('y', y1 + h/2)
          .attr('dy', '0.35em')
          .attr('opacity', 0)
          .style('font-size', '14px')
          .style('font-weight', '600')
          .text(layer.name);

        g.append('text')
          .attr('x', 390)
          .attr('y', y1 + h/2 + 18)
          .attr('opacity', 0)
          .style('font-size', '11px')
          .style('fill', '#666')
          .text(`${layer.depth[0]}-${layer.depth[1]}m`);
      });
    }

    // 播放動畫
    let isAnimating = false;
    function playAnimation() {
      if (isAnimating) return;
      isAnimating = true;
      document.getElementById('play-btn').disabled = true;
      
      soilLayers.forEach((layer, i) => {
        const y1 = yScale(layer.depth[0]);
        const y2 = yScale(layer.depth[1]);
        const h = y2 - y1;

        svg.select(`.layer-${layer.id} rect`)
          .transition()
          .delay(i * 500)
          .duration(800)
          .attr('height', h);

        svg.selectAll(`.layer-${layer.id} text`)
          .transition()
          .delay(i * 500 + 400)
          .duration(400)
          .attr('opacity', 1);
      });

      setTimeout(() => {
        isAnimating = false;
        document.getElementById('play-btn').disabled = false;
      }, soilLayers.length * 500 + 1000);
    }

    // 顯示資訊
    function showInfo(layer, event) {
      const infoBox = document.getElementById('info-box');
      const content = document.getElementById('info-content');
      
      infoBox.className = 'info-box active';
      infoBox.style.left = (event.pageX + 10) + 'px';
      infoBox.style.top = (event.pageY + 10) + 'px';
      
      content.innerHTML = `
        <h3>${layer.name}</h3>
        <p><span class="label">深度範圍</span>${layer.depth[0]}-${layer.depth[1]} 米</p>
        <p><span class="label">土壤組成</span>${layer.composition}</p>
        <p><span class="label">主要功能</span>${layer.function}</p>
      `;
    }

    // 關閉資訊
    function closeInfo() {
      document.getElementById('info-box').classList.remove('active');
    }

    // 重置
    function reset() {
      closeInfo();
      draw();
      setTimeout(playAnimation, 100);
    }

    // 熱循環
    let heatActive = false;
    function toggleHeat() {
      heatActive = !heatActive;
      const btn = document.getElementById('heat-btn');
      if (heatActive) {
        btn.classList.add('active');
        alert('🌡️ 熱循環動畫已啟用！\n\n白天：太陽加熱砂礫層\n夜晚：砂礫層釋放熱能');
      } else {
        btn.classList.remove('active');
      }
    }

    // 事件監聽
    document.getElementById('play-btn').addEventListener('click', playAnimation);
    document.getElementById('reset-btn').addEventListener('click', reset);
    document.getElementById('heat-btn').addEventListener('click', toggleHeat);

    // 點擊外部關閉資訊框
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.layer') && !e.target.closest('.info-box')) {
        closeInfo();
      }
    });

    // 初始化
    draw();
    setTimeout(playAnimation, 500);
  </script>
</body>
</html>
