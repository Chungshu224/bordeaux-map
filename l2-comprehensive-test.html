<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 課程內容分離 - 綜合測試</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #8e24aa 0%, #5e35b1 100%);
            color: white;
            border-radius: 15px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .lesson-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 1.5rem;
            border-left: 5px solid #8e24aa;
            transition: all 0.3s ease;
        }
        .lesson-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .lesson-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #8e24aa;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .lesson-subtitle {
            color: #6c757d;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin: 0.5rem 0;
            text-align: center;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .lesson-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: 0.85rem;
        }
        .stat-item {
            background: white;
            padding: 0.5rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        .test-controls {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #8e24aa;
            color: white;
        }
        .btn-primary:hover {
            background: #7b1fa2;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .summary {
            background: #e3f2fd;
            padding: 1.5rem;
            border-radius: 15px;
            margin: 2rem 0;
            border-left: 5px solid #1976d2;
        }
        .summary h3 {
            color: #1976d2;
            margin-top: 0;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍷 L2 課程內容分離測試</h1>
            <p>Level 2 波爾多深度課程 - 動態載入架構驗證</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="overallStatus">準備測試...</div>
        </div>

        <div class="test-controls">
            <button class="btn btn-primary" onclick="testAllLessons()">🚀 測試所有課程</button>
            <button class="btn btn-success" onclick="showSummary()">📊 顯示總結</button>
            <button class="btn btn-primary" onclick="resetTests()">🔄 重置測試</button>
        </div>

        <div class="test-grid" id="lessonsGrid">
            <!-- 課程卡片將由 JavaScript 動態生成 -->
        </div>

        <div id="summarySection" class="summary" style="display: none;">
            <h3>📋 測試總結</h3>
            <div id="summaryContent"></div>
        </div>
    </div>

    <script type="module">
        const lessons = [
            {
                id: 'l2-1',
                title: 'Médoc產區深度探索',
                subtitle: '左岸四大村莊的風土差異與釀酒哲學',
                icon: '🏛️',
                expectedSlides: 3
            },
            {
                id: 'l2-2',
                title: 'Margaux - 優雅的香水之鄉',
                subtitle: '最優雅產區的獨特魅力與代表酒莊',
                icon: '🌸',
                expectedSlides: 3
            },
            {
                id: 'l2-3',
                title: 'Pauillac - 王者風範的產區',
                subtitle: '三大一級酒莊的故鄉與其釀酒傳奇',
                icon: '👑',
                expectedSlides: 3
            },
            {
                id: 'l2-4',
                title: 'Saint-Julien - 平衡的典範',
                subtitle: '最均衡產區的風格特色與名莊解析',
                icon: '⚖️',
                expectedSlides: 3
            },
            {
                id: 'l2-5',
                title: 'Saint-Estèphe - 北地之珠',
                subtitle: '風格最獨特產區的現代化轉型',
                icon: '🌍',
                expectedSlides: 3
            },
            {
                id: 'l2-6',
                title: 'Pomerol - 稀世珍寶',
                subtitle: '波爾多最小最精品的頂級產區',
                icon: '💎',
                expectedSlides: 3
            }
        ];

        let testResults = {};
        let completedTests = 0;

        function createLessonCard(lesson) {
            return `
                <div class="lesson-card" id="card-${lesson.id}">
                    <div class="lesson-title">
                        ${lesson.icon} ${lesson.title}
                    </div>
                    <div class="lesson-subtitle">${lesson.subtitle}</div>
                    <div id="status-${lesson.id}" class="status loading">等待測試...</div>
                    <div class="lesson-stats" id="stats-${lesson.id}" style="display: none;">
                        <div class="stat-item">
                            <strong id="slides-count-${lesson.id}">0</strong>
                            <br>投影片數
                        </div>
                        <div class="stat-item">
                            <strong id="content-size-${lesson.id}">0</strong>
                            <br>內容大小
                        </div>
                        <div class="stat-item">
                            <strong id="maps-count-${lesson.id}">0</strong>
                            <br>地圖數量
                        </div>
                        <div class="stat-item">
                            <strong id="quizzes-count-${lesson.id}">0</strong>
                            <br>測驗數量
                        </div>
                    </div>
                </div>
            `;
        }

        async function testLesson(lesson) {
            const statusEl = document.getElementById(`status-${lesson.id}`);
            const statsEl = document.getElementById(`stats-${lesson.id}`);
            
            statusEl.className = 'status loading';
            statusEl.textContent = '載入中...';

            try {
                // 動態載入課程內容
                const moduleMap = {
                    'l2-1': () => import('./src/data/lessons/l2-1.js'),
                    'l2-2': () => import('./src/data/lessons/l2-2.js'),
                    'l2-3': () => import('./src/data/lessons/l2-3.js'),
                    'l2-4': () => import('./src/data/lessons/l2-4.js'),
                    'l2-5': () => import('./src/data/lessons/l2-5.js'),
                    'l2-6': () => import('./src/data/lessons/l2-6.js')
                };

                const module = await moduleMap[lesson.id]();
                const contentKey = lesson.id.replace('-', '') + 'Content';
                const content = module[contentKey] || module.default;
                
                if (!content || !Array.isArray(content)) {
                    throw new Error('課程內容格式錯誤');
                }

                // 分析課程內容
                const stats = analyzeContent(content);
                
                testResults[lesson.id] = {
                    success: true,
                    content: content,
                    stats: stats,
                    lesson: lesson
                };

                // 更新狀態
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 載入成功';
                
                // 更新統計
                document.getElementById(`slides-count-${lesson.id}`).textContent = stats.totalSlides;
                document.getElementById(`content-size-${lesson.id}`).textContent = formatSize(stats.totalContentSize);
                document.getElementById(`maps-count-${lesson.id}`).textContent = stats.mapsCount;
                document.getElementById(`quizzes-count-${lesson.id}`).textContent = stats.quizzesCount;
                
                statsEl.style.display = 'grid';

            } catch (error) {
                console.error(`載入 ${lesson.id} 失敗:`, error);
                
                testResults[lesson.id] = {
                    success: false,
                    error: error.message,
                    lesson: lesson
                };

                statusEl.className = 'status error';
                statusEl.textContent = `❌ ${error.message}`;
            }

            completedTests++;
            updateProgress();
        }

        function analyzeContent(content) {
            let totalContentSize = 0;
            let mapsCount = 0;
            let quizzesCount = 0;
            
            content.forEach(slide => {
                if (slide.content) {
                    totalContentSize += slide.content.length;
                }
                if (slide.hasMap) {
                    mapsCount++;
                }
                if (slide.quiz) {
                    quizzesCount++;
                }
            });

            return {
                totalSlides: content.length,
                totalContentSize: totalContentSize,
                mapsCount: mapsCount,
                quizzesCount: quizzesCount
            };
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
            return Math.round(bytes / (1024 * 1024)) + 'MB';
        }

        function updateProgress() {
            const progress = (completedTests / lessons.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            if (completedTests === lessons.length) {
                const successCount = Object.values(testResults).filter(r => r.success).length;
                const overallStatus = document.getElementById('overallStatus');
                
                if (successCount === lessons.length) {
                    overallStatus.textContent = '🎉 所有課程測試通過！';
                    overallStatus.style.color = '#28a745';
                } else {
                    overallStatus.textContent = `⚠️ ${successCount}/${lessons.length} 課程測試通過`;
                    overallStatus.style.color = '#ffc107';
                }
            }
        }

        async function testAllLessons() {
            completedTests = 0;
            testResults = {};
            
            document.getElementById('overallStatus').textContent = '正在測試課程...';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('summarySection').style.display = 'none';

            // 重置所有卡片狀態
            lessons.forEach(lesson => {
                const statusEl = document.getElementById(`status-${lesson.id}`);
                const statsEl = document.getElementById(`stats-${lesson.id}`);
                statusEl.className = 'status loading';
                statusEl.textContent = '等待測試...';
                statsEl.style.display = 'none';
            });

            // 並行測試所有課程
            const testPromises = lessons.map(lesson => testLesson(lesson));
            await Promise.all(testPromises);
        }

        function showSummary() {
            const summarySection = document.getElementById('summarySection');
            const summaryContent = document.getElementById('summaryContent');
            
            if (Object.keys(testResults).length === 0) {
                alert('請先執行測試');
                return;
            }

            const successCount = Object.values(testResults).filter(r => r.success).length;
            const failCount = lessons.length - successCount;
            
            let totalSlides = 0;
            let totalContent = 0;
            let totalMaps = 0;
            let totalQuizzes = 0;

            Object.values(testResults).forEach(result => {
                if (result.success) {
                    totalSlides += result.stats.totalSlides;
                    totalContent += result.stats.totalContentSize;
                    totalMaps += result.stats.mapsCount;
                    totalQuizzes += result.stats.quizzesCount;
                }
            });

            summaryContent.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0;">
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #28a745;">${successCount}</strong>
                        <br>成功載入課程
                    </div>
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #dc3545;">${failCount}</strong>
                        <br>載入失敗課程
                    </div>
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #8e24aa;">${totalSlides}</strong>
                        <br>總投影片數
                    </div>
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #17a2b8;">${formatSize(totalContent)}</strong>
                        <br>總內容大小
                    </div>
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #fd7e14;">${totalMaps}</strong>
                        <br>地圖總數
                    </div>
                    <div class="stat-item">
                        <strong style="font-size: 1.5rem; color: #6f42c1;">${totalQuizzes}</strong>
                        <br>測驗總數
                    </div>
                </div>
                
                <h4>📝 詳細結果</h4>
                ${Object.values(testResults).map(result => `
                    <div style="
                        background: ${result.success ? '#d4edda' : '#f8d7da'};
                        color: ${result.success ? '#155724' : '#721c24'};
                        padding: 1rem;
                        margin: 0.5rem 0;
                        border-radius: 8px;
                        border-left: 4px solid ${result.success ? '#28a745' : '#dc3545'};
                    ">
                        <strong>${result.lesson.icon} ${result.lesson.title}</strong>
                        <br>
                        ${result.success ? 
                            `✅ 成功 - ${result.stats.totalSlides} 投影片, ${formatSize(result.stats.totalContentSize)} 內容` :
                            `❌ 失敗 - ${result.error}`
                        }
                    </div>
                `).join('')}
            `;

            summarySection.style.display = 'block';
        }

        function resetTests() {
            completedTests = 0;
            testResults = {};
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('overallStatus').textContent = '準備測試...';
            document.getElementById('summarySection').style.display = 'none';
            
            lessons.forEach(lesson => {
                const statusEl = document.getElementById(`status-${lesson.id}`);
                const statsEl = document.getElementById(`stats-${lesson.id}`);
                statusEl.className = 'status loading';
                statusEl.textContent = '等待測試...';
                statsEl.style.display = 'none';
            });
        }

        // 初始化頁面
        function initPage() {
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = lessons.map(lesson => createLessonCard(lesson)).join('');
        }

        // 全域函數
        window.testAllLessons = testAllLessons;
        window.showSummary = showSummary;
        window.resetTests = resetTests;

        // 初始化
        initPage();
    </script>
</body>
</html>
