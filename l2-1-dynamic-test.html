<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2-1 Médoc產區深度探索 - 動態載入測試</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #8e24aa 0%, #5e35b1 100%);
            color: white;
            border-radius: 15px;
        }
        .test-status {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        
        .content-preview {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1rem 0;
            border-left: 4px solid #8e24aa;
        }
        .slide-info {
            background: white;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .slide-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #8e24aa;
            margin-bottom: 0.5rem;
        }
        .highlights {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }
        .highlight-item {
            background: #e3f2fd;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #1565c0;
        }
        .test-controls {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #8e24aa;
            color: white;
        }
        .btn-primary:hover {
            background: #7b1fa2;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍷 L2-1 Médoc產區深度探索</h1>
            <p>動態載入內容分離測試 - Level 2 課程</p>
        </div>

        <div id="status" class="test-status loading">
            ⏳ 正在載入課程內容...
        </div>

        <div class="test-controls">
            <button class="btn btn-primary" onclick="loadLesson()">🔄 重新載入課程</button>
            <button class="btn btn-secondary" onclick="showDebugInfo()">🔍 顯示除錯資訊</button>
            <button class="btn btn-secondary" onclick="testAllSlides()">📊 測試所有投影片</button>
        </div>

        <div id="content" class="content-preview" style="display: none;">
            <h3>📋 課程內容概覽</h3>
            <div id="slides-container"></div>
        </div>

        <div id="debug" class="content-preview" style="display: none;">
            <h3>🔍 除錯資訊</h3>
            <div id="debug-content"></div>
        </div>
    </div>

    <script type="module">
        let currentLessonContent = null;

        async function loadLesson() {
            const statusEl = document.getElementById('status');
            const contentEl = document.getElementById('content');
            const slidesContainer = document.getElementById('slides-container');
            
            statusEl.className = 'test-status loading';
            statusEl.innerHTML = '⏳ 正在載入 L2-1 課程內容...';
            contentEl.style.display = 'none';

            try {
                // 動態載入課程內容
                const module = await import('./src/data/lessons/l2-1.js');
                currentLessonContent = module.l21Content || module.default;
                
                if (!currentLessonContent || !Array.isArray(currentLessonContent)) {
                    throw new Error('課程內容格式錯誤');
                }

                statusEl.className = 'test-status success';
                statusEl.innerHTML = `✅ 成功載入 L2-1 課程！共 ${currentLessonContent.length} 個投影片`;
                
                // 顯示課程內容概覽
                slidesContainer.innerHTML = '';
                
                currentLessonContent.forEach((slide, index) => {
                    if (slide.type === 'title') {
                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'slide-info';
                        titleDiv.innerHTML = `
                            <div class="slide-title">📚 第 ${index + 1} 投影片：標題頁</div>
                            <p>課程開始頁面</p>
                        `;
                        slidesContainer.appendChild(titleDiv);
                    } else if (slide.title) {
                        const slideDiv = document.createElement('div');
                        slideDiv.className = 'slide-info';
                        
                        let highlightsHtml = '';
                        if (slide.highlights && slide.highlights.length > 0) {
                            highlightsHtml = `
                                <div class="highlights">
                                    ${slide.highlights.map(h => `
                                        <span class="highlight-item">${h.icon} ${h.title}</span>
                                    `).join('')}
                                </div>
                            `;
                        }
                        
                        slideDiv.innerHTML = `
                            <div class="slide-title">📖 第 ${index + 1} 投影片：${slide.title}</div>
                            ${highlightsHtml}
                            <p><strong>內容長度：</strong>${slide.content ? slide.content.length : 0} 字元</p>
                            <p><strong>地圖：</strong>${slide.hasMap ? '✅ 有' : '❌ 無'}</p>
                            <p><strong>測驗：</strong>${slide.quiz ? '✅ 有' : '❌ 無'}</p>
                        `;
                        slidesContainer.appendChild(slideDiv);
                    }
                });
                
                contentEl.style.display = 'block';

            } catch (error) {
                console.error('載入課程失敗:', error);
                statusEl.className = 'test-status error';
                statusEl.innerHTML = `❌ 載入失敗：${error.message}`;
            }
        }

        function showDebugInfo() {
            const debugEl = document.getElementById('debug');
            const debugContent = document.getElementById('debug-content');
            
            if (currentLessonContent) {
                debugContent.innerHTML = `
                    <h4>📊 課程資料結構</h4>
                    <pre style="background: #f8f9fa; padding: 1rem; border-radius: 5px; overflow-x: auto; font-size: 0.9rem;">${JSON.stringify(currentLessonContent, null, 2)}</pre>
                `;
                debugEl.style.display = 'block';
            } else {
                debugContent.innerHTML = '<p>請先載入課程內容</p>';
                debugEl.style.display = 'block';
            }
        }

        function testAllSlides() {
            if (!currentLessonContent) {
                alert('請先載入課程內容');
                return;
            }

            let testResults = [];
            
            currentLessonContent.forEach((slide, index) => {
                let result = {
                    index: index + 1,
                    type: slide.type || 'content',
                    title: slide.title || 'N/A',
                    hasContent: !!slide.content,
                    contentLength: slide.content ? slide.content.length : 0,
                    hasHighlights: !!(slide.highlights && slide.highlights.length > 0),
                    hasMap: !!slide.hasMap,
                    hasQuiz: !!slide.quiz,
                    status: 'success'
                };

                // 基本驗證
                if (slide.type !== 'title' && !slide.title) {
                    result.status = 'warning';
                    result.issue = '缺少標題';
                } else if (slide.type !== 'title' && !slide.content) {
                    result.status = 'warning';
                    result.issue = '缺少內容';
                } else if (slide.content && slide.content.length < 100) {
                    result.status = 'warning';
                    result.issue = '內容過短';
                }

                testResults.push(result);
            });

            // 顯示測試結果
            const debugEl = document.getElementById('debug');
            const debugContent = document.getElementById('debug-content');
            
            const resultsHtml = testResults.map(result => `
                <div style="
                    padding: 0.5rem;
                    margin: 0.25rem 0;
                    border-radius: 5px;
                    background: ${result.status === 'success' ? '#d4edda' : '#fff3cd'};
                    border-left: 4px solid ${result.status === 'success' ? '#28a745' : '#ffc107'};
                ">
                    <strong>投影片 ${result.index}</strong> (${result.type}): ${result.title}
                    <br>
                    <small>
                        內容: ${result.contentLength}字元 | 
                        亮點: ${result.hasHighlights ? '✅' : '❌'} | 
                        地圖: ${result.hasMap ? '✅' : '❌'} | 
                        測驗: ${result.hasQuiz ? '✅' : '❌'}
                        ${result.issue ? ` | ⚠️ ${result.issue}` : ''}
                    </small>
                </div>
            `).join('');

            debugContent.innerHTML = `
                <h4>🧪 投影片測試結果</h4>
                <p><strong>總投影片數：</strong>${testResults.length}</p>
                <p><strong>成功：</strong>${testResults.filter(r => r.status === 'success').length}</p>
                <p><strong>警告：</strong>${testResults.filter(r => r.status === 'warning').length}</p>
                <div style="margin-top: 1rem;">
                    ${resultsHtml}
                </div>
            `;
            debugEl.style.display = 'block';
        }

        // 全域函數
        window.loadLesson = loadLesson;
        window.showDebugInfo = showDebugInfo;
        window.testAllSlides = testAllSlides;

        // 頁面載入時自動載入課程
        loadLesson();
    </script>
</body>
</html>
