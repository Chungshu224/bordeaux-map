<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就系統測試工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .test-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            border-radius: 2px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        button.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button.danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
        }

        .info-section {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea30;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .info-section h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .info-section p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            display: block;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .log-section {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-section .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .log-section .log-entry.success {
            border-left-color: #4ade80;
            color: #a7f3d0;
        }

        .log-section .log-entry.info {
            border-left-color: #60a5fa;
            color: #bfdbfe;
        }

        .log-section .log-entry.warning {
            border-left-color: #fbbf24;
            color: #fde68a;
        }

        .log-section .log-entry.error {
            border-left-color: #f87171;
            color: #fecaca;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .test-sections {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 成就系統測試工具</h1>
            <p>測試成就通知、成就儀表板、成就卡片等功能</p>
        </div>

        <div class="test-sections">
            <!-- 成就解鎖測試 -->
            <div class="section">
                <h2>🎯 成就解鎖測試</h2>
                <div class="info-section">
                    <h3>測試說明</h3>
                    <p>點擊按鈕模擬不同類型的成就解鎖，測試通知系統是否正常運作。</p>
                </div>
                <div class="btn-group">
                    <button onclick="unlockCommonAchievement()">
                        解鎖普通成就 (Common)
                    </button>
                    <button onclick="unlockUncommonAchievement()">
                        解鎖罕見成就 (Uncommon)
                    </button>
                    <button onclick="unlockRareAchievement()">
                        解鎖稀有成就 (Rare)
                    </button>
                    <button onclick="unlockEpicAchievement()" class="secondary">
                        解鎖史詩成就 (Epic)
                    </button>
                    <button onclick="unlockLegendaryAchievement()" class="danger">
                        解鎖傳說成就 (Legendary)
                    </button>
                </div>
            </div>

            <!-- 批量測試 -->
            <div class="section">
                <h2>⚡ 批量測試</h2>
                <div class="info-section">
                    <h3>測試說明</h3>
                    <p>測試多個成就同時解鎖時的通知堆疊效果。</p>
                </div>
                <div class="btn-group">
                    <button onclick="unlockMultipleAchievements(3)" class="success">
                        解鎖 3 個成就
                    </button>
                    <button onclick="unlockMultipleAchievements(5)" class="success">
                        解鎖 5 個成就
                    </button>
                    <button onclick="unlockAllFirstLessonAchievements()" class="success">
                        解鎖所有首次課程成就
                    </button>
                </div>
            </div>

            <!-- 進度模擬 -->
            <div class="section">
                <h2>📊 進度模擬</h2>
                <div class="info-section">
                    <h3>測試說明</h3>
                    <p>模擬學習進度，觸發相關的成就條件。</p>
                </div>
                <div class="btn-group">
                    <button onclick="simulateLessonCompletion()">
                        完成一堂課程
                    </button>
                    <button onclick="simulateQuizPerfection()">
                        測驗滿分
                    </button>
                    <button onclick="simulateStudyStreak(7)">
                        7 天連續學習
                    </button>
                    <button onclick="simulateStudyTime(600)" class="secondary">
                        累積 600 分鐘學習時間
                    </button>
                </div>
            </div>

            <!-- 系統控制 -->
            <div class="section">
                <h2>⚙️ 系統控制</h2>
                <div class="info-section">
                    <h3>測試說明</h3>
                    <p>重置成就系統或查看當前狀態。</p>
                </div>
                <div class="btn-group">
                    <button onclick="showCurrentStats()" class="success">
                        顯示當前統計
                    </button>
                    <button onclick="exportAchievementData()" class="success">
                        匯出成就數據
                    </button>
                    <button onclick="resetAchievements()" class="danger">
                        重置所有成就
                    </button>
                </div>
            </div>
        </div>

        <!-- 統計資訊 -->
        <div class="section">
            <h2>📈 即時統計</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="value" id="unlockedCount">0</span>
                    <span class="label">已解鎖成就</span>
                </div>
                <div class="stat-card">
                    <span class="value" id="totalPoints">0</span>
                    <span class="label">總成就點數</span>
                </div>
                <div class="stat-card">
                    <span class="value" id="currentLevel">1</span>
                    <span class="label">當前等級</span>
                </div>
                <div class="stat-card">
                    <span class="value" id="completionRate">0%</span>
                    <span class="label">完成度</span>
                </div>
            </div>
        </div>

        <!-- 測試日誌 -->
        <div class="section">
            <h2>📝 測試日誌</h2>
            <div class="log-section" id="testLog"></div>
        </div>
    </div>

    <script>
        // 測試日誌功能
        function addLog(message, type = 'info') {
            const logSection = document.getElementById('testLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString('zh-TW');
            logEntry.textContent = `[${timestamp}] ${message}`;
            logSection.insertBefore(logEntry, logSection.firstChild);
            
            // 限制日誌數量
            while (logSection.children.length > 50) {
                logSection.removeChild(logSection.lastChild);
            }
        }

        // 更新統計資訊
        function updateStats() {
            try {
                const achievementData = JSON.parse(localStorage.getItem('achievementData') || '{}');
                const unlockedCount = Object.values(achievementData).filter(a => a.unlocked).length;
                const totalPoints = Object.values(achievementData)
                    .filter(a => a.unlocked)
                    .reduce((sum, a) => sum + a.points, 0);
                const totalAchievements = Object.keys(achievementData).length || 60; // 預設 60 個成就
                const completionRate = totalAchievements > 0 
                    ? ((unlockedCount / totalAchievements) * 100).toFixed(1)
                    : 0;
                const currentLevel = Math.floor(totalPoints / 1000) + 1;

                document.getElementById('unlockedCount').textContent = unlockedCount;
                document.getElementById('totalPoints').textContent = totalPoints;
                document.getElementById('currentLevel').textContent = currentLevel;
                document.getElementById('completionRate').textContent = `${completionRate}%`;
            } catch (error) {
                addLog(`統計更新失敗: ${error.message}`, 'error');
            }
        }

        // 觸發自訂事件（模擬成就解鎖）
        function triggerAchievementNotification(achievementId, achievementData) {
            const event = new CustomEvent('achievementNotification', {
                detail: {
                    id: achievementId,
                    ...achievementData
                }
            });
            window.dispatchEvent(event);
            addLog(`✨ 觸發成就通知: ${achievementData.name}`, 'success');
        }

        // 測試函數：解鎖普通成就
        function unlockCommonAchievement() {
            triggerAchievementNotification('first_lesson', {
                name: '初學者',
                description: '完成第一堂課程',
                icon: '🎓',
                rarity: 'common',
                points: 10
            });
            addLog('解鎖普通成就: 初學者', 'info');
            updateStats();
        }

        // 測試函數：解鎖罕見成就
        function unlockUncommonAchievement() {
            triggerAchievementNotification('five_lessons', {
                name: '認真學習',
                description: '完成 5 堂課程',
                icon: '📚',
                rarity: 'uncommon',
                points: 25
            });
            addLog('解鎖罕見成就: 認真學習', 'info');
            updateStats();
        }

        // 測試函數：解鎖稀有成就
        function unlockRareAchievement() {
            triggerAchievementNotification('quiz_master', {
                name: '測驗大師',
                description: '連續 5 次測驗滿分',
                icon: '🏅',
                rarity: 'rare',
                points: 50
            });
            addLog('解鎖稀有成就: 測驗大師', 'info');
            updateStats();
        }

        // 測試函數：解鎖史詩成就
        function unlockEpicAchievement() {
            triggerAchievementNotification('level_master', {
                name: '等級專家',
                description: '完成一個完整等級的所有課程',
                icon: '⭐',
                rarity: 'epic',
                points: 100
            });
            addLog('解鎖史詩成就: 等級專家', 'warning');
            updateStats();
        }

        // 測試函數：解鎖傳說成就
        function unlockLegendaryAchievement() {
            triggerAchievementNotification('grand_master', {
                name: '葡萄酒大師',
                description: '完成所有課程並達到最高等級',
                icon: '👑',
                rarity: 'legendary',
                points: 500
            });
            addLog('⭐ 解鎖傳說成就: 葡萄酒大師', 'success');
            updateStats();
        }

        // 測試函數：批量解鎖成就
        function unlockMultipleAchievements(count) {
            const achievements = [
                { id: 'first_lesson', name: '初學者', icon: '🎓', rarity: 'common', points: 10 },
                { id: 'five_lessons', name: '認真學習', icon: '📚', rarity: 'uncommon', points: 25 },
                { id: 'ten_lessons', name: '勤奮學生', icon: '📖', rarity: 'uncommon', points: 50 },
                { id: 'quiz_master', name: '測驗大師', icon: '🏅', rarity: 'rare', points: 50 },
                { id: 'speed_learner', name: '快速學習者', icon: '⚡', rarity: 'rare', points: 75 },
                { id: 'level_master', name: '等級專家', icon: '⭐', rarity: 'epic', points: 100 }
            ];

            for (let i = 0; i < Math.min(count, achievements.length); i++) {
                setTimeout(() => {
                    const achievement = achievements[i];
                    triggerAchievementNotification(achievement.id, {
                        name: achievement.name,
                        description: `測試成就 ${i + 1}`,
                        icon: achievement.icon,
                        rarity: achievement.rarity,
                        points: achievement.points
                    });
                }, i * 800); // 每個成就間隔 800ms
            }

            addLog(`批量解鎖 ${count} 個成就`, 'success');
            setTimeout(updateStats, count * 800 + 500);
        }

        // 測試函數：解鎖所有首次課程成就
        function unlockAllFirstLessonAchievements() {
            const firstLessonAchievements = [
                { name: 'L1-1 完成', icon: '🍷', rarity: 'common' },
                { name: 'L1-2 完成', icon: '🍇', rarity: 'common' },
                { name: 'L1-3 完成', icon: '🏰', rarity: 'common' },
                { name: 'L1-4 完成', icon: '🌍', rarity: 'common' },
                { name: 'L1-5 完成', icon: '🗺️', rarity: 'common' }
            ];

            firstLessonAchievements.forEach((achievement, index) => {
                setTimeout(() => {
                    triggerAchievementNotification(`l1_${index + 1}`, {
                        name: achievement.name,
                        description: `完成第一級第 ${index + 1} 堂課`,
                        icon: achievement.icon,
                        rarity: achievement.rarity,
                        points: 10
                    });
                }, index * 600);
            });

            addLog('解鎖所有 Level 1 首次課程成就', 'success');
            setTimeout(updateStats, firstLessonAchievements.length * 600 + 500);
        }

        // 測試函數：模擬課程完成
        function simulateLessonCompletion() {
            triggerAchievementNotification('lesson_complete', {
                name: '課程完成',
                description: '完成一堂課程',
                icon: '✅',
                rarity: 'common',
                points: 10
            });
            addLog('模擬課程完成', 'info');
            updateStats();
        }

        // 測試函數：模擬測驗滿分
        function simulateQuizPerfection() {
            triggerAchievementNotification('perfect_quiz', {
                name: '完美答題',
                description: '測驗獲得滿分',
                icon: '💯',
                rarity: 'uncommon',
                points: 25
            });
            addLog('模擬測驗滿分', 'info');
            updateStats();
        }

        // 測試函數：模擬連續學習
        function simulateStudyStreak(days) {
            triggerAchievementNotification('study_streak', {
                name: `連續學習 ${days} 天`,
                description: `保持 ${days} 天連續學習紀錄`,
                icon: '🔥',
                rarity: days >= 7 ? 'rare' : 'uncommon',
                points: days * 5
            });
            addLog(`模擬 ${days} 天連續學習`, 'info');
            updateStats();
        }

        // 測試函數：模擬學習時間累積
        function simulateStudyTime(minutes) {
            const hours = Math.floor(minutes / 60);
            triggerAchievementNotification('study_time', {
                name: `學習 ${hours} 小時`,
                description: `累積學習時間達到 ${minutes} 分鐘`,
                icon: '⏱️',
                rarity: minutes >= 600 ? 'rare' : 'uncommon',
                points: Math.floor(minutes / 10)
            });
            addLog(`模擬累積學習 ${minutes} 分鐘`, 'info');
            updateStats();
        }

        // 系統函數：顯示當前統計
        function showCurrentStats() {
            try {
                const achievementData = JSON.parse(localStorage.getItem('achievementData') || '{}');
                const unlockedAchievements = Object.entries(achievementData)
                    .filter(([_, data]) => data.unlocked)
                    .map(([id, data]) => ({
                        id,
                        name: data.name || id,
                        unlocked: data.unlockedAt
                    }));

                console.group('🏆 成就系統統計');
                console.log('總成就數:', Object.keys(achievementData).length);
                console.log('已解鎖:', unlockedAchievements.length);
                console.log('已解鎖成就列表:', unlockedAchievements);
                console.groupEnd();

                addLog(`已顯示統計資訊於控制台 (共 ${unlockedAchievements.length} 個)`, 'success');
            } catch (error) {
                addLog(`顯示統計失敗: ${error.message}`, 'error');
            }
        }

        // 系統函數：匯出成就數據
        function exportAchievementData() {
            try {
                const achievementData = localStorage.getItem('achievementData');
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(achievementData);
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "achievements_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                addLog('成就數據已匯出', 'success');
            } catch (error) {
                addLog(`匯出失敗: ${error.message}`, 'error');
            }
        }

        // 系統函數：重置成就
        function resetAchievements() {
            if (confirm('確定要重置所有成就嗎？此操作無法復原！')) {
                localStorage.removeItem('achievementData');
                updateStats();
                addLog('所有成就已重置', 'warning');
                alert('成就系統已重置，請刷新頁面以查看效果。');
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            addLog('成就系統測試工具已啟動', 'success');
            addLog('請點擊按鈕進行各項功能測試', 'info');
            updateStats();

            // 監聽成就通知事件
            window.addEventListener('achievementNotification', (event) => {
                addLog(`收到成就通知事件: ${event.detail.name}`, 'info');
            });
        });

        // 定期更新統計
        setInterval(updateStats, 2000);
    </script>
</body>
</html>
