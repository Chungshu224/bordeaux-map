<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3 課程結構驗證 - 波爾多地理位置整合測試</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .course-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease;
        }
        .course-card:hover {
            transform: translateY(-5px);
        }
        .course-card.loaded {
            border-left-color: #4caf50;
        }
        .course-card.error {
            border-left-color: #f44336;
        }
        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
        .geography-indicator {
            background: #e8f5e8;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #4caf50;
        }
        .summary {
            background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);
            border: 2px solid #4caf50;
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .lesson-content-preview {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ L3 課程結構驗證</h1>
            <h2>波爾多地理位置整合測試</h2>
            <p>驗證所有 L3 課程是否正確包含波爾多地理位置介紹</p>
        </div>

        <div class="summary">
            <h3>📊 整合結果統計</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="total-courses">0</div>
                    <div>課程總數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="successful-courses">0</div>
                    <div>成功載入</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="geography-integrated">0</div>
                    <div>地理整合</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="error-courses">0</div>
                    <div>載入錯誤</div>
                </div>
            </div>
        </div>

        <div id="course-grid" class="course-grid">
            <!-- 課程卡片將在這裡動態生成 -->
        </div>
    </div>

    <script type="module">
        const L3_COURSES = [
            { id: 'l3-1', name: 'L3-1: 氣候變遷對波爾多的影響與應對' },
            { id: 'l3-2', name: 'L3-2: 土壤科學與風土表達' },
            { id: 'l3-3', name: 'L3-3: 極端年份與氣候風險管理' },
            { id: 'l3-4', name: 'L3-4: 葡萄園管理與有機農法' },
            { id: 'l3-5', name: 'L3-5: 釀造工藝整合（紅白酒/甜酒/橡木/技術）' },
            { id: 'l3-6', name: 'L3-6: 調配藝術與釀酒師哲學' },
            // { id: 'l3-7', name: 'L3-7: 傳統釀造工藝與基礎技術' }, // 已合併至 L3-5，測試清單隱藏
            { id: 'l3-8', name: 'L3-8: 現代技術創新與未來趨勢' },
            { id: 'l3-9', name: 'L3-9: 商業分析與市場策略' },
            { id: 'l3-11-part1', name: 'L3-11 Part 1: 波爾多葡萄酒產業史與文化' },
            { id: 'l3-11-part2', name: 'L3-11 Part 2: 文化傳承與現代影響' },
            { id: 'l3-13-part1', name: 'L3-13 Part 1: 創新技術與未來趨勢' },
            { id: 'l3-13-part2', name: 'L3-13 Part 2: 未來發展與趨勢展望' },
            { id: 'l3-gtc', name: 'L3-GTC: 地理、風土與氣候綜合課程' }
        ];

        let stats = {
            total: 0,
            successful: 0,
            geographyIntegrated: 0,
            error: 0
        };

        async function testCourse(course) {
            const courseCard = document.createElement('div');
            courseCard.className = 'course-card';
            courseCard.innerHTML = `
                <h4>${course.name}</h4>
                <div class="status loading">載入中...</div>
                <div class="lesson-content-preview" id="preview-${course.id}">
                    正在載入課程內容...
                </div>
            `;
            
            document.getElementById('course-grid').appendChild(courseCard);

            try {
                // 載入課程內容
                const module = await import(`./src/data/lessons/${course.id}.js`);
                
                // 嘗試找到正確的內容陣列
                let content = null;
                const possibleExports = [
                    'default',
                    'l31Content', 'l32Content', 'l33Content', 'l34Content',
                    'l35Part1Content', 'l35Part2Content', 'l35Part3AContent', 'l35Part3BContent',
                    'l36Content', 'l37Content', 'l38Content', 'l39Content',
                    'l311Part1Content', 'l311Part2Content',
                    'l313Part1Content', 'l313Part2Content',
                    'l3gtcContent'
                ];

                for (const exportName of possibleExports) {
                    if (module[exportName] && Array.isArray(module[exportName])) {
                        content = module[exportName];
                        break;
                    }
                }

                if (!content || !Array.isArray(content)) {
                    throw new Error('無法找到有效的課程內容');
                }

                stats.successful++;

                // 檢查是否包含波爾多地理位置介紹
                const hasGeography = content.some(section => 
                    section.type === 'geography-intro' || 
                    section.title === '認識波爾多地理位置'
                );

                if (hasGeography) {
                    stats.geographyIntegrated++;
                    courseCard.classList.add('loaded');
                    courseCard.innerHTML = `
                        <h4>${course.name}</h4>
                        <div class="status success">✅ 載入成功</div>
                        <div class="geography-indicator">
                            🗺️ <strong>已整合波爾多地理位置介紹</strong>
                        </div>
                        <div class="lesson-content-preview">
                            <strong>課程內容區塊：</strong> ${content.length} 個<br>
                            <strong>首個區塊類型：</strong> ${content[0]?.type || 'unknown'}<br>
                            <strong>地理介紹位置：</strong> 第 ${content.findIndex(s => s.type === 'geography-intro') + 1} 個區塊
                        </div>
                    `;
                } else {
                    courseCard.classList.add('error');
                    courseCard.innerHTML = `
                        <h4>${course.name}</h4>
                        <div class="status error">⚠️ 缺少地理介紹</div>
                        <div class="lesson-content-preview">
                            <strong>課程內容區塊：</strong> ${content.length} 個<br>
                            <strong>首個區塊類型：</strong> ${content[0]?.type || 'unknown'}<br>
                            <strong>問題：</strong> 未包含波爾多地理位置介紹
                        </div>
                    `;
                }

            } catch (error) {
                stats.error++;
                courseCard.classList.add('error');
                courseCard.innerHTML = `
                    <h4>${course.name}</h4>
                    <div class="status error">❌ 載入失敗</div>
                    <div class="lesson-content-preview">
                        <strong>錯誤信息：</strong> ${error.message}
                    </div>
                `;
            }

            updateStats();
        }

        function updateStats() {
            document.getElementById('total-courses').textContent = stats.total;
            document.getElementById('successful-courses').textContent = stats.successful;
            document.getElementById('geography-integrated').textContent = stats.geographyIntegrated;
            document.getElementById('error-courses').textContent = stats.error;
        }

        async function runTests() {
            stats.total = L3_COURSES.length;
            updateStats();

            // 並行測試所有課程
            const promises = L3_COURSES.map(course => testCourse(course));
            await Promise.allSettled(promises);

            // 顯示最終結果
            console.log('測試完成', stats);
        }

        // 頁面載入時開始測試
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
