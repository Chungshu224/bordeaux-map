<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波爾多L1-1課程測試 - 地理位置與三河匯流</title>
    <script type="module" src="./src/main.js"></script>
</head>
<body>
    <div id="app">
        <div style="padding: 20px;">
            <h1>L1-1 課程測試頁面</h1>
            <p>測試動態載入的波爾多地理位置與三河匯流課程內容</p>
            
            <!-- 課程組件 -->
            <div id="lesson-container">
                <presentation-lesson lesson-id="l1-1"></presentation-lesson>
            </div>
            
            <!-- 導航測試 -->
            <div style="margin-top: 20px; padding: 20px; border: 1px solid #ddd;">
                <h3>課程導航測試</h3>
                <button onclick="testLesson('l1-1')">L1-1 地理位置</button>
                <button onclick="testLesson('l1-2')">L1-2 氣候環境</button>
                <button onclick="testLesson('l1-3')">L1-3 葡萄品種</button>
                <button onclick="testLesson('l1-4')">L1-4 左右岸差異</button>
                <button onclick="testLesson('l1-5')">L1-5 酒款類型</button>
                <button onclick="testLesson('l1-6')">L1-6 AOC分級</button>
                <button onclick="testLesson('l1-7')">L1-7 品酒基礎</button>
                <button onclick="testLesson('l1-8')">L1-8 總結評估</button>
            </div>
            
            <!-- 課程狀態顯示 -->
            <div style="margin-top: 20px; padding: 20px; background: #f5f5f5;">
                <h3>當前課程狀態</h3>
                <p id="current-lesson">當前課程: L1-1</p>
                <p id="loading-status">載入狀態: 準備中</p>
                <p id="content-info">內容信息: 等待載入</p>
            </div>
        </div>
    </div>

    <script>
        function testLesson(lessonId) {
            console.log(`Testing lesson: ${lessonId}`)
            document.getElementById('current-lesson').textContent = `當前課程: ${lessonId}`
            document.getElementById('loading-status').textContent = '載入狀態: 載入中...'
            
            // 動態更新課程
            const lessonContainer = document.querySelector('#lesson-container presentation-lesson')
            if (lessonContainer) {
                lessonContainer.setAttribute('lesson-id', lessonId)
            }
        }
        
        // 監聽組件載入狀態
        document.addEventListener('DOMContentLoaded', function() {
            console.log('L1-1 課程測試頁面載入完成')
            document.getElementById('loading-status').textContent = '載入狀態: 頁面已準備'
        })
    </script>

    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        button {
            margin: 5px;
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        #lesson-container {
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            min-height: 400px;
        }
    </style>
</body>
</html>
